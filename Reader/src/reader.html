<!doctype html>
<!--
  Parley Reader page template. tools/build_reader.sh turns it into Reader/ParleyReader.html by
  filling the three script placeholders below (art, core.js, markdown.js). Everything the page
  shows from a file is built with createElement and textContent; nothing goes over the network.
-->
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; base-uri 'none'; form-action 'none'">
<meta name="google" content="notranslate">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Parley Reader</title>
<style>
:root {
  --rounded: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
  --system: system-ui, -apple-system, "Helvetica Neue", "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --lettered: "Noteworthy", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --wall-w: 268px;
  /* Fallback colours until the script applies the chosen skin (cardboard, light). */
  --paper: #FBF1DF; --paperDeep: #F4E3C6; --card: #FFF8EA; --ink: #3A2416; --inkSoft: #6E4F39;
  --wall: #D8B07A; --wallDeep: #C4955C; --wallInk: #2E1B0F; --stitch: #C4955C; --ember: #C24A20;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  font: 13px/1.25 var(--rounded);
  overflow: hidden; -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.lettered { font-family: var(--lettered); font-weight: 700; }

/* ---- shapes: an SVG behind the content, redrawn on resize */
.has-shape { position: relative; isolation: isolate; }
.shape { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; z-index: -1; pointer-events: none; }
.shadow-paper { filter: drop-shadow(0 1.5px 3px rgba(0,0,0,.10)); }
.shadow-code { filter: drop-shadow(0 1.5px 3px rgba(0,0,0,.14)); }
.shadow-pic { filter: drop-shadow(0 4px 8px rgba(0,0,0,.22)); }
.shadow-row { filter: drop-shadow(0 1.5px 2.5px rgba(0,0,0,.18)); }
.shadow-btn { filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.12)); }
.washi { position: absolute; pointer-events: none; overflow: visible; }
.icon { width: 1em; height: 1em; flex: none; overflow: visible; vertical-align: -0.125em; }

/* ---- layout */
.app { display: grid; grid-template-columns: var(--wall-w) minmax(0, 1fr); height: 100vh; height: 100dvh; }
.app.wall-hidden { grid-template-columns: 0 minmax(0, 1fr); }
.app.wall-hidden .wall { display: none; }
.scrim { display: none; }

/* ---- the wall (sidebar) */
.wall {
  position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0;
  color: var(--wallInk); isolation: isolate;
  background: linear-gradient(to bottom, var(--wall), var(--wall-bottom)), var(--paper); /* over the window's paper, like the app */
  border-right: 1px solid var(--wallDeep);
}
.wall::before, .wall::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: -1; }
.wall::before { background: repeating-linear-gradient(90deg, transparent 0 2.5px, var(--corrugation) 2.5px 3.5px, transparent 3.5px 7px); }
.wall::after { background-image: var(--grain-wall); background-size: 96px 96px; opacity: var(--grain-wall-opacity); }
.seam { position: absolute; top: 0; bottom: 0; right: -5px; width: 9px; cursor: col-resize; z-index: 3; touch-action: none; }
.wall-top { position: relative; height: 76px; flex: none; }
.bunting { position: absolute; left: 0; right: 0; top: 34px; height: 40px; width: 100%; pointer-events: none; }
.wall-buttons { position: absolute; top: 5px; right: 10px; display: flex; gap: 6px; }
.round-btn {
  width: 30px; height: 30px; border-radius: 50%; border: 0; padding: 0; flex: none;
  display: inline-grid; place-items: center; font-size: 14px;
  background: var(--paperDeep); color: var(--inkSoft); transition: background .12s;
}
.round-btn:hover { background: var(--emberWash); }
.round-btn:active { opacity: .7; }
.wall .round-btn { width: 28px; height: 28px; color: var(--wallInk); background: rgb(var(--tag-rgb) / .45); }
.wall .round-btn:hover { background: rgb(var(--tag-rgb) / .75); }
.wordmark { padding: 0 16px; margin: 8px 0 0; font-size: 30px; line-height: normal; color: var(--wallInk); }
.search { margin: 8px 12px 8px; padding: 7px 10px; display: flex; align-items: center; gap: 6px; color: var(--inkSoft); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; color: var(--ink); font-size: 13px; padding: 0; }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
.search input { -webkit-appearance: none; appearance: none; }
.search input::placeholder { color: var(--inkSoft); opacity: 1; }
.search:focus-within .shape path { stroke: var(--ember); stroke-width: 1.5px; }
.clear-btn { border: 0; background: none; padding: 0; color: var(--inkSoft); display: inline-grid; place-items: center; font-size: 13px; }
.list { flex: 1; min-height: 0; overflow-y: auto; padding: 0 0 12px; scrollbar-width: thin; }
.group-title { font-family: var(--lettered); font-weight: 700; font-size: 15px; color: var(--wallInkSoft); padding: 10px 14px 2px; margin: 0; }
.rows { list-style: none; margin: 0; padding: 0; }
/* The list insets (2px, 8px) plus the inset of the app's sidebar List style: row text lands at x = 34. */
.row { position: relative; margin: 2px 23px 2px 24px; display: flex; align-items: center; }
.row-main {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; text-align: left;
  padding: 7px 10px; border: 0; background: none; color: var(--wallInk); border-radius: 8px;
}
.row-main:focus-visible { outline: none; }
.row-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row-title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-sub { font-size: 11px; color: var(--wallInkSoft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.locked .row-title { color: var(--wallInkSoft); }
.row-lock { font-size: 11px; color: var(--wallInkSoft); flex: none; display: inline-grid; }
.row .shape path { fill: var(--tag); fill-opacity: 0; stroke: var(--ember); stroke-opacity: 0; stroke-width: 1.5px; }
.row:hover .shape path { fill-opacity: .35; }
.row.selected .shape path { fill-opacity: 1; }
.row:has(.row-main:focus-visible) .shape path { stroke-opacity: 1; }
.row.selected .row-main { color: var(--ink); }
.row.selected .row-title { font-weight: 600; color: var(--ink); }
.row.selected .row-sub { color: var(--inkSoft); }
.row.selected .row-lock { color: var(--brass); }
.row.selected.locked .row-title { font-weight: 500; color: var(--inkSoft); }
.row .washi { display: none; right: -6px; top: -3px; }
.row.selected .washi { display: block; }
.row .shape { filter: none; }
.row.selected .shape { filter: drop-shadow(0 1.5px 2.5px rgba(0,0,0,.18)); }
.row-remove {
  position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
  width: 20px; height: 20px; border-radius: 50%; border: 0; padding: 0; display: grid; place-items: center;
  background: var(--paperDeep); color: var(--inkSoft); font-size: 10px; opacity: 0; transition: opacity .12s;
}
.row:hover .row-remove, .row:focus-within .row-remove { opacity: 1; }
/* The viewer-only remove button gets its own room, so the padlock always stays visible. */
.row:hover .row-main, .row:focus-within .row-main { padding-right: 30px; }
@media (hover: none) { .row-remove { opacity: .8; } .row-main { padding-right: 30px; } }
.search input:focus-visible, .pw-field input:focus-visible { outline: none; } /* the shape's ember edge shows focus */
.wall-empty { padding: 30px 16px; text-align: center; color: var(--wallInk); }
.wall-empty .lettered { font-size: 20px; margin-bottom: 6px; }
.wall-empty p { margin: 0; font-size: 12px; color: var(--wallInkSoft); }
.wall-foot { flex: none; display: flex; gap: 8px; align-items: center; padding: 8px 12px 10px; border-top: 1px solid rgb(var(--wallInk-rgb) / .12); font-size: 11px; color: var(--wallInkSoft); flex-wrap: wrap; }
.wall-foot label { display: flex; align-items: center; gap: 4px; }
.wall-foot select { font-size: 11px; color: var(--ink); background: rgb(var(--tag-rgb) / .7); border: 1px solid rgb(var(--wallInk-rgb) / .25); border-radius: 6px; padding: 2px 4px; }
.menu {
  position: fixed; z-index: 60; min-width: 160px; padding: 4px; background: var(--card); color: var(--ink);
  border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.18);
}
.menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 6px 10px; border-radius: 5px; font-size: 13px; }
.menu button:hover, .menu button:focus-visible { background: var(--emberWash); outline: none; }

/* ---- the room (detail) */
.room { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; isolation: isolate; }
.room::before, .room::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: -1; }
.room::before { background: var(--room-glow); }
.room::after { background-image: var(--grain-room); background-size: 96px 96px; opacity: var(--grain-room-opacity); }
.room-header { position: relative; height: 54px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 18px; }
.room-header::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 1.25px;
  background: repeating-linear-gradient(90deg, var(--stitch) 0 6px, transparent 6px 11px);
}
.header-titles { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.header-title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.header-sub { font-size: 11px; color: var(--inkSoft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.room-body { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
.scroller { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; }
.parcel { position: relative; display: inline-flex; align-items: center; gap: 5px; padding: 5px 8px 5px 22px; font-size: 13px; color: var(--ink); max-width: 260px; flex: none; }
.parcel .icon { color: var(--inkSoft); }
.parcel-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
.parcel .shape path.tag { fill: var(--tag); stroke: var(--line); stroke-width: 1px; }
.parcel .shape circle { fill: var(--paper); stroke: var(--line); stroke-width: 1px; }
.parcel .shape path.string { fill: none; stroke: var(--stitch); stroke-width: 1.25px; stroke-linecap: round; }
.parcel .shape { filter: drop-shadow(0 1px 2px rgba(0,0,0,.12)); }

/* centred screens: empty state, unlock */
.centred { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; padding: 40px; }
.centred .lettered.big { font-size: 30px; line-height: 1.15; margin: 0; }
.centred p { margin: 0; color: var(--inkSoft); max-width: 460px; }
/* the empty detail: top-aligned scroll content, like the app's EmptyDetailView */
.empty-detail { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding: 40px; }
.empty-detail .lettered.big { font-size: 30px; line-height: 1.15; margin: 0; }
.empty-detail p { margin: 0; color: var(--inkSoft); max-width: 460px; }
.empty-detail .taped { margin-bottom: 12px; }
.taped { position: relative; padding: 9px; max-width: 100%; }
.taped img, .taped .art-missing { display: block; width: 100%; height: auto; border-radius: 6px; object-fit: cover; background: var(--paperDeep); }
.taped .washi { left: 50%; top: -10px; }
.privacy { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--inkSoft); margin-top: 18px; max-width: 460px; text-align: left; }
.privacy .icon { color: var(--brass); font-size: 11px; }
.tag-btn {
  position: relative; isolation: isolate; border: 0; background: none; padding: 6px 14px;
  font: 600 13px/1.25 var(--rounded); color: var(--onEmber); transition: transform .08s;
}
.tag-btn .shape path { fill: var(--ember); }
.tag-btn:active { transform: scale(.98); }
.tag-btn:active .shape { filter: brightness(.95); }
.tag-btn.soft { color: var(--ink); }
.tag-btn.soft .shape path { fill: var(--paperDeep); stroke: rgb(var(--inkFaint-rgb) / .55); stroke-width: 1px; }
.tag-btn:disabled { color: var(--inkSoft); cursor: default; transform: none; }
.tag-btn:disabled .shape { filter: none; }
.tag-btn:disabled .shape path { fill: var(--paperDeep); stroke: rgb(var(--inkFaint-rgb) / .55); stroke-width: 1px; stroke-dasharray: 3 3; }
.pw-row { display: flex; gap: 10px; align-items: center; margin-top: 4px; flex-wrap: wrap; justify-content: center; }
.pw-field { width: 260px; max-width: 100%; padding: 7px 10px; display: flex; }
.pw-field input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 13px; color: var(--ink); padding: 0; }
.pw-field input::placeholder { color: var(--inkSoft); opacity: 1; }
.pw-field .shape path { fill: var(--tag); stroke: var(--line); stroke-width: 1px; }
.pw-field:focus-within .shape path { stroke: var(--ember); stroke-width: 1.5px; }
.pw-field.shake { animation: shake .4s linear; }
@keyframes shake { 0%,100% { transform: translateX(0); } 12.5% { transform: translateX(8px); } 37.5% { transform: translateX(-8px); } 62.5% { transform: translateX(8px); } 87.5% { transform: translateX(-8px); } }
.status-slot { min-height: 20px; max-width: 420px; display: flex; align-items: center; justify-content: center; }
.spinner-line { display: inline-flex; align-items: center; gap: 8px; color: var(--inkSoft); font-size: 12px; }
.spinner { width: 14px; height: 14px; animation: spin 1.2s linear infinite; color: var(--emberText); }
@keyframes spin { to { transform: rotate(360deg); } }
.notice { display: inline-flex; align-items: flex-start; gap: 6px; padding: 7px 10px; border-radius: 8px; border: 1.5px solid; font-size: 12px; font-weight: 500; text-align: left; }
.notice.danger { color: var(--danger); background: var(--dangerWash); border-color: var(--danger); }
.notice .icon { margin-top: 1px; }
.unlock-meta { display: flex; flex-direction: column; gap: 5px; align-items: center; }
.unlock-meta .where { font-size: 10px; color: var(--inkSoft); max-width: 420px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.unlock-meta .warn { font-size: 12px; font-weight: 500; color: var(--ink); }

/* ---- conversation */
.column { max-width: 740px; margin: 0 auto; padding: 16px 0 8px; }
.msg { padding: 9px 20px; content-visibility: auto; contain-intrinsic-size: auto 90px; }
.msg-user { display: flex; justify-content: flex-end; align-items: flex-start; gap: 8px; padding-left: 80px; }
.msg-user .stack { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; min-width: 0; max-width: 100%; }
.note { padding: 9px 14px; font: 13px/18px var(--system); color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
.note .shape path { fill: var(--peach); }
.msg-assistant { display: flex; flex-direction: column; align-items: stretch; gap: 6px; }
.msg-assistant > * { max-width: 100%; }
.a-head { position: relative; display: flex; align-items: center; gap: 5px; min-height: 24px; }
.a-model { font-size: 10px; font-weight: 500; color: var(--inkSoft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.a-time { font-size: 10px; color: var(--inkFaint); white-space: nowrap; }
.actions { display: flex; gap: 4px; opacity: 0; transition: opacity .12s; }
.msg:hover .actions, .actions:focus-within { opacity: 1; }
@media (hover: none) { .actions { opacity: .85; } }
.a-head .actions { position: absolute; right: 0; top: 0; }
.msg-user .actions { padding-top: 2px; flex: none; }
.paper-btn {
  width: 24px; height: 24px; border-radius: 50%; padding: 0; display: grid; place-items: center;
  background: var(--card); color: var(--inkSoft); border: 1px solid var(--line); font-size: 11px;
  box-shadow: 0 1px 1.5px rgba(0,0,0,.10);
}
.paper-btn:hover { background: var(--paperDeep); color: var(--ink); }
.forked { font-size: 10px; color: var(--inkFaint); padding: 0 20px 4px; }
.small-note { display: flex; gap: 5px; align-items: flex-start; font-size: 10px; line-height: 13px; color: var(--inkSoft); }
.small-note .icon { margin-top: 1px; }
.footer-stats { font-size: 10px; color: var(--inkFaint); font-variant-numeric: tabular-nums; }
.stopped { display: flex; gap: 8px; align-items: center; font-size: 10px; color: var(--inkSoft); }
.row-failed { font-size: 11px; color: var(--inkSoft); font-style: italic; }

/* thinking disclosure */
.disclosure-btn { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 1px 0; font-size: 12px; color: var(--inkSoft); text-align: left; align-self: flex-start; }
.chev { font-size: 10px; transition: transform .15s ease-in-out; }
[aria-expanded="true"] > .chev { transform: rotate(90deg); }
.thinking-body {
  margin: 6px 0 0 5px; padding-left: 14px; font: 12px/17px var(--mono); color: var(--inkSoft); white-space: pre-wrap; overflow-wrap: anywhere;
  background: radial-gradient(circle, var(--stitch) 1px, transparent 1.2px) left 0 top 2px / 2px 5.6px repeat-y;
}

/* tool calls */
.tool { display: flex; flex-direction: column; align-items: flex-start; }
.slip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; border: 0; background: none; padding: 6px 11px 6px 15px; font-size: 12px; color: var(--ink); text-align: left; }
.slip .shape path { fill: var(--card); }
.slip::before { content: ""; position: absolute; left: 7.4px; top: 6px; bottom: 6px; width: 1.25px; background: repeating-linear-gradient(to bottom, var(--stitch) 0 3px, transparent 3px 7px); }
.slip .chev, .slip .wrench { color: var(--inkSoft); }
.slip-title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.slip-dot { color: var(--inkFaint); }
.slip-status { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.slip-time { color: var(--inkFaint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tool-body { position: relative; margin: 6px 0 0 7px; padding-left: 13px; display: flex; flex-direction: column; gap: 8px; width: calc(100% - 7px); }
.tool-body::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 1.25px; background: repeating-linear-gradient(to bottom, var(--stitch) 0 3px, transparent 3px 7px); }
.board-block { background: var(--board); color: var(--boardInk); border-radius: 9px; padding: 7px 12px 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.board-head { display: flex; align-items: center; gap: 6px; }
.board-title { font-size: 10px; font-weight: 500; color: var(--boardInkSoft); flex: 1; }
.board-copy { width: 18px; height: 18px; border: 0; background: none; padding: 0; color: var(--boardInkSoft); font-size: 10px; display: grid; place-items: center; }
.board-text { margin: 0; font: 12px/17px var(--mono); color: var(--boardInk); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 240px; overflow-y: auto; color-scheme: dark; user-select: text; }
.board-more { font-size: 10px; color: var(--boardInkSoft); }
.tool-lines { display: flex; flex-direction: column; gap: 2px; font-size: 10px; color: var(--inkSoft); }

/* attachments */
.strip { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
.msg-user .strip { justify-content: flex-end; }
.thumb { width: 120px; height: 120px; padding: 7px; border: 0; background: none; flex: none; }
.thumb .shape path { fill: var(--card); }
.thumb img, .thumb .no-image { width: 106px; height: 106px; display: grid; place-items: center; object-fit: cover; border-radius: 4px; background: var(--paperDeep); color: var(--inkSoft); font-size: 22px; }
.thumb .washi { left: 50%; top: -6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 0; background: none; font-size: 12px; color: var(--ink); }
.chip .shape path { fill: var(--card); }
.chip .icon { color: var(--emberText); }
.chip span { white-space: nowrap; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }

/* markdown */
.md { display: flex; flex-direction: column; gap: 8px; font: 13px/19px var(--system); color: var(--ink); width: 100%; min-width: 0; user-select: text; }
.md-p, .md-li-text, .md-quote { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
.md-h { font-family: var(--rounded); font-weight: 600; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.md-h1 { font-size: 17px; line-height: 22px; padding-top: 6px; }
.md-h2 { font-size: 15px; line-height: 20px; padding-top: 6px; }
.md-h3 { font-size: 13px; line-height: 16px; padding-top: 3px; }
.md-list { display: flex; flex-direction: column; gap: 4px; }
.md-li { display: flex; align-items: baseline; gap: 6px; }
.md-marker { color: var(--emberText); min-width: 14px; text-align: right; flex: none; font-variant-numeric: tabular-nums; }
.md-li-text { min-width: 0; flex: 1; }
.md-quote { position: relative; color: var(--inkSoft); padding-left: 12px; }
.md-quote::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; border-radius: 1.5px; background: var(--stitch); }
.md-rule { height: 1.25px; margin: 6px 0; background: repeating-linear-gradient(90deg, var(--stitch) 0 6px, transparent 6px 11px); }
.i-em { font-style: italic; }
.i-strong { font-weight: 700; }
.i-strike { text-decoration: line-through; }
.i-code { font-family: var(--mono); font-size: 12px; background: var(--paperDeep); padding: 0 1px; }
.md-link { color: var(--emberText); cursor: pointer; border-radius: 2px; }
.md-link:hover { text-decoration: underline; text-decoration-thickness: 1px; }
.code-card { color: var(--boardInk); min-width: 0; }
.code-card .shape path { fill: var(--board); }
.code-head { display: flex; align-items: center; padding: 6px 6px 0 12px; }
.code-lang { flex: 1; font: 500 10px/1.3 var(--mono); color: var(--boardInkSoft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.code-copy { width: 20px; height: 18px; border: 0; background: none; padding: 0; color: var(--boardInkSoft); font-size: 10px; display: grid; place-items: center; }
.code-body { margin: 0; padding: 2px 12px 12px; font: 12px/17px var(--mono); color: var(--boardInk); white-space: pre; overflow-x: auto; scrollbar-width: none; tab-size: 4; user-select: text; }
.code-body::-webkit-scrollbar { display: none; }

/* error callout */
.callout { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 12px; border: 1.5px solid var(--danger); background: var(--dangerWash); width: 100%; text-align: left; }
.callout > .icon { color: var(--danger); font-size: 14px; margin-top: 1px; }
.callout-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
.callout-title { font-size: 12px; font-weight: 500; color: var(--ink); overflow-wrap: anywhere; }
.callout-detail { font-size: 12px; color: var(--inkSoft); overflow-wrap: anywhere; }
.callout-row { display: flex; gap: 10px; align-items: center; font-size: 10px; color: var(--inkSoft); }
.callout-toggle { border: 0; background: none; padding: 0; font-size: 10px; color: var(--danger); text-decoration: underline; }
.callout-raw { font: 11px/15px var(--mono); color: var(--inkSoft); white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
.msg-user .callout { max-width: 520px; }

/* empty chat invitation */
/* a chat with no messages: the card centred both ways (the app's EmptyChatHint fills the room) */
.scroller.no-messages { display: flex; flex-direction: column; }
.scroller.no-messages > .column { flex: 1 0 auto; width: 100%; display: flex; flex-direction: column; justify-content: center; }
.invite { margin: 24px auto; max-width: 430px; padding: 26px 30px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.invite .shape path.fill { fill: var(--card); }
.invite .shape path.stitch { fill: none; stroke: var(--stitch); stroke-width: 1.25px; stroke-dasharray: 6 5; stroke-linecap: round; }
.invite .washi { left: 50%; top: -9px; }

.to-bottom {
  position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); width: 30px; height: 30px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 13px; display: grid; place-items: center;
  box-shadow: 0 1px 3px rgba(0,0,0,.12); opacity: 0; pointer-events: none; transition: opacity .15s;
}
.to-bottom.shown { opacity: 1; pointer-events: auto; }

/* toasts (file errors) */
.toasts { position: fixed; right: 16px; bottom: 16px; z-index: 40; display: flex; flex-direction: column; gap: 8px; max-width: min(380px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow-y: auto; }
.toast { flex: none; }
.toast { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--danger); background: var(--dangerWash); color: var(--ink); font-size: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.12); }
.toast > .icon { color: var(--danger); margin-top: 1px; }
.toast-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.toast-text strong { display: block; font-weight: 600; }
.toast button { border: 0; background: none; padding: 2px; color: var(--inkSoft); display: grid; place-items: center; }

/* drop overlay */
.drop { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgb(var(--paper-rgb) / .7); pointer-events: none; }
.drop-card { padding: 30px 40px; font-size: 20px; color: var(--ink); }
.drop-card .shape path.fill { fill: var(--card); }
.drop-card .shape path.stitch { fill: none; stroke: var(--ember); stroke-width: 1.5px; stroke-dasharray: 6 5; stroke-linecap: round; }

/* dialogs */
dialog { border: 0; padding: 0; background: transparent; color: var(--ink); max-width: calc(100vw - 32px); max-height: calc(100vh - 32px); overflow: visible; }
dialog::backdrop { background: rgba(0,0,0,.35); }
.sheet { background: var(--paper); border-radius: 12px; padding: 20px; box-shadow: 0 12px 40px rgba(0,0,0,.3); display: flex; flex-direction: column; gap: 14px; max-height: calc(100vh - 32px); overflow: auto; }
.link-sheet { width: 480px; max-width: 100%; }
.notice-card { padding: 14px; border-radius: 12px; border: 1.5px solid var(--attention); background: var(--attentionWash); display: flex; flex-direction: column; gap: 12px; }
.notice-head { display: flex; align-items: center; gap: 9px; }
.hand { width: 26px; height: 26px; border-radius: 50%; background: var(--attention); color: var(--paper); display: grid; place-items: center; font-size: 13px; flex: none; }
.notice-head h2 { margin: 0; font: 600 16px/1.25 var(--rounded); }
.notice-card p { margin: 0; font-size: 12px; }
.site { display: flex; flex-direction: column; gap: 3px; }
.site-label { font-size: 12px; font-weight: 500; color: var(--inkSoft); }
.site-host { font: 600 14px/1.3 var(--mono); word-break: break-all; user-select: text; }
.board-text.address { word-break: break-all; max-height: 200px; }
.hidden-warn { display: flex; gap: 6px; align-items: flex-start; font-size: 12px; font-weight: 500; color: var(--caution); padding: 7px 10px; background: var(--cautionWash); border: 1.5px solid var(--caution); border-radius: 8px; }
.sheet-buttons { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.sheet-btn { border-radius: 10px; padding: 6px 14px; font: 600 13px/1.25 var(--rounded); border: 1px solid transparent; box-shadow: 0 1px 1.5px rgba(0,0,0,.12); transition: transform .08s; }
.sheet-btn:active { transform: scale(.98); filter: brightness(.95); }
.sheet-btn.soft { background: var(--paperDeep); color: var(--ink); border-color: rgb(var(--inkFaint-rgb) / .55); }
.sheet-btn.primary { background: var(--ember); color: var(--onEmber); }
.sheet-btn.primary:disabled { background: var(--paperDeep); color: var(--inkSoft); border: 1px dashed rgb(var(--inkFaint-rgb) / .55); box-shadow: none; cursor: default; transform: none; filter: none; }
.preview-sheet { padding: 8px; }
.preview-sheet img { display: block; max-width: min(700px, calc(100vw - 48px)); max-height: min(700px, calc(100vh - 80px)); object-fit: contain; border-radius: 6px; }
.text-sheet { width: 560px; height: 420px; max-width: 100%; padding: 12px; gap: 6px; }
.text-sheet h2, .info-sheet h2 { margin: 0; font: 600 13px/1.3 var(--rounded); overflow-wrap: anywhere; }
.text-sheet pre { flex: 1; min-height: 0; margin: 0; overflow: auto; font: 12px/16px var(--mono); white-space: pre; user-select: text; background: var(--card); border-radius: 8px; padding: 8px; }
.sheet-close { align-self: flex-end; }
.info-sheet { width: 520px; max-width: 100%; }
.info-sheet .viewer-note { font-size: 11px; color: var(--inkSoft); margin: -8px 0 0; }
.info-grid { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: 12px; margin: 0; }
.info-grid dt { color: var(--inkSoft); }
.info-grid dd { margin: 0; overflow-wrap: anywhere; }
.info-prompt { margin: 0; font: 12px/17px var(--system); white-space: pre-wrap; overflow-wrap: anywhere; background: var(--card); border-radius: 8px; padding: 8px 10px; max-height: 260px; overflow: auto; user-select: text; }
.info-prompt.none { color: var(--inkSoft); font-style: italic; }

/* narrow windows: the wall becomes an overlay */
@media (max-width: 640px) {
  .app, .app.wall-hidden { grid-template-columns: minmax(0, 1fr); }
  .app .wall, .app.wall-hidden .wall {
    display: flex; position: fixed; z-index: 30; left: 0; top: 0; bottom: 0; width: min(300px, 86vw);
    transform: translateX(-104%); transition: transform .2s ease; box-shadow: 0 0 24px rgba(0,0,0,.25); visibility: hidden;
  }
  .app.wall-open .wall { transform: none; visibility: visible; }
  .app.wall-open .scrim { display: block; position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,.3); }
  .seam { display: none; }
  .msg { padding-left: 14px; padding-right: 14px; }
  .msg-user { padding-left: 40px; }
  .centred { padding: 28px 16px; }
  .room-header { padding: 0 12px; gap: 8px; }
  .parcel { max-width: 40vw; }
  .parcel-text { max-width: 30vw; }
}
/* printing (or saving as PDF): the whole conversation, without the wall and the controls */
@media print {
  html, body { height: auto; overflow: visible; }
  .app, .app.wall-hidden { display: block; height: auto; }
  .wall, .scrim, .to-bottom, .toasts, .actions, .drop, .menu, .room-header .round-btn { display: none !important; }
  .room, .room-body, .scroller { display: block; overflow: visible; height: auto; min-height: 0; flex: none; }
  .msg { content-visibility: visible; contain-intrinsic-size: none; }
  .board-text, .info-prompt { max-height: none; overflow: visible; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation-duration: .01ms !important; }
}

<noscript><p style="padding:20px">Parley Reader needs JavaScript to open conversation files. It runs entirely in this tab.</p></noscript>

      <svg class="bunting" id="bunting" aria-hidden="true" focusable="false"></svg>
      <div class="wall-buttons">

    </div>
    <nav class="list" id="list" aria-label="Opened conversations"></nav>
    <div class="wall-foot">
      <label>Skin <select id="skin-select" aria-label="Skin"></select></label>
      <label>Light <select id="appearance-select" aria-label="Appearance"></select></label>
    </div>
    <div class="seam" id="seam" aria-hidden="true"></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="room" id="room"></main>
</div>
<input type="file" id="file-input" multiple accept=".json,application/json" hidden>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div class="sr-only" id="announcer" role="status" aria-live="polite"></div>
<div class="drop" id="drop" hidden><div class="drop-card lettered" id="drop-card">Drop Parley files to open them</div></div>
<dialog id="link-dialog" aria-labelledby="link-title"></dialog>
<dialog id="image-dialog" aria-label="Image preview"></dialog>
<dialog id="text-dialog" aria-label="Text file preview"></dialog>
<dialog id="info-dialog" aria-label="Conversation details"></dialog>

    renderList();
    renderRoom();
    closeOverlayWall();
  }

  // ===========================================================================================
  // Toasts for files that cannot be opened (file names only, never their content).
  const toasts = document.getElementById('toasts');
  function toast(title, message) {
    const close = h('button', { type: 'button', 'aria-label': 'Dismiss', title: 'Dismiss' }, icon('xmark'));
    const el = h('div', { class: 'toast' }, icon('triangleFill'), h('div', { class: 'toast-text' }, h('strong', { text: title }), message), close);
    on(close, 'click', () => el.remove());
    toasts.append(el);
    setTimeout(() => el.remove(), 12000);
  }

  // ===========================================================================================
  // The wall: list of opened files, grouped like the app.
  const listEl = document.getElementById('list');
  const searchInput = document.getElementById('search-input');
  const searchClear = document.getElementById('search-clear');
  const fold = t => t.normalize('NFD').replace(/\p{M}/gu, '').toLocaleLowerCase();

  function groupOf(date) {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
    const week = new Date(today); week.setDate(today.getDate() - 7);
    if (date >= today) return ['Today', fmtTime(date)];
    if (date >= yesterday) return ['Yesterday', fmtTime(date)];
    if (date >= week) return ['Previous 7 Days', fmtWeekday(date)];
    return ['Older', fmtDate(date)];
  }

  function renderList() {
    const hadFocus = listEl.contains(document.activeElement) ? document.activeElement.getAttribute('data-key') : null;
    dropShapes(listEl);
    listEl.replaceChildren();
    const query = fold(searchInput.value.trim());
    searchClear.hidden = searchInput.value === '';
    if (!entries.length) {
      listEl.append(h('div', { class: 'wall-empty' }, h('div', { class: 'lettered', text: 'The wall is bare' }), h('p', { text: 'Open or drop Parley .json files here.' })));
      return;
    }
    const shown = entries.filter(e => !query || (e.conversation && fold(titleOf(e)).includes(query)))
      .map(e => ({ e, date: sortDate(e) }))
      .sort((a, b) => b.date - a.date);
    if (!shown.length) {
      listEl.append(h('div', { class: 'wall-empty' }, h('div', { class: 'lettered', text: 'Not on this wall' }),
        h('p', { text: `No conversation matches “${searchInput.value.trim()}”.` })));
      return;
    }
    const groups = new Map();
    for (const item of shown) {
      const [group, label] = groupOf(item.date);
      if (!groups.has(group)) groups.set(group, []);
      groups.get(group).push({ ...item, label });
    }
    for (const name of ['Today', 'Yesterday', 'Previous 7 Days', 'Older']) {
      const items = groups.get(name);
      if (!items) continue;
      const headId = 'group-' + name.replace(/\W/g, '');
      listEl.append(h('h2', { class: 'group-title', id: headId, text: name }));
      const ul = h('ul', { class: 'rows', 'aria-labelledby': headId });
      for (const { e, label } of items) ul.append(rowFor(e, label));
      listEl.append(ul);
    }
    if (hadFocus) { const again = listEl.querySelector(`[data-key="${CSS.escape(hadFocus)}"]`); if (again) again.focus(); }
  }

  function rowFor(entry, dateLabel) {
    const locked = entry.encrypted && !entry.conversation;
    const selected = entry.key === selectedKey;
    const title = locked ? 'Encrypted conversation' : titleOf(entry);
    const li = h('li', { class: 'row' + (selected ? ' selected' : '') + (locked ? ' locked' : '') });
    const sub = locked ? `${dateLabel} · ${entry.name}` : dateLabel;
    const main = h('button', { type: 'button', class: 'row-main', title: entry.name, 'data-key': entry.key, 'aria-current': selected ? 'true' : null },
      h('span', { class: 'row-text' }, h('span', { class: 'row-title', dir: locked ? null : 'auto', text: title }), h('span', { class: 'row-sub', text: sub })));
    if (entry.encrypted) {
      const lockIcon = h('span', { class: 'row-lock', title: locked ? 'Encrypted, locked' : 'Encrypted, unlocked', 'aria-label': locked ? 'Locked' : 'Unlocked', role: 'img' }, icon(locked ? 'lockFill' : 'lockOpen'));
      main.append(lockIcon);
    }
    on(main, 'click', () => select(entry.key));
    on(main, 'keydown', ev => {
      if (ev.key === 'Delete' || ev.key === 'Backspace') { ev.preventDefault(); removeAndRefocus(entry, main); }
      else if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
        ev.preventDefault();
        const all = [...listEl.querySelectorAll('.row-main')];
        const i = all.indexOf(main) + (ev.key === 'ArrowDown' ? 1 : -1);
        if (all[i]) all[i].focus();
      }
    });
    on(li, 'contextmenu', ev => {
      ev.preventDefault();
      const items = [['Remove from List', () => removeAndRefocus(entry, main)]];
      if (entry.encrypted && entry.conversation) items.unshift(['Lock', () => lock(entry)]);
      openMenu(ev.clientX, ev.clientY, items, main);
    });
    const remove = h('button', { type: 'button', class: 'row-remove', 'aria-label': `Remove “${title}” from the list`, title: 'Remove from List' }, icon('xmark'));
    on(remove, 'click', ev => { ev.stopPropagation(); removeAndRefocus(entry, main); });
    li.append(main, remove);
    addShape(li, [{ seed: uuidSeed(locked ? entry.header && entry.header.id : entry.conversation && entry.conversation.id), radius: 8, amplitude: 1.4 }]);
    li.append(washi('var(--marigold)', 34, 11, 6));
    return li;
  }
  /** Removes a row and puts focus on the row that takes its place (or the search field). */
  function removeAndRefocus(entry, main) {
    const index = [...listEl.querySelectorAll('.row-main')].indexOf(main);
    removeEntry(entry);
    const rows = [...listEl.querySelectorAll('.row-main')];
    const next = rows[Math.min(Math.max(index, 0), rows.length - 1)];
    if (next) next.focus(); else searchInput.focus();
  }

  on(searchInput, 'input', renderList);
  on(searchInput, 'keydown', ev => { if (ev.key === 'Escape' && searchInput.value) { ev.preventDefault(); searchInput.value = ''; renderList(); } });
  on(searchClear, 'click', () => { searchInput.value = ''; renderList(); searchInput.focus(); });

  // A small context menu (sidebar rows only).
  let menuEl = null;
  function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; } }
  function openMenu(x, y, items, returnFocus) {
    closeMenu();
    menuEl = h('div', { class: 'menu', role: 'menu' });
    for (const [label, act] of items) {
      const b = h('button', { type: 'button', role: 'menuitem', text: label });
      on(b, 'click', () => { closeMenu(); act(); });
      menuEl.append(b);
    }
    on(menuEl, 'keydown', ev => {
      if (ev.key === 'Escape') { ev.preventDefault(); closeMenu(); if (returnFocus && returnFocus.isConnected) returnFocus.focus(); }
    });
    document.body.append(menuEl);
    const w = menuEl.offsetWidth, hh = menuEl.offsetHeight;
    menuEl.style.left = Math.min(x, innerWidth - w - 8) + 'px';
    menuEl.style.top = Math.min(y, innerHeight - hh - 8) + 'px';
    menuEl.querySelector('button').focus();
  }
  on(document, 'pointerdown', ev => { if (menuEl && !menuEl.contains(ev.target)) closeMenu(); });
  on(window, 'blur', closeMenu);

  // Sidebar: hide/show, overlay on narrow windows, seam drag.
  const narrow = window.matchMedia('(max-width: 640px)');
  function wallVisible() { return narrow.matches ? app.classList.contains('wall-open') : !app.classList.contains('wall-hidden'); }
  function hideWall() {
    if (narrow.matches) app.classList.remove('wall-open'); else app.classList.add('wall-hidden');
    renderHeaderToggle();
  }
  function showWall() {
    if (narrow.matches) { app.classList.add('wall-open'); setTimeout(() => searchInput.focus(), 50); } else app.classList.remove('wall-hidden');
    renderHeaderToggle();
  }
  function closeOverlayWall() { if (narrow.matches && app.classList.contains('wall-open')) { app.classList.remove('wall-open'); renderHeaderToggle(); } }
  on(document.getElementById('scrim'), 'click', closeOverlayWall);
  const onNarrow = () => { app.classList.remove('wall-open'); renderHeaderToggle(); };
  if (narrow.addEventListener) narrow.addEventListener('change', onNarrow); else if (narrow.addListener) narrow.addListener(onNarrow);
  const seam = document.getElementById('seam');
  on(seam, 'pointerdown', ev => {
    ev.preventDefault();
    seam.setPointerCapture(ev.pointerId);
    const move = e => { app.style.setProperty('--wall-w', Math.max(220, Math.min(380, e.clientX)) + 'px'); };
    const up = () => { seam.removeEventListener('pointermove', move); seam.removeEventListener('pointerup', up); };
    on(seam, 'pointermove', move);
    on(seam, 'pointerup', up);
  });

  // ===========================================================================================
  // The room: header + body, for the empty state, the unlock screen or a chat.
  function roundButton(iconName, label, tip, onClick) {
    const b = h('button', { type: 'button', class: 'round-btn', 'aria-label': label, title: tip }, icon(iconName));
    on(b, 'click', onClick);
    return b;
  }
  let headerToggleSlot = null;
  function renderHeaderToggle() {
    if (!headerToggleSlot || !headerToggleSlot.isConnected) return;
    headerToggleSlot.replaceChildren();
    if (!wallVisible()) headerToggleSlot.append(roundButton('sidebar', 'Show Sidebar', 'Show Sidebar', showWall));
  }
  function header(titleText, subText, trailing, titleIsFixed) {
    headerToggleSlot = h('div', { style: 'display:contents' });
    const titles = h('div', { class: 'header-titles' });
    if (titleText) titles.append(h('div', { class: 'header-title', dir: titleIsFixed ? null : 'auto', text: titleText, title: titleText }));
    if (subText) titles.append(h('div', { class: 'header-sub', text: subText }));
    const el = h('header', { class: 'room-header' }, headerToggleSlot, titles, ...(trailing || []));
    return el;
  }
  function openButton(primaryLabel) {
    const b = h('button', { type: 'button', class: 'tag-btn' }, primaryLabel);
    addShape(b, [{ seed: 11, radius: 10, amplitude: 0.8 }], 'shadow-btn');
    on(b, 'click', () => fileInput.click());
    return b;
  }
  function tapedPicture(artName, width, aspect) {
    const frame = h('div', { class: 'taped' });
    frame.style.width = (width + 18) + 'px';
    addShape(frame, [{ seed: 7, radius: 9, amplitude: 1.2 }], 'shadow-pic');
    frame.__shape.svg.firstChild.style.fill = 'var(--card)';
    const img = h('img', { alt: '', 'data-art': artName, decoding: 'async', draggable: 'false' });
    img.style.aspectRatio = String(aspect);
    setArt(img);
    frame.append(img, washi('var(--rose)', 84, 22, -2.5, 'translateX(-50%)'));
    return frame;
  }

  function renderRoom() {
    // Take down what is shown. A chat view stays with its entry (detached) so it is built once per
    // unlock or open; anything else is dropped.
    for (const child of [...room.children]) {
      const owner = entries.find(e => e.view && e.view.root === child);
      if (owner) owner.view.scrollTop = owner.view.scroller.scrollTop; else dropShapes(child);
      child.remove();
    }
    const entry = entryOf(selectedKey);
    if (!entry) { room.append(emptyScreen()); renderHeaderToggle(); return; }
    if (!entry.conversation) { room.append(unlockScreen(entry)); renderHeaderToggle(); return; }
    if (!entry.view) {
      try { entry.view = chatView(entry); } catch (e) { entry.view = null; room.append(failedScreen()); return; }
      room.append(entry.view.root);
      renderHeaderToggle();
      scrollToEnd(entry.view.scroller);
    } else {
      room.append(entry.view.root);
      headerToggleSlot = entry.view.toggleSlot;
      renderHeaderToggle();
      entry.view.scroller.scrollTop = entry.view.scrollTop || 0;
    }
  }
  function failedScreen() {
    return h('div', { class: 'room-body' }, h('div', { class: 'centred' }, h('p', { text: 'This conversation could not be shown.' })));
  }

  function emptyScreen() {
    const lock = icon('lockFill');
    // (Only the skin and light choice is saved, in this browser's storage; files never are.)
    const body = h('div', { class: 'scroller' }, h('div', { class: 'empty-detail' },
      tapedPicture('fort', 340, 1.5),
      h('h1', { class: 'lettered big', text: 'Nobody here but us' }),
      h('p', { text: 'Pick a note from the wall, or open a Parley conversation file.' }),
      openButton('Open…'),
      h('div', { class: 'privacy' }, lock, h('span', { text: 'Files you open stay in this browser tab. Nothing is uploaded.' }))));
    return h('div', { class: 'room-body', style: 'flex:1' }, header(null, null), body);
  }

  // ---- unlock screen
  // A decrypt attempt's state lives on the entry (decrypting, unlockError, unlockShake), not in the
  // screen: selecting another row and coming back builds a new screen that shows the same state.
  function unlockScreen(entry) {
    const input = h('input', { type: 'password', placeholder: 'Password', 'aria-label': 'Password', autocomplete: 'off', spellcheck: 'false' });
    const field = h('div', { class: 'pw-field' }, input);
    addShape(field, [{ seed: 19, radius: 9, amplitude: 1.4, inset: 0.5 }]);
    const unlockBtn = h('button', { type: 'button', class: 'tag-btn', disabled: true, text: 'Unlock' });
    addShape(unlockBtn, [{ seed: 11, radius: 10, amplitude: 0.8 }], 'shadow-btn');
    const status = h('div', { class: 'status-slot', role: 'status', 'aria-live': 'polite' });
    const working = () => entry.decrypting !== null;
    const refresh = () => { unlockBtn.disabled = input.value === '' || working(); input.disabled = working(); };
    on(input, 'input', refresh);
    on(input, 'keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); attempt(); } });
    on(unlockBtn, 'click', attempt);

    // The spinner alone, as in the app (with words for screen readers only).
    if (working()) status.append(h('span', { class: 'spinner-line' }, spinner(), h('span', { class: 'sr-only', text: 'Decrypting' })));
    else if (entry.unlockError) status.append(h('span', { class: 'notice danger' }, icon('xcircle'), h('span', { text: entry.unlockError })));
    refresh();
    if (!working() && entry.unlockShake) {
      entry.unlockShake = false; // once per failed attempt, not on every visit
      field.classList.add('shake'); // a new element, so the animation runs when it is shown
    }

    async function attempt() {
      if (input.value === '' || working()) return;
      // Read the password and clear the field at once; it is never kept after this call.
      let password = input.value;
      input.value = '';
      const token = {};
      entry.decrypting = token;
      entry.unlockError = null;
      entry.unlockShake = false;
      if (selectedKey === entry.key) renderRoom();
      let conversation = null, error = null;
      try {
        conversation = await Core.decrypt(entry.header, password);
      } catch (e) {
        error = e;
      }
      password = null;
      if (entry.decrypting !== token || !entries.includes(entry)) return; // locked or removed meanwhile
      entry.decrypting = null;
      if (conversation) {
        entry.conversation = conversation;
        renderList();
        if (selectedKey === entry.key) {
          // The focused password field goes away: hand focus to the conversation, unless the
          // user has moved it somewhere else (the search field, another row) meanwhile.
          const active = document.activeElement;
          const ours = !active || active === document.body || room.contains(active);
          renderRoom();
          if (ours && entry.view) entry.view.scroller.focus({ preventScroll: true });
        }
        announce('Unlocked');
        return;
      }
      entry.unlockError = error && (error.code === 'corrupt' || error.code === 'noWebCrypto') ? errorText(error)
        : 'Wrong password, or the file has been tampered with.';
      entry.unlockShake = true;
      // The screen is rebuilt, so its status region is new: say the error through the announcer.
      if (selectedKey === entry.key) { renderRoom(); announce(entry.unlockError); }
    }

    const meta = h('div', { class: 'unlock-meta' },
      h('div', { class: 'where', text: `“${entry.name}” · modified ${relative(entry.lastModified)}`, title: entry.name }),
      h('div', { class: 'warn', text: 'Forgotten passwords can\'t be recovered.' }));
    const body = h('div', { class: 'scroller' }, h('div', { class: 'centred', style: 'padding:30px 40px' },
      tapedPicture('door', 220, 1),
      h('h1', { class: 'lettered big', text: 'Encrypted Conversation', style: 'margin-top:8px' }),
      h('p', { text: 'Enter the password to decrypt it in memory.', style: 'font-size:13px' }),
      h('div', { class: 'pw-row' }, field, unlockBtn),
      status, meta));
    const root = h('div', { class: 'room-body', style: 'flex:1' }, header('Locked Conversation', null, null, true), body);
    setTimeout(() => { if (input.isConnected && !input.disabled) input.focus(); }, 0);
    return root;
  }
  function spinner() {
    const svg = s('svg', { class: 'spinner', viewBox: '0 0 16 16', 'aria-hidden': 'true', focusable: 'false' });
    // A 72% arc, as the app's HideoutSpinner draws it.
    svg.append(s('circle', { cx: 8, cy: 8, r: 6.5, fill: 'none', stroke: 'currentColor', 'stroke-width': 1.75, 'stroke-linecap': 'round', 'stroke-dasharray': `${r2(2 * Math.PI * 6.5 * .72)} 100` }));
    return svg;
  }

  // ===========================================================================================
  // The chat.
  function chatView(entry) {
    const c = entry.conversation;
    const settings = obj(c.settings) || {};
    const title = str(c.title).trim() || 'Untitled';
    // No subtitle for a plain file (the app shows none for one in its default folder).
    const sub = entry.encrypted ? `Encrypted · ${entry.name}` : '';
    const trailing = [];
    const model = str(settings.model);
    if (model) trailing.push(parcelTag(model));
    trailing.push(roundButton('info', 'Conversation details', 'Conversation details: system prompt and settings (read-only)', () => showInfo(entry)));
    if (entry.encrypted) trailing.push(roundButton('lock', 'Lock', 'Lock: remove the decrypted conversation from memory', () => lock(entry)));
    const head = header(title, sub, trailing);
    const toggleSlot = headerToggleSlot;

    const column = h('div', { class: 'column' });
    const messages = arr(c.messages);
    if (obj(c.forkedFrom)) column.append(h('div', { class: 'forked', text: 'Forked from another conversation' }));
    if (!messages.length) column.append(invitation(model));
    const notes = thinkingOffRepeats(messages);
    messages.forEach((m, i) => {
      let row;
      try { row = messageRow(entry, c, m, notes[i]); } catch (_) { row = h('div', { class: 'msg' }, h('div', { class: 'row-failed', text: 'This message could not be shown.' })); }
      column.append(row);
    });
    const sentinel = h('div', { 'aria-hidden': 'true', style: 'height:1px' });
    column.append(sentinel);
    const scroller = h('div', { class: 'scroller' + (messages.length ? '' : ' no-messages'), tabindex: '-1' }, column);
    const toBottom = h('button', { type: 'button', class: 'to-bottom', 'aria-label': 'Scroll to Bottom', title: 'Scroll to the latest message', tabindex: '-1' }, icon('arrowDown'));
    on(toBottom, 'click', () => scrollToEnd(scroller, true));
    const io = new IntersectionObserver(list => {
      const visible = list[list.length - 1].isIntersecting;
      toBottom.classList.toggle('shown', !visible);
      toBottom.tabIndex = visible ? -1 : 0;
    }, { root: scroller, rootMargin: '0px 0px 40px 0px' });
    io.observe(sentinel);
    const root = h('div', { class: 'room-body', style: 'flex:1' }, head, h('div', { class: 'room-body' }, scroller, toBottom));
    return { root, scroller, toggleSlot, io, scrollTop: 0 };
  }
  /** Scrolls to the end; rows render lazily (content-visibility), so settle over a few frames. */
  function scrollToEnd(scroller, smooth) {
    let frames = 0, last = -1;
    const step = () => {
      if (!scroller.isConnected) return;
      const target = scroller.scrollHeight - scroller.clientHeight;
      if (smooth && frames === 0) scroller.scrollTo({ top: target, behavior: 'smooth' }); else scroller.scrollTop = target;
      if (target !== last && frames++ < 8) { last = target; requestAnimationFrame(step); }
    };
    requestAnimationFrame(step);
  }

  function parcelTag(model) {
    const tag = h('div', { class: 'parcel', title: model, role: 'img', 'aria-label': `Model: ${model}` }, icon('cpu'), h('span', { class: 'parcel-text', text: middle(model, 36) }));
    const svg = s('svg', { class: 'shape', 'aria-hidden': 'true', focusable: 'false' });
    const path = s('path', { class: 'tag' }), hole = s('circle', { r: 3.5 }), string = s('path', { class: 'string' });
    svg.append(path, hole, string);
    tag.classList.add('has-shape');
    tag.prepend(svg);
    tag.__shape = { w: -1, h: -1, svg, draw(w, hh) {
      svg.setAttribute('viewBox', `0 0 ${r2(w)} ${r2(hh)}`);
      path.setAttribute('d', parcelPath(w, hh));
      const cx = 14, cy = hh / 2;
      hole.setAttribute('cx', cx); hole.setAttribute('cy', r2(cy));
      string.setAttribute('d', `M${cx},${r2(cy)}Q${cx - 12},${r2(cy - 2)} ${cx - 14},${r2(cy - 13)}`);
    } };
    shapeObserver.observe(tag);
    return tag;
  }

  function invitation(model) {
    const card = h('div', { class: 'invite' },
      lantern(46),
      h('div', { class: 'lettered', style: 'font-size:28px;margin-top:2px', text: 'The lantern\'s on' }),
      h('div', { style: 'color:var(--inkSoft)', text: 'This conversation has no messages yet.' }));
    if (model) card.append(h('div', { style: 'font-size:14px;font-weight:600;margin-top:8px', text: middle(model, 48) }));
    addShape(card, [{ seed: 4, radius: 18, amplitude: 1.4, cls: 'fill' }, { seed: 4, radius: 13, amplitude: 0.8, inset: 5, cls: 'stitch' }], 'shadow-paper');
    card.append(washi('var(--rose)', 84, 20, -2.5, 'translateX(-50%)'));
    return card;
  }

  // ---- derived message values (Models.swift)
  function visibleText(m) {
    const rounds = arr(m.toolRounds);
    if (!rounds.length) return str(m.content);
    return [...rounds.map(r => str(obj(r) && r.content)), str(m.content)].filter(t => t.trim() !== '').join('\n\n');
  }
  function latestStats(m) {
    if (obj(m.stats)) return m.stats;
    const rounds = arr(m.toolRounds);
    for (let i = rounds.length - 1; i >= 0; i--) if (obj(rounds[i]) && obj(rounds[i].stats)) return rounds[i].stats;
    return null;
  }
  function footerUsage(m) {
    if (obj(m.usage)) return m.usage;
    const rounds = arr(m.toolRounds);
    for (let i = rounds.length - 1; i >= 0; i--) if (obj(rounds[i]) && obj(rounds[i].usage)) return rounds[i].usage;
    return null;
  }
  function footerLine(m) {
    const groups = [];
    const usage = footerUsage(m), stats = latestStats(m);
    if (usage) {
      const parts = [];
      if (num(usage.promptTokens) !== null) parts.push(`${usage.promptTokens} prompt`);
      if (num(usage.completionTokens) !== null) parts.push(`${usage.completionTokens} completion`);
      if (num(usage.totalTokens) !== null) parts.push(`${usage.totalTokens} total`);
      if (parts.length) groups.push(parts.join(' · ') + ' tokens');
    }
    if (stats) {
      const approx = stats.isEstimated === true ? '≈' : '';
      if (!groups.length && num(stats.completionTokens) !== null) groups.push(`${approx}${stats.completionTokens} tokens`);
      if (num(stats.tokensPerSecond) !== null) groups.push(approx + rate(stats.tokensPerSecond) + ' tok/s');
      if (num(stats.timeToFirstToken) !== null) groups.push(seconds(stats.timeToFirstToken) + ' to first token');
    }
    const n = arr(m.toolRounds).length;
    if (n > 0) groups.push(n === 1 ? '1 tool round' : `${n} tool rounds`);
    return groups.join(' · ');
  }
  function finishNote(m, settings) {
    const stats = obj(m.stats);
    if (m.role !== 'assistant' || !stats || stats.finishReason !== 'length') return null;
    const usage = obj(m.usage);
    const completion = usage && num(usage.completionTokens) !== null ? usage.completionTokens

    if (url) {
      const img = h('img', { alt: '', loading: 'lazy', decoding: 'async', draggable: 'false' });
      img.src = url; // a blob: URL made here from validated base64, never a URL from the file
      on(img, 'error', () => img.replaceWith(h('span', { class: 'no-image' }, icon('photo'))));
      btn.append(img);
      on(btn, 'click', () => showImage(url, filename));
    } else {
      btn.append(h('span', { class: 'no-image' }, icon('photo')));
      btn.disabled = true;
    }
    addShape(btn, [{ seed: uuidSeed(a.id), radius: 7, amplitude: 1.4 }], 'shadow-paper');
    btn.__shape.svg.firstChild.style.fill = 'var(--card)';
    btn.append(washi('var(--marigold)', 46, 13, -2.5, 'translateX(-50%)'));
    return btn;
  }
  function textChip(a, filename) {
    const chip = h('button', { type: 'button', class: 'chip', title: 'Click to preview', 'aria-label': `Text file ${filename}, click to preview` },
      icon('doc'), h('span', { text: middle(filename, 28) }));
    addShape(chip, [{ seed: uuidSeed(a.id), radius: 9, amplitude: 1.4 }], 'shadow-paper');
    chip.__shape.svg.firstChild.style.fill = 'var(--card)';
    on(chip, 'click', () => showText(filename, str(a.text)));
    return chip;
  }

  // ---- rows
  function messageRow(entry, c, m, repeated) {
    if (!obj(m)) throw new Error('bad message');
    return m.role === 'user' ? userRow(entry, m) : assistantRow(entry, c, m, repeated);
  }
  function userRow(entry, m) {
    const stack = h('div', { class: 'stack' });
    const atts = arr(m.attachments);
    if (atts.length) stack.append(attachmentStrip(entry, atts));
    const content = str(m.content);
    if (content !== '') {
      const created = dateOf(m.createdAt);
      const note = h('div', { class: 'note', dir: 'auto', title: created ? fmtNoteTip(created) : null, text: content });
      paperCard(note, uuidSeed(m.id), 14);
      note.__shape.svg.firstChild.style.fill = 'var(--peach)';
      stack.append(note);
    }
    if (str(m.error) !== '') stack.append(errorCallout(m.error, m));
    const actions = h('div', { class: 'actions' }, copyButton('paper-btn', 'Copy', 'Copy', () => str(m.content)));
    return h('div', { class: 'msg msg-user' }, actions, stack);
  }
  function assistantRow(entry, c, m, repeated) {
    const settings = obj(c.settings) || {};
    const row = h('div', { class: 'msg msg-assistant' });
    const created = dateOf(m.createdAt);
    const modelName = str(m.model) || 'Assistant';
    const time = created ? fmtTime(created) : '';
    const headEl = h('div', { class: 'a-head', role: 'group', 'aria-label': `Assistant, ${str(m.model) || 'unknown model'}, ${time}` },
      lantern(16), h('span', { class: 'a-model', text: modelName }), h('span', { class: 'a-time', text: time }),
      h('div', { class: 'actions' }, copyButton('paper-btn', 'Copy', 'Copy', () => visibleText(m))));
    row.append(headEl);
    for (const round of arr(m.toolRounds)) {
      if (!obj(round)) continue;
      if (str(round.reasoning) !== '') row.append(disclosure(round.reasoning, num(round.reasoningDuration)));
      if (str(round.content) !== '') row.append(markdown(round.content));
      for (const call of arr(round.calls)) if (obj(call)) row.append(toolCallRow(call));
    }
    if (str(m.reasoning) !== '') row.append(disclosure(m.reasoning, num(m.reasoningDuration)));
    if (str(m.reactThought) !== '') row.append(disclosure(m.reactThought, null));
    const atts = arr(m.attachments);
    if (atts.length) row.append(attachmentStrip(entry, atts));
    if (str(m.content) !== '') row.append(markdown(m.content));
    const error = str(m.error);
    if (error === '') { const finish = finishNote(m, settings); if (finish) row.append(smallNote('scissors', finish)); }
    const off = thinkingOffText(m, repeated);
    if (off) row.append(smallNote('info', off[0], off[1]));
    for (const note of arr(m.toolNotes)) if (obj(note)) { const t = toolNoteText(note); if (t) row.append(smallNote('info', t, str(note.detail))); }
    if (error !== '') row.append(errorCallout(error, m));
    else if (m.isComplete === false) row.append(h('div', { class: 'stopped', text: 'Stopped before the reply finished.' }));
    const footer = footerLine(m);
    if (footer) row.append(h('div', { class: 'footer-stats', text: footer }));
    return row;
  }

  // ===========================================================================================
  // Dialogs: link confirmation, image and text previews, conversation details.
  const linkDialog = document.getElementById('link-dialog');
  const imageDialog = document.getElementById('image-dialog');
  const textDialog = document.getElementById('text-dialog');
  const infoDialog = document.getElementById('info-dialog');
  const allDialogs = [linkDialog, imageDialog, textDialog, infoDialog];
  for (const d of allDialogs) {
    // Clear the contents on close, so nothing from a conversation lingers in a hidden dialog.
    on(d, 'close', () => { clearDialog(d); if (d === linkDialog) gate.cancel(); });
    // A click on the backdrop (the dialog element itself, outside the sheet) closes it.
    on(d, 'click', ev => { if (ev.target === d) d.close(); });
  }
  /** Empties a dialog, including the per-image label (a file name from the conversation). */
  function clearDialog(d) {
    d.replaceChildren();
    if (d === imageDialog) d.setAttribute('aria-label', 'Image preview');
  }
  // 'close' fires later; Lock and Remove clear every dialog now.
  function closeDialogs() { gate.cancel(); for (const d of allDialogs) { if (d.open) d.close(); clearDialog(d); } }
  function showModal(d) { try { d.showModal(); } catch (_) { d.setAttribute('open', ''); } }

  const gate = MD.createLinkGate(
    url => { window.open(url, '_blank', 'noopener,noreferrer'); },
    link => showLinkSheet(link));
  function openLinkFrom(el) {
    const link = linkTargets.get(el);
    if (link) gate.requestOpen(link.url);
  }
  on(document, 'click', ev => {
    const el = ev.target instanceof Element ? ev.target.closest('.md-link') : null;
    if (el) { ev.preventDefault(); openLinkFrom(el); }
  });
  on(document, 'keydown', ev => {
    const el = ev.target instanceof Element && ev.target.classList.contains('md-link') ? ev.target : null;
    if (el && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); openLinkFrom(el); }
  });

  function showLinkSheet(link) {
    const host = link.host.length > 90 ? '…' + link.host.slice(-89) : link.host;
    const address = boardBlock('Address', link.address);
    address.pre.classList.add('address');
    const card = h('div', { class: 'notice-card' },
      h('div', { class: 'notice-head' }, h('span', { class: 'hand', 'aria-hidden': 'true' }, icon('hand')), h('h2', { id: 'link-title', text: 'Open this link in your browser?' })),
      h('p', { text: 'Opening sends the whole address to this site, including anything a model put in it.' }),
      h('div', { class: 'site' }, h('span', { class: 'site-label', text: 'Site' }), h('span', { class: 'site-host', text: host, title: link.host })),
      address.block);
    if (link.hasHiddenCharacters) card.append(h('div', { class: 'hidden-warn' }, icon('triangleFill'), h('span', { text: 'The address contains hidden or right-to-left characters, shown here as \\u{…}.' })));
    const cancel = h('button', { type: 'button', class: 'sheet-btn soft', text: 'Cancel', autofocus: true });
    const open = h('button', { type: 'button', class: 'sheet-btn primary', text: 'Open', disabled: true });
    on(cancel, 'click', () => linkDialog.close());
    on(open, 'click', () => { gate.confirm(); linkDialog.close(); });
    // Disabled for 0.4 s, so the second click of a double-click cannot land on it.
    setTimeout(() => { open.disabled = false; }, 400);
    linkDialog.replaceChildren(h('div', { class: 'sheet link-sheet' }, card, h('div', { class: 'sheet-buttons' }, cancel, open)));
    showModal(linkDialog);
    cancel.focus();
    noteOverflow(address.block, address.pre, 200);
  }
  function closeButton(dialog) {
    const b = h('button', { type: 'button', class: 'sheet-btn soft sheet-close', text: 'Close' });
    on(b, 'click', () => dialog.close());
    return b;
  }
  function showImage(url, filename) {
    const img = h('img', { alt: filename });
    img.src = url;
    imageDialog.setAttribute('aria-label', `Image ${filename}`);
    imageDialog.replaceChildren(h('div', { class: 'sheet preview-sheet' }, img, closeButton(imageDialog)));
    showModal(imageDialog);
  }
  function showText(filename, text) {
    textDialog.replaceChildren(h('div', { class: 'sheet text-sheet' }, h('h2', { text: filename }), h('pre', { tabindex: '0', text }), closeButton(textDialog)));
    showModal(textDialog);
  }
  function showInfo(entry) {
    const c = entry.conversation;
    if (!c) return;
    const st = obj(c.settings) || {};
    const rows = [];
    const add = (k, v) => { if (v !== null && v !== undefined && v !== '') rows.push(h('dt', { text: k }), h('dd', { text: String(v) })); };
    add('Model', str(st.model) || 'Provider default');
    add('Temperature', num(st.temperature));
    add('Max tokens', num(st.maxTokens) !== null ? grouped(st.maxTokens) : null);
    const EFFORT = { low: 'Low', medium: 'Medium', high: 'High' };
    const effort = Object.prototype.hasOwnProperty.call(EFFORT, str(st.reasoningEffort)) ? EFFORT[str(st.reasoningEffort)] : null;
    add('Reasoning effort', st.disablesThinking === true ? 'None (no thinking)' : effort || null);
    add('Thinking budget', num(st.reasoningBudgetTokens) !== null ? `${grouped(st.reasoningBudgetTokens)} tokens` : null);
    add('Tool calling', st.toolMode === 'react' ? 'ReAct (text)' : 'Native');
    const servers = arr(st.mcpServerIDs).length;
    add('MCP servers', servers ? String(servers) : 'None');
    if (st.builtInToolsOff === true) add('Built-in tools', 'Off');
    const created = dateOf(c.createdAt), updated = dateOf(c.updatedAt);
    add('Created', created ? fmt({ dateStyle: 'medium', timeStyle: 'short' }, created) : null);
    add('Updated', updated ? fmt({ dateStyle: 'medium', timeStyle: 'short' }, updated) : null);
    add('Messages', arr(c.messages).length);
    if (obj(c.forkedFrom)) add('Fork', 'Forked from another conversation');
    add('File', entry.name);
    const prompt = str(st.systemPrompt);
    infoDialog.replaceChildren(h('div', { class: 'sheet info-sheet' },
      h('h2', { text: str(c.title).trim() || 'Untitled' }),
      h('p', { class: 'viewer-note', text: 'Conversation settings, read-only. In Parley they live in the Conversation Settings popover.' }),
      h('h2', { text: 'System prompt' }),
      h('div', { class: 'info-prompt' + (prompt ? '' : ' none'), dir: prompt ? 'auto' : null, text: prompt || 'No system prompt.' }),
      h('dl', { class: 'info-grid' }, ...rows),
      closeButton(infoDialog)));
    showModal(infoDialog);
  }

  // ===========================================================================================
  // Opening files: buttons, the file input, drag and drop anywhere.
  on(fileInput, 'change', () => { const files = fileInput.files; openFiles(files).finally(() => { fileInput.value = ''; }); });
  const drop = document.getElementById('drop');
  addShape(document.getElementById('drop-card'), [{ seed: 9, radius: 18, amplitude: 1.4, cls: 'fill' }, { seed: 9, radius: 13, amplitude: 0.8, inset: 5, cls: 'stitch' }], 'shadow-paper');
  let dragDepth = 0;
  const hasFiles = ev => !!(ev.dataTransfer && Array.from(ev.dataTransfer.types || []).includes('Files'));
  // Always prevent the default, so a drop that misses never navigates the tab to the file.
  on(window, 'dragenter', ev => { ev.preventDefault(); if (hasFiles(ev)) { dragDepth++; drop.hidden = false; } });
  on(window, 'dragover', ev => { ev.preventDefault(); if (ev.dataTransfer) ev.dataTransfer.dropEffect = hasFiles(ev) ? 'copy' : 'none'; });
  on(window, 'dragleave', ev => { ev.preventDefault(); dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) drop.hidden = true; });
  on(window, 'drop', ev => {
    ev.preventDefault();
    dragDepth = 0; drop.hidden = true;
    const files = ev.dataTransfer && ev.dataTransfer.files;
    if (files && files.length) openFiles(files);
  });

  // Wall buttons and look controls.
  const wallOpen = document.getElementById('wall-open');
  wallOpen.append(icon('folder'));
  on(wallOpen, 'click', () => fileInput.click());
  const wallHide = document.getElementById('wall-hide');
  wallHide.append(icon('sidebar'));
  on(wallHide, 'click', hideWall);
  document.getElementById('search-icon').append(icon('search'));
  searchClear.append(icon('xcircle'));
  const searchBox = document.getElementById('search');
  addShape(searchBox, [{ seed: 3, radius: 9, amplitude: 1.4 }], 'shadow-paper');
  searchBox.__shape.svg.firstChild.style.fill = 'var(--tag)';
  const skinSelect = document.getElementById('skin-select');
  for (const skin of SKINS) skinSelect.append(h('option', { value: skin, text: SKIN_TITLES[skin] }));
  const appearanceSelect = document.getElementById('appearance-select');
  for (const [value, label] of APPEARANCES) appearanceSelect.append(h('option', { value, text: label }));
  skinSelect.value = look.skin;
  appearanceSelect.value = look.appearance;
  on(skinSelect, 'change', () => { if (SKINS.includes(skinSelect.value)) { look.skin = skinSelect.value; saveLook(); applyLook(); } });
  on(appearanceSelect, 'change', () => { look.appearance = appearanceSelect.value; saveLook(); applyLook(); });

  on(document, 'keydown', ev => {
    if (ev.key === 'Escape' && narrow.matches && app.classList.contains('wall-open') && !menuEl) closeOverlayWall();
    if ((ev.metaKey || ev.ctrlKey) && !ev.shiftKey && !ev.altKey && ev.key.toLowerCase() === 'o') { ev.preventDefault(); fileInput.click(); }
  });

  applyLook();
  renderList();
  renderRoom();
})();
</script>
</body>
</html>
