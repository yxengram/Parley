# Publishes Parley Reader (Reader/ParleyReader.html, built by tools/build_reader.sh and committed)
# to GitHub Pages as index.html, and Parley Web (Web/ParleyWeb.html, built by tools/build_web.sh and
# committed) as web/index.html. Nothing is built here: the pages are copied as they are.
name: Publish Parley Reader

on:
  push:
    branches: [master]
    paths:
      - Reader/ParleyReader.html
      - Web/ParleyWeb.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Two jobs: the artifact is listed for the run only some seconds after its upload, and deploy-pages
  # failed with "No artifacts named github-pages" when it ran right after the upload in the same job.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir _site
          cp Reader/ParleyReader.html _site/index.html
          mkdir _site/web
          cp Web/ParleyWeb.html _site/web/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
