  }

  function renderRoom() {
    // Take down what is shown. A chat view stays with its entry (detached) so it is built once per
    // unlock or open; anything else is dropped.
    for (const child of [...room.children]) {
      const owner = entries.find(e => e.view && e.view.root === child);
      if (owner) owner.view.scrollTop = owner.view.scroller.scrollTop; else dropShapes(child);
      child.remove();
    }
    const entry = entryOf(selectedKey);
    if (!entry) { room.append(emptyScreen()); renderHeaderToggle(); return; }
    if (!entry.loaded) {
      room.append(entry.loadFailed ? failedScreen() : loadingScreen());
      renderHeaderToggle();
      loadEntry(entry);
      return;
    }
    if (!entry.conversation) { room.append(unlockScreen(entry)); renderHeaderToggle(); return; }
    if (!entry.view) {
      try { entry.view = chatView(entry); } catch (e) { entry.view = null; room.append(failedScreen()); return; }
      room.append(entry.view.root);
      renderHeaderToggle();
      scrollToEnd(entry.view.scroller);
      ensureModels(providerFor(entry.conversation.settings));
    } else {
      room.append(entry.view.root);
      headerToggleSlot = entry.view.toggleSlot;
      renderHeaderToggle();
      entry.view.scroller.scrollTop = entry.view.scrollTop || 0;
    }
  }
  function failedScreen() {
    return h('div', { class: 'room-body' }, h('div', { class: 'centred' }, h('p', { text: t('failedConversation') })));
  }
  function loadingScreen() {
    return h('div', { class: 'room-body' }, header(null, null), h('div', { class: 'centred' },
      h('span', { class: 'spinner-line' }, spinner(), h('span', { class: 'sr-only', text: t('loading') }))));
  }

  function emptyScreen() {
    const lock = icon('lockFill');
    const actions = h('div', { class: 'pw-row' }, tagButton(t('newChat'), newChat), tagButton(t('importEllipsis'), () => importInput.click(), true));
    const body = h('div', { class: 'scroller' }, h('div', { class: 'empty-detail' },
      tapedPicture('fort', 340, 1.5),
      h('h1', { class: 'lettered big', text: t('emptyTitle') }),
      h('p', { text: t('emptyHint') }),
      actions,
      providers.length ? null : h('div', { class: 'notice danger' }, icon('triangleFill'), h('span', { text: t('noServerYet') })),
      providers.length ? null : tagButton(t('openSettings'), () => openSettings(), true),
      h('div', { class: 'privacy' }, lock, h('span', { text: t('privacyNote') }))));
    return h('div', { class: 'room-body', style: 'flex:1' }, header(null, null), body);
  }

  // ---- unlock screen
  // A decrypt attempt's state lives on the entry (decrypting, unlockError, unlockShake), not in the
  // screen: selecting another row and coming back builds a new screen that shows the same state.
  function unlockScreen(entry) {
    const input = h('input', { type: 'password', placeholder: t('password'), 'aria-label': t('password'), autocomplete: 'off', spellcheck: 'false' });
    const field = h('div', { class: 'pw-field' }, input);
    addShape(field, [{ seed: 19, radius: 9, amplitude: 1.4, inset: 0.5 }]);
    const unlockBtn = h('button', { type: 'button', class: 'tag-btn', disabled: true, text: t('unlock') });
    addShape(unlockBtn, [{ seed: 11, radius: 10, amplitude: 0.8 }], 'shadow-btn');
    const status = h('div', { class: 'status-slot', role: 'status', 'aria-live': 'polite' });
    const working = () => entry.decrypting !== null;
    const refresh = () => { unlockBtn.disabled = input.value === '' || working(); input.disabled = working(); };
    on(input, 'input', refresh);
    on(input, 'keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); attempt(); } });
    on(unlockBtn, 'click', attempt);

    // The spinner alone, as in the app (with words for screen readers only).
    if (working()) status.append(h('span', { class: 'spinner-line' }, spinner(), h('span', { class: 'sr-only', text: t('decrypting') })));
    else if (entry.unlockError) status.append(h('span', { class: 'notice danger' }, icon('xcircle'), h('span', { text: entry.unlockError })));
    refresh();
    if (!working() && entry.unlockShake) {
      entry.unlockShake = false; // once per failed attempt, not on every visit
      field.classList.add('shake'); // a new element, so the animation runs when it is shown
    }

    async function attempt() {
      if (input.value === '' || working()) return;
      // Read the password and clear the field at once; it is never kept after this call.
      let password = input.value;
      input.value = '';
      const token = {};
      entry.decrypting = token;
      entry.unlockError = null;
      entry.unlockShake = false;
      if (selectedKey === entry.key) renderRoom();
      let conversation = null, keyInfo = null, error = null;
      try {
        // One key derivation: the key opens the file now and saves it again later.
        keyInfo = await Core.keyFromHeader(entry.header, password);
        conversation = await Core.decryptWithKey(entry.header, keyInfo);
      } catch (e) {
        error = e;
      }
      password = null;
      if (entry.decrypting !== token || !entries.includes(entry)) return; // locked or removed meanwhile
      entry.decrypting = null;
      if (conversation) {
        entry.keyInfo = keyInfo;
        entry.conversation = conversation;
        renderList();
        if (selectedKey === entry.key) {
          // The focused password field goes away: hand focus to the conversation, unless the
          // user has moved it somewhere else (the search field, another row) meanwhile.
          const active = document.activeElement;
          const ours = !active || active === document.body || room.contains(active);
          renderRoom();
          if (ours && entry.view) entry.view.composer.input.focus({ preventScroll: true });
        }
        announce(t('unlocked'));
        return;
      }
      entry.unlockError = error && (error.code === 'corrupt' || error.code === 'noWebCrypto') ? errorText(error)
        : t('errWrongPassword');
      entry.unlockShake = true;
      // The screen is rebuilt, so its status region is new: say the error through the announcer.
      if (selectedKey === entry.key) { renderRoom(); announce(entry.unlockError); }
    }

    const saved = dateOf(entry.row && entry.row.updatedAt);
    const meta = h('div', { class: 'unlock-meta' },
      saved ? h('div', { class: 'where', text: t('unlockWhere', { time: relative(saved.getTime()) }) }) : null,
      h('div', { class: 'warn', text: t('forgottenPasswords') }));
    const body = h('div', { class: 'scroller' }, h('div', { class: 'centred', style: 'padding:30px 40px' },
      tapedPicture('door', 220, 1),
      h('h1', { class: 'lettered big', text: t('encryptedTitle'), style: 'margin-top:8px' }),
      h('p', { text: t('unlockHint'), style: 'font-size:13px' }),
      h('div', { class: 'pw-row' }, field, unlockBtn),
      status, meta));
    const root = h('div', { class: 'room-body', style: 'flex:1' }, header(t('lockedTitle'), null, null, true), body);
    setTimeout(() => { if (input.isConnected && !input.disabled) input.focus(); }, 0);
    return root;
  }
  function spinner() {
    const svg = s('svg', { class: 'spinner', viewBox: '0 0 16 16', 'aria-hidden': 'true', focusable: 'false' });
    // A 72% arc, as the app's HideoutSpinner draws it.
    svg.append(s('circle', { cx: 8, cy: 8, r: 6.5, fill: 'none', stroke: 'currentColor', 'stroke-width': 1.75, 'stroke-linecap': 'round', 'stroke-dasharray': `${r2(2 * Math.PI * 6.5 * .72)} 100` }));
    return svg;
  }

  // ===========================================================================================
  // The chat view: header, messages, composer, context strip.
  function chatView(entry) {
    const view = { entry, stick: true, scrollTop: 0, rows: new Map(), draftBlobs: [], composer: null, strip: null, lockSlot: h('span', { style: 'display:contents' }) };
    const c = entry.conversation;
    const modelBox = modelField(entry, view);
    const head = header(nameOf(c), '', [modelBox, roundButton('sliders', t('conversationSettings'), t('conversationSettingsTip'), () => openConversationSettings(entry)), view.lockSlot]);
    view.head = head;
    view.toggleSlot = headerToggleSlot;
    view.titleEl = head.querySelector('.header-title');
    view.subEl = head.querySelector('.header-sub');
    on(view.titleEl, 'dblclick', () => startTitleEdit(entry));
    view.titleEl.title = t('renameHint');

    view.column = h('div', { class: 'column' });
    view.sentinel = h('div', { 'aria-hidden': 'true', style: 'height:1px' });
    view.scroller = h('div', { class: 'scroller', tabindex: '-1' }, view.column);
    const scroller = view.scroller;
    on(scroller, 'scroll', () => { view.stick = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 80; }, { passive: true });
    view.toBottom = h('button', { type: 'button', class: 'to-bottom', 'aria-label': t('scrollToBottom'), title: t('scrollToLatest'), tabindex: '-1' }, icon('arrowDown'));
    const toBottom = view.toBottom;
    on(toBottom, 'click', () => scrollToEnd(scroller, true));
    view.io = new IntersectionObserver(list => {
      const visible = list[list.length - 1].isIntersecting;
      toBottom.classList.toggle('shown', !visible);
      toBottom.tabIndex = visible ? -1 : 0;
    }, { root: scroller, rootMargin: '0px 0px 40px 0px' });
    view.io.observe(view.sentinel);

    view.composer = buildComposer(entry, view);
    view.strip = buildStrip(entry, view);
    view.root = h('div', { class: 'room-body', style: 'flex:1' }, head, h('div', { class: 'room-body' }, scroller, toBottom), view.composer.wrap, view.strip.wrap);
    entry.view = view; // renderMessages and the updates below find the view through the entry
    updateHeader(entry);
    renderMessages(entry, true);
    updateComposer(entry);
    updateStrip(entry);
    return view;
  }

  /** Scrolls to the end; rows render lazily (content-visibility), so settle over a few frames. */
  function scrollToEnd(scroller, smooth) {
    let frames = 0, last = -1;
    const step = () => {
      if (!scroller.isConnected) return;
      const target = scroller.scrollHeight - scroller.clientHeight;
      if (smooth && frames === 0) scroller.scrollTo({ top: target, behavior: 'smooth' }); else scroller.scrollTop = target;
      if (target !== last && frames++ < 8) { last = target; requestAnimationFrame(step); }
    };
    requestAnimationFrame(step);
  }

  /** Rebuilds every row (after a send, a stop, an edit, a rollback, or a change from another tab). */
  function renderMessages(entry, toEnd) {
    const view = entry.view;
    if (!view) return;
    const c = entry.conversation;
    const keepTop = view.scroller.scrollTop;
    const wasStuck = view.stick;
    for (const url of entry.blobs) URL.revokeObjectURL(url);
    entry.blobs = [];
    dropShapes(view.column);
    view.column.replaceChildren();
    view.rows = new Map();
    const messages = arr(c.messages);
    if (obj(c.forkedFrom)) view.column.append(h('div', { class: 'forked', text: t('forkedFrom') }));
    if (!messages.length) view.column.append(invitation(modelFor(c.settings, providerFor(c.settings))));
    const notes = thinkingOffRepeats(messages);
    // Context compaction: requests send the messages up to here as a summary. Parley keeps them all.
    const compaction = obj(c.compaction);
    const compactedThrough = compaction && Ctx.compactionBoundary(c) !== null ? str(compaction.throughMessageID) : '';
    messages.forEach((m, i) => {
      let row;
      try { row = messageRow(entry, c, m, notes[i], i); } catch (_) { row = h('div', { class: 'msg' }, h('div', { class: 'row-failed', text: t('messageFailed') })); }
      view.column.append(row);
      if (obj(m)) view.rows.set(str(m.id), row);
      if (compactedThrough && obj(m) && str(m.id) === compactedThrough) view.column.append(compactionDivider(compaction));
    });
    view.column.append(view.sentinel);
    view.scroller.classList.toggle('no-messages', !messages.length);
    if (toEnd || wasStuck) { view.stick = true; scrollToEnd(view.scroller); } else view.scroller.scrollTop = keepTop;
  }

  /** The streaming reply only: one row replaced, at most every 100 ms. */
  function updateStreamRow(entry) {
    const view = entry.view, run = entry.run;
    if (!view || !run || run.kind !== 'reply') return;
    const c = entry.conversation;

  let modelListSeq = 0;

  // ===========================================================================================
  // The composer.
  function buildComposer(entry, view) {
    const input = h('textarea', { class: 'composer-input', rows: '1', placeholder: idlePlaceholder(), 'aria-label': t('composerLabel'), dir: 'auto' });
    const attach = roundButton('paperclip', t('attachFiles'), t('attachTip'), () => { if (!isBusy(entry)) attachInput.click(); });
    const send = h('button', { type: 'button', class: 'send-btn' });
    const box = h('div', { class: 'composer' }, attach, input, send);
    addShape(box, [{ seed: 41, radius: 16, amplitude: 1.2, inset: 0.5 }], 'shadow-paper');
    const editBar = h('div', { class: 'edit-bar', hidden: true, role: 'status' });
    const chips = h('div', { class: 'draft-strip' });

  }
  function autosize(input) {

  }
  const canSend = entry => entry.draft.text.trim() !== '' || entry.draft.attachments.length > 0;
  function updateSendState(entry) {
    const comp = entry.view && entry.view.composer;

    comp.send.disabled = !isBusy(entry) && !canSend(entry);

  /** Everything of the composer that depends on the entry's state: busy, editing, chips. */
  /** The long hint does not fit a phone's composer: there it is just "Message…". */

  function updateComposer(entry) {
    const view = entry.view;

    const comp = view.composer, d = entry.draft, busy = isBusy(entry);
    if (comp.input.value !== d.text) comp.input.value = d.text;
    autosize(comp.input);
    comp.attach.disabled = busy;

    comp.send.setAttribute('aria-label', busy ? t('stopGenerating') : t('sendMessage'));
    comp.send.title = busy ? t('stopTip') : t('sendTip');
    updateSendState(entry);
    // The edit bar: Edit & Resend puts a message here; sending replaces it and what follows.
    comp.editBar.replaceChildren();
    comp.editBar.hidden = !d.editID;
    if (d.editID) {
      const index = entry.conversation.messages.findIndex(m => m.id === d.editID);
      const after = index < 0 ? 0 : entry.conversation.messages.length - index - 1;
      const cancel = h('button', { type: 'button', class: 'callout-toggle', text: t('cancel') });
      on(cancel, 'click', () => cancelEdit(entry));

        h('strong', { text: t('editingMessage') }), ' ', after === 0 ? t('editReplacesIt') : after === 1 ? t('editReplacesOne') : t('editReplacesMany', { n: after })), cancel);
    }

  function draftChip(entry, view, a) {
    const filename = str(a.filename) || t('attachmentDefault');
    const chip = h('div', { class: 'chip draft-chip', title: filename });

      const url = imageURL(entry, a, view.draftBlobs);
      if (url) {
        const img = h('img', { alt: '', class: 'draft-thumb', draggable: 'false' });
        img.src = url; // a blob: URL made here from the picked file's bytes
        chip.append(img);
      } else chip.append(icon('photo'));
    } else chip.append(icon('doc'));
    const remove = h('button', { type: 'button', class: 'chip-remove', 'aria-label': t('removeAttachment', { name: filename }), title: t('removeAttachmentTip') }, icon('xmark'));
    on(remove, 'click', () => {

  // ---- attachments: images and text files, as the app loads them (AttachmentLoader)
  const MAX_TEXT_BYTES = 1000000;
  const MAX_IMAGE_DIMENSION = 2048;
  const MAX_IMAGE_FILE_BYTES = 200000000;
  const MAX_PNG_BYTES = 4000000;
  /** UTF-8, else GB18030 (a Chinese text file saved by an older editor); null when it is not text. */
  function decodeText(bytes) {
    const head = bytes.subarray(0, 8192);
    for (let i = 0; i < head.length; i++) if (head[i] === 0) return null;
    try { return new TextDecoder('utf-8', { fatal: true }).decode(bytes); } catch (_) { /* not UTF-8 */ }
    try { return new TextDecoder('gb18030', { fatal: true }).decode(bytes); } catch (_) { return null; }
  }
  const canvasBlob = (canvas, type, quality) => new Promise(resolve => canvas.toBlob(resolve, type, quality));
  async function loadImage(file) {
    const bitmap = await createImageBitmap(file);
    try {
      const scale = Math.min(1, MAX_IMAGE_DIMENSION / Math.max(bitmap.width, bitmap.height));
      const w = Math.max(1, Math.round(bitmap.width * scale)), hh = Math.max(1, Math.round(bitmap.height * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = hh;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(bitmap, 0, 0, w, hh);
      // Re-encoding drops EXIF and GPS data. PNG is kept for pictures with transparency while it stays small.
      const pixels = ctx.getImageData(0, 0, w, hh).data;
      let alpha = false;
      for (let i = 3; i < pixels.length; i += 4) if (pixels[i] < 255) { alpha = true; break; }
      let blob = alpha ? await canvasBlob(canvas, 'image/png') : null;
      let mimeType = 'image/png';
      if (!blob || blob.size >= MAX_PNG_BYTES) {
        if (alpha) { ctx.globalCompositeOperation = 'destination-over'; ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, w, hh); }
        blob = await canvasBlob(canvas, 'image/jpeg', 0.85);
        mimeType = 'image/jpeg';
      }
      if (!blob) throw new Error('encode');
      return { mimeType, data: Core.bytesToBase64(new Uint8Array(await blob.arrayBuffer())) };
    } finally {
      bitmap.close();
    }
  }
  /** One picked file as an Attachment, or throws 'tooLarge' / 'unsupported'. */
  async function attachmentFrom(file) {
    const filename = str(file.name) || t('attachmentDefault');
    const type = str(file.type).toLowerCase();
    if (IMAGE_TYPES.has(type)) {
      if (file.size > MAX_IMAGE_FILE_BYTES) throw new Error('tooLarge');
      let image;
      try { image = await loadImage(file); } catch (_) { throw new Error('unsupported'); }
      return { id: Ctx.newID(), kind: 'image', filename, mimeType: image.mimeType, data: image.data };
    }
    if (file.size > MAX_TEXT_BYTES) {
      const sample = decodeText(new Uint8Array(await file.slice(0, 4096).arrayBuffer()));
      throw new Error(sample === null ? 'unsupported' : 'tooLarge');
    }
    const text = decodeText(new Uint8Array(await file.arrayBuffer()));
    if (text === null) throw new Error('unsupported');
    return { id: Ctx.newID(), kind: 'text', filename, mimeType: type.startsWith('text/') ? type : 'text/plain', text };
  }
  async function addDraftFiles(entry, fileList) {
    if (isBusy(entry) || !entry.conversation) return;
    for (const file of Array.from(fileList || [])) {
      try {
        entry.draft.attachments.push(await attachmentFrom(file));
      } catch (e) {
        const name = middle(str(file.name) || t('attachmentDefault'), 50);
        toast(t('cantAttach', { name }), e && e.message === 'tooLarge' ? t('attachTooLarge') : t('attachUnsupported'));
      }
    }
    updateComposer(entry);
  }

  // ---- edit and resend
  function beginEdit(entry, index) {
    const m = entry.conversation.messages[index];
    if (isBusy(entry) || !m || m.role !== 'user') return;
    const d = entry.draft;
    if (!d.editID) d.before = { text: d.text, attachments: d.attachments };
    d.editID = m.id;
    d.text = str(m.content);
    d.attachments = arr(m.attachments).map(a => ({ ...a }));
    updateComposer(entry);
    entry.view.composer.input.focus();
  }
  function cancelEdit(entry) {
    const d = entry.draft;
    if (!d.editID) return;
    d.editID = null;
    d.text = d.before ? d.before.text : '';
    d.attachments = d.before ? d.before.attachments : [];
    d.before = null;
    updateComposer(entry);
  }

  // ===========================================================================================
  // The context strip under the composer, and what it shows (port of ContextStatusBar).
  const TokenFormat = {
    /** k = 1024 tokens: 950 -> "950", 12431 -> "12.1k", 32768 -> "32k", 262144 -> "256k", 1048576 -> "1M". */
    tokens(n) {
      const trimmed = (v, digits) => { let out = v.toFixed(digits); if (out.includes('.')) { out = out.replace(/0+$/, ''); if (out.endsWith('.')) out = out.slice(0, -1); } return out; };
      if (n < 1024) return String(n);
      if (n < 100 * 1024) return trimmed(n / 1024, 1) + 'k';
      if (n < 1024 * 1024) return Math.round(n / 1024) + 'k';
      return trimmed(n / 1048576, 2) + 'M';
    },
    /** The user's typed count: digits, optionally with grouping separators. Null for anything else, or zero. */
    parse(text) {
      const digits = String(text).trim().replace(/[,.'_\s  ]/g, '');
      if (!/^\d{1,15}$/.test(digits)) return null;
      const n = Number(digits);
      return n > 0 ? n : null;
    },
    percent: p => (p < 10 && p > 0 ? p.toFixed(1) + '%' : Math.round(p) + '%'),
  };
  /** The threshold field: a whole percent from 30 to 95, with an optional % sign. */
  function parseThreshold(text) {
    const m = /^\s*(\d{1,3})\s*[%％]?\s*$/.exec(String(text));
    if (!m) return null;
    const n = Number(m[1]);
    return n >= Ctx.THRESHOLD_MIN && n <= Ctx.THRESHOLD_MAX ? n : null;
  }

  function contextSnapshot(entry) {
    const c = entry.conversation, settings = obj(c.settings) || {};
    const provider = providerFor(settings), model = modelFor(settings, provider);
    const effective = Ctx.effectiveHistory(c);
    const run = entry.run && entry.run.kind === 'reply' ? entry.run : null;
    const meter = run && run.phase === 'generating' ? run.meter : null;
    const usage = Ctx.usage(effective.messages, Ctx.systemText(effective, str(settings.systemPrompt)), {
      inFlightID: run ? run.messageID : null,
      liveCompletionTokens: meter ? meter.generatedTokens : 0,
      liveIsEstimated: meter ? meter.isEstimated : false,
      anchorsFrom: effective.anchorsFrom,
    });
    const info = provider && model ? modelInfo(provider, model) : null;
    const key = provider && model ? ctxKey(provider, model) : null;
    const manual = key && hasOwn(prefs.manualContext, key) ? prefs.manualContext[key] : null;
    const learned = key && hasOwn(prefs.learnedContext, key) ? prefs.learnedContext[key] : null;
    const limit = Ctx.limit({ info: info ? { loadedContextLength: info.contextLength, maxContextLength: info.maxContextLength } : undefined, manual, learned });
    let rate = null, rateEstimated = false, ttft = null, progress = null;
    if (meter) {
      rate = meter.tokensPerSecond; rateEstimated = meter.isEstimated; progress = meter.promptProgress;
    } else {
      for (let i = c.messages.length - 1; i >= 0; i--) {
        const m = c.messages[i];
        const stats = m.role === 'assistant' ? latestStats(m) : null;
        if (stats) { rate = num(stats.tokensPerSecond); rateEstimated = stats.isEstimated === true; ttft = num(stats.timeToFirstToken); break; }
      }
    }
    const percent = limit ? usage.tokens / limit.tokens * 100 : null;

  }
  const sourceText = source => ({ server: t('srcServer'), manual: t('srcManual'), learned: t('srcLearned') }[source] || t('srcMaximum'));
  const usageText = usage => (usage.tokens > 0 ? (usage.isEstimated ? '≈' : '') + TokenFormat.tokens(usage.tokens) : '—');

  function ring(fraction, color) {
    const svg = s('svg', { class: 'ring', viewBox: '0 0 11 11', width: 11, height: 11, 'aria-hidden': 'true', focusable: 'false' });
    const circumference = 2 * Math.PI * 4.5;
    svg.append(s('circle', { cx: 5.5, cy: 5.5, r: 4.5, fill: 'none', stroke: 'var(--line)', 'stroke-width': 2 }));
    const arc = s('circle', { cx: 5.5, cy: 5.5, r: 4.5, fill: 'none', 'stroke-width': 2, 'stroke-linecap': 'round', transform: 'rotate(-90 5.5 5.5)',
      'stroke-dasharray': `${r2(circumference * Math.min(Math.max(fraction, 0), 1))} ${r2(circumference)}` });
    arc.style.stroke = color;
    svg.append(arc);
    return svg;
  }
  const gaugeColor = p => (p === null ? 'var(--inkSoft)' : p >= 95 ? 'var(--danger)' : p >= 80 ? 'var(--ember)' : 'var(--marigold)');
  const gaugeTextColor = p => (p === null || p < 80 ? 'var(--inkSoft)' : p >= 95 ? 'var(--danger)' : 'var(--caution)');

  function buildStrip(entry, view) {
    const btn = h('button', { type: 'button', class: 'status-btn' });
    on(btn, 'click', () => openContextDialog(entry));
    return { wrap: h('div', { class: 'status-row' }, btn), btn };
  }
  function updateStrip(entry) {
    const view = entry.view;
    if (!view || !entry.conversation) return;
    const snap = contextSnapshot(entry);
    const run = entry.run;
    const dot = () => h('span', { class: 'strip-dot', 'aria-hidden': 'true', text: '·' });
    const parts = [];
    const speed = snap.rate !== null ? t('tokensPerSecond', { rate: (snap.rateEstimated ? '≈' : '') + rate(snap.rate) }) : t('tokensPerSecond', { rate: '—' });
    let spoken = [];
    if (run && run.phase === 'compacting') {
      parts.push(h('span', { class: 'strip-item strong' }, icon('wrench'), t('compacting')), dot());
      spoken.push(t('compacting'));
    } else if (run && snap.progress && snap.progress.total > 0) {
      const text = t('readingPrompt', { n: Math.floor(Math.min(1, snap.progress.processed / snap.progress.total) * 100) });
      parts.push(h('span', { class: 'strip-item strong', text }), dot());
      spoken.push(text);
    } else if (snap.streaming || snap.rate !== null) {
      parts.push(h('span', { class: 'strip-item' + (snap.streaming ? ' strong' : ''), text: speed }), dot());

    if (snap.limit) {

    } else {
      tail = [];

  }


  // ===========================================================================================
  // Sending and replying (ConversationSession.send / startReply / runReply, without tools).
  const graphemes = text => (typeof Intl.Segmenter === 'function'
    ? Array.from(new Intl.Segmenter(undefined, { granularity: 'grapheme' }).segment(text), part => part.segment) : Array.from(text));
  /** ConversationSession.autoTitle: the first message, whitespace collapsed, at most 40 characters. */
  function autoTitle(text, attachments) {
    const collapsed = String(text).split(/\s+/).filter(Boolean).join(' ');
    const source = collapsed || (attachments && attachments[0] ? str(attachments[0].filename) : DEFAULT_TITLE);
    const chars = graphemes(source);
    if (chars.length <= 40) return source;
    return chars.slice(0, 39).join('').trim() + '…';
  }

  /** Everything that follows a change to the history: rows, header, composer, strip. */
  function refreshAll(entry) {
    if (!entry.view || !entry.conversation) return;
    updateHeader(entry);

    updateStrip(entry);
  }

  function sendDraft(entry) {
    if (isBusy(entry) || !entry.conversation) return;
    const d = entry.draft;
    const trimmed = d.text.trim();
    if (trimmed === '' && !d.attachments.length) return;
    let c = entry.conversation;
    if (d.editID) {

      const index = c.messages.findIndex(m => m.id === d.editID);
      if (index >= 0) c = entry.conversation = Ctx.truncate(c, index - 1);
    }
    const first = !c.messages.some(m => m.role === 'user');
    c.messages.push({ id: Ctx.newID(), role: 'user', content: d.text, attachments: d.attachments, createdAt: Ctx.isoNow(), isComplete: true });
    if (first && str(c.title) === DEFAULT_TITLE) c.title = autoTitle(trimmed, d.attachments);
    touch(entry);
    entry.draft = { text: '', attachments: [], editID: null, before: null };
    startReply(entry);
  }

  function requestOptions(settings, provider, model, effective) {
    const options = { model, systemPrompt: str(settings.systemPrompt), historySummary: effective.summaryBlock || undefined, serverKind: kindOf(provider) };
    if (num(settings.temperature) !== null) options.temperature = settings.temperature;
    if (posInt(settings.maxTokens)) options.maxTokens = settings.maxTokens;
    if (['low', 'medium', 'high'].includes(settings.reasoningEffort)) options.reasoningEffort = settings.reasoningEffort;
    if (settings.disablesThinking === true) {
      options.disablesThinking = true;
      if (refusedThinkingOff.has(ctxKey(provider, model))) options.omitsThinkingOff = true;
    }
    if (refusedStreamOptions.has(ctxKey(provider, model))) options.omitStreamOptions = true;
    return options;
  }

  /** Appends the assistant placeholder and streams the reply to the history before it. */
  function startReply(entry) {
    if (isBusy(entry) || !entry.conversation) return;
    const c = entry.conversation;
    if (!obj(c.settings)) c.settings = { model: '', systemPrompt: '' };
    const settings = c.settings;
    // The history excludes the placeholder about to be appended. After compaction it is the
    // messages after the summary, and the summary goes in the system text.
    const effective = Ctx.effectiveHistory(c);
    const history = effective.messages.slice();
    const provider = providerFor(settings);
    const model = modelFor(settings, provider);
    const placeholder = { id: Ctx.newID(), role: 'assistant', content: '', attachments: [], createdAt: Ctx.isoNow(), isComplete: false };
    if (model) placeholder.model = model;
    const failure = !provider ? 'No API provider is configured. Add one in Settings.'
      : !model ? `No model selected. Pick a model at the top of the window or set a default model for ${provider.name} in Settings.` : null;
    c.messages.push(placeholder);
    touch(entry);
    if (failure) {
      placeholder.error = failure;
      saveNow(entry);
      refreshAll(entry);
      return;
    }
    const run = {
      kind: 'reply', messageID: placeholder.id, controller: new AbortController(), acc: new Chat.StreamAccumulator(), meter: null,
      phase: 'generating', timer: 0, stopped: false, provider, model, sentThinkingOff: false,
    };
    entry.run = run;
    entry.compactionError = null;
    entry.compactionNotice = null;
    saveNow(entry); // the user's message is kept even if the reply never comes
    if (entry.view) entry.view.stick = true;
    refreshAll(entry);
    entry.runDone = runReply(entry, run, history, requestOptions(settings, provider, model, effective));
  }

  const addNote = (message, kind, detail) => { if (message) message.toolNotes = arr(message.toolNotes).concat([{ kind, detail }]); };
  function applyAccumulator(message, run) {
    const acc = run.acc;
    message.content = acc.content;
    if (acc.reasoning !== '') message.reasoning = acc.reasoning; else delete message.reasoning;
    const duration = acc.reasoningDuration;
    if (duration !== null) message.reasoningDuration = duration; else delete message.reasoningDuration;
    if (acc.usage) message.usage = acc.usage;
  }
  /** The live parts of the screen, at most every 100 ms however fast the chunks come. */
  function scheduleRunUpdate(entry, run) {
    scheduleSave(entry, entry.encrypted ? 1000 : 2000);
    if (run.timer) return;
    run.timer = setTimeout(() => {
      run.timer = 0;
      if (entry.run !== run) return;
      updateStreamRow(entry);
      updateStrip(entry);
    }, 100);
  }

  async function runReply(entry, run, history, options) {
    const { provider, model } = run;
    const key = ctxKey(provider, model);
    const message = () => (entry.conversation ? entry.conversation.messages.find(m => m.id === run.messageID) : null);
    let outcome = 'done', failure = null;
    try {
      // Automatic compaction, before a reply to a user turn: the earlier messages are summarized,
      // and the request carries the summary and the rest.
      const last = history[history.length - 1];
      if (last && last.role === 'user' && prefs.autoCompact) {
        const snap = contextSnapshot(entry);
        if (Ctx.isDue(snap.usage, snap.limit, prefs.threshold)) {
          run.phase = 'compacting';
          updateStreamRow(entry); updateStrip(entry);
          const end = entry.conversation.messages.findIndex(m => m.id === run.messageID);
          const result = await compactHistory(entry, { provider, model, serverKind: options.serverKind, end, signal: run.controller.signal });
          run.phase = 'generating';
          if (run.stopped || run.controller.signal.aborted) throw abortError();
          if (result.kind === 'done') {
            const effective = Ctx.effectiveHistory(entry.conversation);
            history = effective.messages.filter(m => m.id !== run.messageID);
            options.historySummary = effective.summaryBlock || undefined;
          } else if (result.kind === 'failed') {
            addNote(message(), 'compactionFailed', result.error);
          }
        }
      }
      run.meter = new Chat.GenerationMeter(Date.now());
      run.sentThinkingOff = Chat.sentThinkingOffFields(options).length > 0;
      updateStreamRow(entry);
      const stream = Chat.streamChat({ baseURL: provider.baseURL, apiKey: provider.apiKey, messages: history, options, signal: run.controller.signal });
      for await (const delta of stream) {
        if (delta.streamOptionsRejected) { refusedStreamOptions.add(key); continue; }
        if (delta.thinkingOffRejected) {
          refusedThinkingOff.add(key);
          const m = message();
          if (m) m.thinkingOffNotAccepted = true;
          continue;
        }
        const now = Date.now();
        run.meter.record(delta, now);
        run.acc.apply(delta, now);
        const m = message();
        if (m) applyAccumulator(m, run);
        scheduleRunUpdate(entry, run);
      }
    } catch (e) {
      if (run.stopped || (e && e.name === 'AbortError')) outcome = 'stopped';
      else { outcome = 'failed'; failure = e; }
    }
    finishReply(entry, run, outcome, failure);
  }
  const abortError = () => { const e = new Error('The request was cancelled.'); e.name = 'AbortError'; return e; };

  function finishReply(entry, run, outcome, failure) {
    clearTimeout(run.timer);
    run.timer = 0;
    const c = entry.conversation;
    const m = c ? c.messages.find(x => x.id === run.messageID) : null;
    if (m && !entry.discarded) {
      run.acc.finish();
      applyAccumulator(m, run);
      m.isComplete = outcome === 'done';
      if (outcome === 'failed') {
        // Stored as the app stores it: fixed English, shown translated by presentError.
        m.error = scrubError(failure && failure.message ? String(failure.message) : String(failure), run.provider);
        const learned = Chat.contextLengthFromError(m.error);
        if (learned) { prefs.learnedContext[ctxKey(run.provider, run.model)] = learned; savePrefs(); }
      }
      const stats = run.meter ? run.meter.finalStats() : null;
      if (stats) m.stats = stats;
      // "None" was sent and thinking came back anyway (an empty <think></think> does not count).
      if (run.sentThinkingOff && m.thinkingOffNotAccepted !== true && str(m.reasoning).trim() !== '') {
        m.thinkingOffIgnored = true;
        if (run.provider.kind && run.provider.kind !== 'auto') m.thinkingOffServerKind = run.provider.kind;
      }
      touch(entry);
    }
    entry.run = null;
    if (!entry.discarded) {
      saveNow(entry);
      refreshAll(entry);
      ctxDialogUpdate();
    }
  }

  function stopEntry(entry) {
    const run = entry.run;
    if (!run) return;
    run.stopped = true;
    run.controller.abort();
  }

  // ---- compaction (ConversationSession.compactHistory / compactNow / restoreFullHistory)
  /**
   * Folds the messages before the newest user turn (and before `end`) into the summary, with the
   * conversation's own model: the earlier summary and the newly covered messages go in, a new
   * summary comes out; a history too long for one request goes a piece at a time. Changes nothing
   * unless it succeeds. Returns {kind: 'done' | 'nothing' | 'failed' | 'cancelled', error?}.
   */
  async function compactHistory(entry, { provider, model, serverKind, end, signal }) {
    const c = entry.conversation;
    const limit = contextSnapshot(entry).limit;
    const current = Ctx.compactionBoundary(c);
    const snapshot = c.messages.slice();
    if (!(end > 0 && end <= snapshot.length)) return { kind: 'nothing' };
    const through = Ctx.boundary(snapshot, current, limit ? limit.tokens : null, end);
    if (through === null) return { kind: 'nothing' };
    const covered = snapshot.slice((current === null ? -1 : current) + 1, through + 1);
    let summary = current === null ? null : str(c.compaction.summary);
    // A summary request of its own: no tools, no thinking, no system prompt, a fixed length.
    const key = ctxKey(provider, model);
    const options = { model, maxTokens: Ctx.SUMMARY_MAX_TOKENS, disablesThinking: true, serverKind };
    if (refusedThinkingOff.has(key)) options.omitsThinkingOff = true;
    if (refusedStreamOptions.has(key)) options.omitStreamOptions = true;
    // Room for the input of one request: the context, less the summary it writes, the earlier
    // summary, the instruction and a margin.
    const budget = limit ? Math.max(1024, limit.tokens - Ctx.SUMMARY_MAX_TOKENS - 1024 - Ctx.estimateTokens(summary || '') - Ctx.estimateTokens(Ctx.INSTRUCTION)) : null;
    const pieces = budget === null ? [covered] : Ctx.chunks(covered, budget);
    try {
      for (const piece of pieces) {
        const acc = new Chat.StreamAccumulator();
        const messages = Ctx.requestMessages(summary, piece);
        for await (const delta of Chat.streamChat({ baseURL: provider.baseURL, apiKey: provider.apiKey, messages, options, signal })) {
          if (signal.aborted) return { kind: 'cancelled' };
          if (delta.streamOptionsRejected) { refusedStreamOptions.add(key); continue; }
          if (delta.thinkingOffRejected) { refusedThinkingOff.add(key); continue; }
          acc.apply(delta);
        }
        acc.finish();
        if (signal.aborted) return { kind: 'cancelled' };
        // Cut off at the length limit: what it left out would be lost to every later request.
        if (acc.finishReason === 'length') return { kind: 'failed', error: 'API error: The summary was cut off by its length limit.' };
        const text = Ctx.trim(acc.content);
        if (text === '') return { kind: 'failed', error: 'API error: The model returned an empty summary.' };
        summary = text;
      }
    } catch (e) {
      if (signal.aborted || (e && e.name === 'AbortError')) return { kind: 'cancelled' };
      return { kind: 'failed', error: scrubError(e && e.message ? String(e.message) : String(e), provider) };
    }
    // The history cannot change while this runs (every edit waits for the busy state), but check.
    const now = entry.conversation && entry.conversation.messages;
    if (summary === null || !now || now.length < end || now[through].id !== snapshot[through].id || now[end - 1].id !== snapshot[end - 1].id) return { kind: 'cancelled' };
    entry.conversation.compaction = {
      summary, throughMessageID: snapshot[through].id, countsStaleThroughID: snapshot[end - 1].id,
      createdAt: Ctx.isoNow(), model, messageCount: through + 1,
    };
    touch(entry);
    saveNow(entry);
    return { kind: 'done' };
  }

  /** Compact Now, from the context popover: summarizes everything but the newest exchange. */
  async function compactNow(entry) {
    if (isBusy(entry) || !entry.conversation) return;
    entry.compactionError = null;
    entry.compactionNotice = null;
    const settings = entry.conversation.settings;
    const provider = providerFor(settings), model = modelFor(settings, provider);
    if (!provider || !model) { entry.compactionError = { text: t('chooseModelFirst') }; ctxDialogUpdate(); return; }
    const run = { kind: 'compact', messageID: null, controller: new AbortController(), phase: 'compacting', stopped: false, provider, model, timer: 0 };
    entry.run = run;
    refreshAll(entry);
    ctxDialogUpdate();
    entry.runDone = (async () => {
      let result;
      try {
        result = await compactHistory(entry, { provider, model, serverKind: kindOf(provider), end: entry.conversation.messages.length, signal: run.controller.signal });
      } catch (e) {
        result = { kind: 'failed', error: scrubError((e && e.message) || e, provider) };
      }
      entry.run = null;
      if (result.kind === 'failed') entry.compactionError = { raw: result.error };
      else if (result.kind === 'nothing') entry.compactionNotice = t('nothingToCompact');
      if (!entry.discarded) { refreshAll(entry); ctxDialogUpdate(); }
    })();
  }
  function restoreFullHistory(entry) {
    if (isBusy(entry) || !entry.conversation || !entry.conversation.compaction) return;
    delete entry.conversation.compaction;
    entry.compactionError = null;
    entry.compactionNotice = null;
    touch(entry);
    saveNow(entry);
    refreshAll(entry);
    ctxDialogUpdate();
  }

  // ---- message actions (disabled while a reply or a compaction runs)
  function regenerate(entry, index) {
    const m = entry.conversation.messages[index];
    if (isBusy(entry) || !m || m.role !== 'assistant') return;
    entry.draft.editID = null;
    entry.conversation = Ctx.truncate(entry.conversation, index - 1);
    startReply(entry);
  }
  function askRollback(entry, index) {
    if (isBusy(entry)) return;
    openAsk({
      title: t('rollbackTitle'), message: t('rollbackMessage'), confirmLabel: t('rollBack'), danger: true,
      onConfirm: () => {
        if (isBusy(entry)) return t('busyNow');
        entry.draft.editID = null;
        entry.conversation = Ctx.truncate(entry.conversation, index);
        saveNow(entry);
        refreshAll(entry);
        return null;
      },
    });
  }
  async function forkFrom(entry, index) {
    if (isBusy(entry)) return;
    const forked = Ctx.forked(entry.conversation, index, Ctx.newID());
    try { await store.put(forked, entry.encrypted ? { key: entry.keyInfo } : undefined); } catch (e) { showStorageError(e); return; }
    await refreshList();
    const copy = entryOf(forked.id);
    if (!copy) return;
    copy.conversation = forked;
    copy.loaded = true;
    if (entry.encrypted) { copy.encrypted = true; copy.keyInfo = entry.keyInfo; }
    select(copy.key);
  }

  // ===========================================================================================
  // The context popover (a dialog): usage, limit, "Your value", and the Compaction card.
  let ctxState = null;
  function openContextDialog(entry) {
    if (!entry.conversation) return;
    const state = { entry };
    const snap0 = contextSnapshot(entry);
    if (!snap0.provider || !snap0.model) {
      ctxDialog.replaceChildren(h('div', { class: 'sheet ctx-sheet' }, h('h2', { text: t('context') }), h('p', { text: t('chooseModelContext') }), closeButton(ctxDialog)));
      showModal(ctxDialog);
      return;
    }
    const gaugeFill = h('div', { class: 'gauge-fill' });
    const gauge = h('div', { class: 'gauge', role: 'img', 'aria-label': t('contextUsed') }, gaugeFill);
    const details = h('dl', { class: 'info-grid ctx-grid' });
    const refresh = h('button', { type: 'button', class: 'round-btn', 'aria-label': t('refreshModels'), title: t('askAgain', { name: snap0.provider.name }) }, icon('refresh'));
    on(refresh, 'click', () => ensureModels(contextSnapshot(entry).provider, true));
    const card1 = h('div', { class: 'ctx-card' }, gauge, details);

    // Your value
    const manualInput = h('input', { type: 'text', inputmode: 'numeric', class: 'field-input', placeholder: t('manualPlaceholder'), 'aria-label': t('manualLabel'), autocomplete: 'off' });
    const manualSave = h('button', { type: 'button', class: 'sheet-btn primary', text: t('save') });
    const manualClear = h('button', { type: 'button', class: 'sheet-btn soft', text: t('clear') });
    const manualHelp = h('div', { class: 'ctx-help' });
    const saveManual = () => {
      const n = TokenFormat.parse(manualInput.value);
      const snap = contextSnapshot(entry);
      if (n === null || !snap.key) return;
      prefs.manualContext[snap.key] = n;
      savePrefs();
      updateStrip(entry);
      updateCtx();
    };
    on(manualInput, 'input', () => updateCtx());
    on(manualInput, 'keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); saveManual(); } });
    on(manualSave, 'click', saveManual);
    on(manualClear, 'click', () => {
      const snap = contextSnapshot(entry);
      if (snap.key) delete prefs.manualContext[snap.key];
      manualInput.value = '';
      savePrefs();
      updateStrip(entry);
      updateCtx();
    });
    const card2 = h('div', { class: 'ctx-card' }, h('h3', { class: 'lettered', text: t('yourValue') }), h('div', { class: 'ctx-row' }, manualInput, manualSave, manualClear), manualHelp);

    // Compaction
    const autoBox = h('input', { type: 'checkbox', id: 'ctx-auto' });
    autoBox.checked = prefs.autoCompact;
    const thresholdInput = h('input', { type: 'text', inputmode: 'numeric', class: 'field-input narrow', 'aria-label': t('thresholdLabel'), autocomplete: 'off', placeholder: String(Ctx.DEFAULT_THRESHOLD_PERCENT) });
    thresholdInput.value = String(prefs.threshold);
    const thresholdWarn = h('span', { class: 'warn-text', text: t('thresholdRange'), title: t('thresholdRangeTip') });
    const autoNote = h('div', { class: 'ctx-help' });
    const statusLine = h('div', { class: 'ctx-help' });
    const compactBtn = h('button', { type: 'button', class: 'sheet-btn primary' });
    const restoreBtn = h('button', { type: 'button', class: 'sheet-btn soft', text: t('restoreFull'), title: t('restoreFullTip') });
    const messageLine = h('div', { class: 'ctx-help', role: 'status' });
    on(autoBox, 'change', () => { prefs.autoCompact = autoBox.checked; savePrefs(); updateCtx(); });
    // Parsed on every keystroke, and only a value in range is taken, so typing "85" does not pass through 8.
    on(thresholdInput, 'input', () => {
      const n = parseThreshold(thresholdInput.value);
      if (n !== null) { prefs.threshold = n; savePrefs(); }
      updateCtx();
    });
    on(thresholdInput, 'blur', () => { thresholdInput.value = String(prefs.threshold); updateCtx(); });
    on(compactBtn, 'click', () => { if (isBusy(entry)) { if (entry.run.kind === 'compact') stopEntry(entry); } else compactNow(entry); });
    on(restoreBtn, 'click', () => restoreFullHistory(entry));
    const card3 = h('div', { class: 'ctx-card' }, h('h3', { class: 'lettered', text: t('compaction') }),
      h('label', { class: 'check-row', for: 'ctx-auto' }, autoBox, h('span', { text: t('compactAutomatically') })),
      h('div', { class: 'ctx-row threshold-row' }, h('span', { text: t('whenContextIs') }), thresholdInput, h('span', { text: '% ' + t('full') }), thresholdWarn),
      autoNote, statusLine, h('div', { class: 'ctx-row' }, compactBtn, restoreBtn), messageLine);

    const heading = h('div', { class: 'ctx-head' }, h('div', {}, h('h2', { class: 'lettered', text: t('context') }), h('div', { class: 'ctx-model', text: snap0.model, dir: 'auto' })), refresh);
    ctxDialog.replaceChildren(h('div', { class: 'sheet ctx-sheet' }, heading, card1, card2, card3, closeButton(ctxDialog)));
    state.update = updateCtx;
    ctxState = state;
    showModal(ctxDialog);
    manualInput.value = snap0.manual ? String(snap0.manual) : '';
    updateCtx();

    function updateCtx() {
      if (ctxState !== state || !entry.conversation) return;
      const snap = contextSnapshot(entry);
      const busy = isBusy(entry);
      const percent = snap.percent;
      gauge.hidden = !snap.limit;
      gaugeFill.style.width = snap.limit ? Math.max(Math.min(percent, 100), 0) + '%' : '0%';
      gaugeFill.style.background = gaugeColor(percent);
      const rows = [];
      const add = (k, ...v) => rows.push(h('dt', { text: k }), h('dd', {}, ...v));
      const note = text => h('div', { class: 'ctx-help', text });
      const approx = snap.usage.isEstimated ? '≈ ' : '';
      add(t('inUse'), snap.usage.tokens > 0
        ? t('tokensWithPercent', { n: approx + grouped(snap.usage.tokens), percent: snap.limit ? ' (' + TokenFormat.percent(percent) + ')' : '' }) : t('nothingYet'),
        snap.usage.isEstimated ? note(t('estimatedNote')) : null);
      if (snap.limit) {
        const source = sourceText(snap.limit.source);
        add(t('limit'), t('tokensCount', { n: grouped(snap.limit.tokens) }), note(source.charAt(0).toUpperCase() + source.slice(1)));
      } else {
        const cached = modelCache.get(snap.provider.id);
        add(t('limit'), cached && cached.loading ? t('checking') : t('unknown'), note(t('limitUnknownHelp', { name: snap.provider.name })));
      }
      if (snap.learned && !(snap.limit && snap.limit.source === 'learned')) {
        add(t('lastError'), t('tokensCount', { n: grouped(snap.learned) }), note(snap.learned === (snap.limit && snap.limit.tokens) ? t('lastErrorSame')
          : snap.limit && snap.limit.source === 'manual' ? t('lastErrorManual') : t('lastErrorReported')));
      }
      if (snap.info && snap.info.maxContextLength && !(snap.limit && snap.limit.source === 'serverMaximum' && snap.limit.tokens === snap.info.maxContextLength)) {
        add(t('modelMax'), t('tokensCount', { n: grouped(snap.info.maxContextLength) }));
      }
      if (snap.rate !== null || snap.ttft !== null) {
        add(t('speed'), [snap.rate !== null ? t('tokensPerSecond', { rate: (snap.rateEstimated ? '≈' : '') + rate(snap.rate) }) : null,
          snap.ttft !== null ? t('firstToken', { time: seconds(snap.ttft) }) : null].filter(Boolean).join(' · '));
      }
      details.replaceChildren(...rows);
      // Your value
      const typed = TokenFormat.parse(manualInput.value);
      manualSave.disabled = typed === null || typed === snap.manual;
      manualClear.hidden = snap.manual === null;
      manualHelp.textContent = snap.info && snap.info.contextLength && snap.manual !== null ? t('manualServerWins')
        : snap.learned || snap.manual !== null ? t('manualHelpLearned') : t('manualHelp');
      // Compaction
      autoBox.checked = prefs.autoCompact;
      thresholdInput.disabled = !prefs.autoCompact;
      thresholdWarn.hidden = parseThreshold(thresholdInput.value) !== null;
      autoNote.textContent = !snap.limit ? t('compactNeedsLimit') : snap.limit.source === 'serverMaximum' ? t('compactNoteMaximum') : t('compactNote');
      const covered = Ctx.compactionBoundary(entry.conversation) !== null && entry.conversation.compaction ? num(entry.conversation.compaction.messageCount) : null;
      statusLine.textContent = covered !== null ? t('compactionStatus', { n: covered }) : t('everyMessageFull');
      compactBtn.replaceChildren(...(busy && entry.run.kind === 'compact' ? [spinner(), t('stopCompacting')] : [t('compactNow')]));
      compactBtn.disabled = (busy && entry.run.kind !== 'compact') || (!busy && entry.conversation.messages.length < 3);
      compactBtn.title = t('compactNowTip');
      restoreBtn.hidden = !(Ctx.compactionBoundary(entry.conversation) !== null);
      restoreBtn.disabled = busy;
      const failure = entry.compactionError;
      messageLine.className = 'ctx-help' + (failure ? ' danger-text' : '');
      messageLine.textContent = failure ? (failure.text || presentError(failure.raw, {}).title) : entry.compactionNotice || '';
    }
  }
  function ctxDialogUpdate() { if (ctxState && ctxState.update) ctxState.update(); }

  // ---- derived message values (Models.swift)
  function visibleText(m) {
    const rounds = arr(m.toolRounds);
    if (!rounds.length) return str(m.content);
    return [...rounds.map(r => str(obj(r) && r.content)), str(m.content)].filter(t => t.trim() !== '').join('\n\n');
  }
  function latestStats(m) {
    if (obj(m.stats)) return m.stats;
    const rounds = arr(m.toolRounds);
    for (let i = rounds.length - 1; i >= 0; i--) if (obj(rounds[i]) && obj(rounds[i].stats)) return rounds[i].stats;
    return null;
  }
  function footerUsage(m) {
    if (obj(m.usage)) return m.usage;
    const rounds = arr(m.toolRounds);
    for (let i = rounds.length - 1; i >= 0; i--) if (obj(rounds[i]) && obj(rounds[i].usage)) return rounds[i].usage;
    return null;
  }
  function footerLine(m) {
    const groups = [];
    const usage = footerUsage(m), stats = latestStats(m);
    if (usage) {
      const parts = [];
      if (num(usage.promptTokens) !== null) parts.push(t('usagePrompt', { n: usage.promptTokens }));
      if (num(usage.completionTokens) !== null) parts.push(t('usageCompletion', { n: usage.completionTokens }));
      if (num(usage.totalTokens) !== null) parts.push(t('usageTotal', { n: usage.totalTokens }));
      if (parts.length) groups.push(t('usageTokens', { parts: parts.join(' · ') }));
    }

  function attachmentStrip(entry, attachments) {
    const strip = h('div', { class: 'strip' });
    for (const a of attachments) {
      if (!obj(a)) continue;
      const filename = str(a.filename) || t('attachmentDefault');
      if (a.kind === 'image') strip.append(imageThumb(entry, a, filename));
      else strip.append(textChip(a, filename));
    }
    return strip;
  }
  function imageURL(entry, a, sink) {
    // One bad image must not take its whole message down: no picture is the worst case.
    try {
      const type = str(a.mimeType).toLowerCase();
      if (!IMAGE_TYPES.has(type)) return null;
      const bytes = Core.base64ToBytes(a.data);
      if (!bytes || !bytes.length) return null;
      const url = URL.createObjectURL(new Blob([bytes], { type }));
      (sink || entry.blobs).push(url);
      return url;
    } catch (_) {
      return null;
    }
  }
  function imageThumb(entry, a, filename) {
    const url = imageURL(entry, a);
    const btn = h('button', { type: 'button', class: 'thumb', title: filename, 'aria-label': t('imageLabel', { name: filename }) });
    if (url) {
      const img = h('img', { alt: '', loading: 'lazy', decoding: 'async', draggable: 'false' });
      img.src = url; // a blob: URL made here from validated base64, never a URL from the file
      on(img, 'error', () => img.replaceWith(h('span', { class: 'no-image' }, icon('photo'))));
      btn.append(img);
      on(btn, 'click', () => showImage(url, filename));
    } else {
      btn.append(h('span', { class: 'no-image' }, icon('photo')));
      btn.disabled = true;
    }
    addShape(btn, [{ seed: uuidSeed(a.id), radius: 7, amplitude: 1.4 }], 'shadow-paper');
    btn.__shape.svg.firstChild.style.fill = 'var(--card)';
    btn.append(washi('var(--marigold)', 46, 13, -2.5, 'translateX(-50%)'));
    return btn;
  }
  function textChip(a, filename) {
    const chip = h('button', { type: 'button', class: 'chip', title: t('clickToPreview'), 'aria-label': t('textFileLabel', { name: filename }) },
      icon('doc'), h('span', { text: middle(filename, 28) }));
    addShape(chip, [{ seed: uuidSeed(a.id), radius: 9, amplitude: 1.4 }], 'shadow-paper');
    chip.__shape.svg.firstChild.style.fill = 'var(--card)';
    on(chip, 'click', () => showText(filename, str(a.text)));
    return chip;
  }

  // ---- rows
  function messageRow(entry, c, m, repeated, index) {
    if (!obj(m)) throw new Error('bad message');
    return m.role === 'user' ? userRow(entry, m, index) : assistantRow(entry, c, m, repeated, index);
  }
  /** The hover buttons of a row. Everything that changes the history is disabled while a reply or a compaction runs. */
  function actionButton(iconName, label, onClick, disabled) {
    const b = h('button', { type: 'button', class: 'paper-btn', 'aria-label': label, title: label, disabled: disabled ? true : null }, icon(iconName));
    on(b, 'click', ev => { ev.stopPropagation(); onClick(); });
    return b;
  }
  function rowActions(entry, m, index) {
    const busy = isBusy(entry);
    const actions = [copyButton('paper-btn', t('copy'), t('copy'), () => (m.role === 'user' ? str(m.content) : visibleText(m)))];
    if (entry.run && entry.run.messageID === m.id) return actions;
    if (m.role === 'user') actions.push(actionButton('pencil', t('editResend'), () => beginEdit(entry, index), busy));
    else actions.push(actionButton('refresh', t('regenerate'), () => regenerate(entry, index), busy));
    actions.push(actionButton('undo', t('rollBackHere'), () => askRollback(entry, index), busy));
    actions.push(actionButton('fork', t('forkHere'), () => forkFrom(entry, index), busy));
    return actions;
  }
  function userRow(entry, m, index) {
    const stack = h('div', { class: 'stack' });
    const atts = arr(m.attachments);
    if (atts.length) stack.append(attachmentStrip(entry, atts));
    const content = str(m.content);
    if (content !== '') {
      const created = dateOf(m.createdAt);
      const note = h('div', { class: 'note', dir: 'auto', title: created ? fmtNoteTip(created) : null, text: content });
      paperCard(note, uuidSeed(m.id), 14);
      note.__shape.svg.firstChild.style.fill = 'var(--peach)';
      stack.append(note);
    }
    if (str(m.error) !== '') stack.append(errorCallout(m.error, m));
    const actions = h('div', { class: 'actions' }, ...rowActions(entry, m, index));
    return h('div', { class: 'msg msg-user' }, actions, stack);
  }
  function assistantRow(entry, c, m, repeated, index) {
    const streaming = !!(entry.run && entry.run.messageID === m.id);
    const settings = obj(c.settings) || {};
    const row = h('div', { class: 'msg msg-assistant' });
    const created = dateOf(m.createdAt);
    const modelName = str(m.model) || t('assistant');
    const time = created ? fmtTime(created) : '';
    const headEl = h('div', { class: 'a-head', role: 'group', 'aria-label': t('assistantLabel', { model: str(m.model) || t('unknownModel'), time }) },
      lantern(16), h('span', { class: 'a-model', text: modelName }), h('span', { class: 'a-time', text: time }),
      h('div', { class: 'actions' }, ...rowActions(entry, m, index)));
    row.append(headEl);
    for (const round of arr(m.toolRounds)) {
      if (!obj(round)) continue;
      if (str(round.reasoning) !== '') row.append(disclosure(round.reasoning, num(round.reasoningDuration)));
      if (str(round.content) !== '') row.append(markdown(round.content));
      for (const call of arr(round.calls)) if (obj(call)) row.append(toolCallRow(call));
    }
    if (str(m.reasoning) !== '') row.append(disclosure(m.reasoning, num(m.reasoningDuration)));
    if (str(m.reactThought) !== '') row.append(disclosure(m.reactThought, null));
    const atts = arr(m.attachments);
    if (atts.length) row.append(attachmentStrip(entry, atts));
    if (str(m.content) !== '') row.append(markdown(m.content));
    // Nothing yet from the reply: the spinner, and what it is waiting for.
    if (streaming && str(m.content) === '' && str(m.reasoning) === '' && str(m.error) === '') {
      row.append(h('div', { class: 'reply-wait', role: 'status' }, spinner(), h('span', { text: entry.run.phase === 'compacting' ? t('summarizingEarlier') : t('replyWaiting') })));
    }
    const error = str(m.error);
    if (error === '') { const finish = finishNote(m, settings); if (finish) row.append(smallNote('scissors', finish)); }
    const off = thinkingOffText(m, repeated);
    if (off) row.append(smallNote('info', off[0], off[1]));
    for (const note of arr(m.toolNotes)) if (obj(note)) { const noteText = toolNoteText(note); if (noteText) row.append(smallNote('info', noteText, str(note.detail))); }
    if (error !== '') row.append(errorCallout(error, m));
    else if (m.isComplete === false && !streaming) row.append(h('div', { class: 'stopped', text: t('stoppedBeforeFinish') }));
    const footer = footerLine(m);
    if (footer) row.append(h('div', { class: 'footer-stats', text: footer }));
    return row;
  }


  // ===========================================================================================
  // Dialogs: link confirmation, previews, conversation settings, context, settings, questions.
  const linkDialog = document.getElementById('link-dialog');
  const imageDialog = document.getElementById('image-dialog');
  const textDialog = document.getElementById('text-dialog');
  const convDialog = document.getElementById('conv-dialog');
  const ctxDialog = document.getElementById('ctx-dialog');
  const settingsDialog = document.getElementById('settings-dialog');
  const askDialog = document.getElementById('ask-dialog');
  const allDialogs = [linkDialog, imageDialog, textDialog, convDialog, ctxDialog, settingsDialog, askDialog];
  for (const d of allDialogs) {
    // Clear the contents on close, so nothing from a conversation lingers in a hidden dialog.
    on(d, 'close', () => { clearDialog(d); if (d === linkDialog) gate.cancel(); if (d === ctxDialog) ctxState = null; });
    // A click on the backdrop (the dialog element itself, outside the sheet) closes it.
    on(d, 'click', ev => { if (ev.target === d) d.close(); });
  }
  /** Empties a dialog, including the per-image label (a file name from the conversation). */
  function clearDialog(d) {
    d.replaceChildren();
    if (d === imageDialog) d.setAttribute('aria-label', t('imagePreview'));
  }
  // 'close' fires later; Lock and Delete clear every dialog now.
  function closeDialogs() { gate.cancel(); for (const d of allDialogs) { if (d.open) d.close(); clearDialog(d); } }
  function showModal(d) { try { d.showModal(); } catch (_) { d.setAttribute('open', ''); } }

  const gate = MD.createLinkGate(
    url => { window.open(url, '_blank', 'noopener,noreferrer'); },
    link => showLinkSheet(link));
  function openLinkFrom(el) {
    const link = linkTargets.get(el);
    if (link) gate.requestOpen(link.url);
  }
  on(document, 'click', ev => {
    const el = ev.target instanceof Element ? ev.target.closest('.md-link') : null;
    if (el) { ev.preventDefault(); openLinkFrom(el); }
  });
  on(document, 'keydown', ev => {
    const el = ev.target instanceof Element && ev.target.classList.contains('md-link') ? ev.target : null;
    if (el && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); openLinkFrom(el); }
  });

  function showLinkSheet(link) {
    const host = link.host.length > 90 ? '…' + link.host.slice(-89) : link.host;
    const address = boardBlock(t('address'), link.address);
    address.pre.classList.add('address');
    const card = h('div', { class: 'notice-card' },
      h('div', { class: 'notice-head' }, h('span', { class: 'hand', 'aria-hidden': 'true' }, icon('hand')), h('h2', { id: 'link-title', text: t('linkTitle') })),
      h('p', { text: t('linkWarning') }),
      h('div', { class: 'site' }, h('span', { class: 'site-label', text: t('site') }), h('span', { class: 'site-host', text: host, title: link.host })),
      address.block);
    if (link.hasHiddenCharacters) card.append(h('div', { class: 'hidden-warn' }, icon('triangleFill'), h('span', { text: t('hiddenChars') })));
    const cancel = h('button', { type: 'button', class: 'sheet-btn soft', text: t('cancel'), autofocus: true });
    const open = h('button', { type: 'button', class: 'sheet-btn primary', text: t('open'), disabled: true });
    on(cancel, 'click', () => linkDialog.close());
    on(open, 'click', () => { gate.confirm(); linkDialog.close(); });
    // Disabled for 0.4 s, so the second click of a double-click cannot land on it.
    setTimeout(() => { open.disabled = false; }, 400);
    linkDialog.replaceChildren(h('div', { class: 'sheet link-sheet' }, card, h('div', { class: 'sheet-buttons' }, cancel, open)));
    showModal(linkDialog);
    cancel.focus();
    noteOverflow(address.block, address.pre, 200);
  }
  function closeButton(dialog) {
    const b = h('button', { type: 'button', class: 'sheet-btn soft sheet-close', text: t('close') });

    return b;
  }
  function showImage(url, filename) {

  }
  function showText(filename, text) {
    textDialog.replaceChildren(h('div', { class: 'sheet text-sheet' }, h('h2', { text: filename }), h('pre', { tabindex: '0', text }), closeButton(textDialog)));
    showModal(textDialog);
  }

  /** A question or a short form: fields are text or password; onConfirm returns an error text, or null to close. */
  function openAsk({ title, message, fields = [], confirmLabel, danger = false, onConfirm }) {
    const inputs = fields.map(f => {
      const input = h('input', { type: f.type || 'text', class: 'field-input', 'aria-label': f.label, autocomplete: f.type === 'password' ? 'new-password' : 'off', spellcheck: 'false', dir: f.dir || null });
      input.value = f.value || '';
      return input;
    });
    const error = h('div', { class: 'notice danger', role: 'alert', hidden: true });
    const cancel = h('button', { type: 'button', class: 'sheet-btn soft', text: t('cancel') });
    const ok = h('button', { type: 'button', class: 'sheet-btn ' + (danger ? 'danger' : 'primary'), text: confirmLabel });
    const go = async () => {
      if (ok.disabled) return;
      ok.disabled = true;
      let failure = null;
      try { failure = await onConfirm(inputs.map(i => i.value)); } catch (e) { failure = String((e && e.message) || e); }
      if (!askDialog.open || !ok.isConnected) return; // closed meanwhile (Lock, Delete)
      ok.disabled = false;
      if (failure) { error.replaceChildren(icon('xcircle'), h('span', { text: failure })); error.hidden = false; return; }
      for (const input of inputs) input.value = '';
      askDialog.close();
    };
    on(cancel, 'click', () => askDialog.close());
    on(ok, 'click', go);
    inputs.forEach(input => on(input, 'keydown', ev => { if (ev.key === 'Enter' && !ev.isComposing) { ev.preventDefault(); go(); } }));
    askDialog.replaceChildren(h('div', { class: 'sheet ask-sheet' },
      h('h2', { class: 'lettered', text: title }),
      message ? h('p', { class: 'ask-message', text: message }) : null,
      ...fields.map((f, i) => h('label', { class: 'field' }, h('span', { class: 'field-label', text: f.label }), inputs[i])),
      error, h('div', { class: 'sheet-buttons' }, cancel, ok)));
    showModal(askDialog);
    if (inputs[0]) { inputs[0].focus(); inputs[0].select(); } else cancel.focus();
  }

  // ---- conversation settings: server, model, system prompt, temperature, max tokens, reasoning effort
  function field(label, control, help) {
    return h('label', { class: 'field' }, h('span', { class: 'field-label', text: label }), control, help ? h('span', { class: 'ctx-help', text: help }) : null);
  }
  function openConversationSettings(entry) {
    const c = entry.conversation;
    if (!c) return;
    const settings = c.settings;
    const changed = delay => { touch(entry); scheduleSave(entry, delay === undefined ? 500 : delay); updateHeader(entry); updateStrip(entry); };

    const serverSelect = h('select', { class: 'field-input', 'aria-label': t('server') });
    const current = providerFor(settings);
    if (!providers.length) serverSelect.append(h('option', { value: '', text: t('noServersOption') }));
    for (const p of providers) serverSelect.append(h('option', { value: p.id, text: p.name }));
    if (current) serverSelect.value = current.id;
    serverSelect.disabled = !providers.length;
    on(serverSelect, 'change', () => {
      settings.providerID = serverSelect.value;
      changed(0);
      ensureModels(providerFor(settings));
      refreshModels();
    });

    const modelInput = h('input', { type: 'text', class: 'field-input', list: 'conv-models', placeholder: t('modelPlaceholder'), spellcheck: 'false', autocomplete: 'off', autocapitalize: 'off', 'aria-label': t('infoModel') });
    const modelList = h('datalist', { id: 'conv-models' });
    modelInput.value = str(settings.model);
    function refreshModels() {
      const provider = providerFor(settings);
      const cached = provider && modelCache.get(provider.id);
      modelList.replaceChildren(...(cached ? cached.models.map(m => h('option', { value: m.id })) : []));
      modelInput.placeholder = provider && str(provider.defaultModel).trim() ? str(provider.defaultModel).trim() : t('modelPlaceholder');
    }
    refreshModels();
    on(modelInput, 'change', () => { settings.model = modelInput.value.trim(); changed(); });

    const prompt = h('textarea', { class: 'field-input prompt-input', rows: '6', dir: 'auto', 'aria-label': t('systemPrompt') });
    prompt.value = str(settings.systemPrompt);
    on(prompt, 'input', () => { settings.systemPrompt = prompt.value; changed(); });

    const temperature = h('input', { type: 'text', inputmode: 'decimal', class: 'field-input narrow', placeholder: t('providerDefault'), autocomplete: 'off', 'aria-label': t('temperature') });
    temperature.value = num(settings.temperature) !== null ? String(settings.temperature) : '';
    on(temperature, 'input', () => {
      const text = temperature.value.trim().replace(',', '.');
      if (text === '') { delete settings.temperature; temperature.removeAttribute('aria-invalid'); changed(); return; }
      const v = Number(text);
      if (Number.isFinite(v) && v >= 0 && v <= 2) { settings.temperature = v; temperature.removeAttribute('aria-invalid'); changed(); } else temperature.setAttribute('aria-invalid', 'true');
    });
    const maxTokens = h('input', { type: 'text', inputmode: 'numeric', class: 'field-input narrow', placeholder: t('providerDefault'), autocomplete: 'off', 'aria-label': t('maxTokens') });
    maxTokens.value = posInt(settings.maxTokens) ? String(settings.maxTokens) : '';
    on(maxTokens, 'input', () => {
      if (maxTokens.value.trim() === '') { delete settings.maxTokens; maxTokens.removeAttribute('aria-invalid'); changed(); return; }
      const n = TokenFormat.parse(maxTokens.value);
      if (n !== null) { settings.maxTokens = n; maxTokens.removeAttribute('aria-invalid'); changed(); } else maxTokens.setAttribute('aria-invalid', 'true');
    });
    const effort = h('select', { class: 'field-input narrow', 'aria-label': t('reasoningEffort') });
    effort.append(h('option', { value: 'default', text: t('providerDefault') }), h('option', { value: 'none', text: t('effortNone') }),
      h('option', { value: 'low', text: t('effortLow') }), h('option', { value: 'medium', text: t('effortMedium') }), h('option', { value: 'high', text: t('effortHigh') }));
    effort.value = settings.disablesThinking === true ? 'none' : ['low', 'medium', 'high'].includes(settings.reasoningEffort) ? settings.reasoningEffort : 'default';
    on(effort, 'change', () => {
      delete settings.reasoningEffort; delete settings.disablesThinking;
      if (effort.value === 'none') settings.disablesThinking = true; else if (effort.value !== 'default') settings.reasoningEffort = effort.value;
      changed();
    });

    const buttons = h('div', { class: 'sheet-buttons' });
    if (entry.encrypted) {
      const lockBtn = h('button', { type: 'button', class: 'sheet-btn soft', text: t('lock') });
      on(lockBtn, 'click', () => { convDialog.close(); lockEntry(entry); });
      buttons.append(lockBtn);
    } else {
      const encryptBtn = h('button', { type: 'button', class: 'sheet-btn soft', text: t('encryptEllipsis') });
      on(encryptBtn, 'click', () => { convDialog.close(); askEncrypt(entry); });
      buttons.append(encryptBtn);
    }
    buttons.append(closeButton(convDialog));
    convDialog.replaceChildren(h('div', { class: 'sheet conv-sheet' },
      h('h2', { class: 'lettered', text: t('conversationSettings') }),
      field(t('server'), serverSelect, providers.length ? null : t('noServerYet')),
      field(t('infoModel'), h('span', { class: 'field-stack' }, modelInput, modelList)),
      field(t('systemPrompt'), prompt),
      h('div', { class: 'field-grid' }, field(t('temperature'), temperature), field(t('maxTokens'), maxTokens), field(t('reasoningEffort'), effort)),
      buttons));
