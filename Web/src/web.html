  // ---- Settings: servers, general, privacy
  const lookSelects = { skin: [], appearance: [] };
  function bindLookSelects(skinSelect, appearanceSelect) {
    skinSelect.replaceChildren(...SKINS.map(skin => h('option', { value: skin, text: SKIN_TITLES[skin] })));
    appearanceSelect.replaceChildren(...APPEARANCES.map(([value, label]) => h('option', { value, text: label })));
    skinSelect.value = look.skin;
    appearanceSelect.value = look.appearance;
    lookSelects.skin.push(skinSelect);
    lookSelects.appearance.push(appearanceSelect);
    on(skinSelect, 'change', () => { if (SKINS.includes(skinSelect.value)) { look.skin = skinSelect.value; saveLook(); applyLook(); syncLookSelects(); } });
    on(appearanceSelect, 'change', () => { look.appearance = appearanceSelect.value; saveLook(); applyLook(); syncLookSelects(); });
  }
  function syncLookSelects() {
    for (const sel of lookSelects.skin) sel.value = look.skin;
    for (const sel of lookSelects.appearance) sel.value = look.appearance;
  }

  function openSettings() {
    let editing = null; // {draft, isNew}
    const serversBox = h('div', { class: 'servers' });
    const kindLabel = kind => ({ auto: t('kindAuto'), lmStudio: t('kindLMStudio'), llamaCpp: t('kindLlamaCpp'), vLLM: t('kindVLLM'),
      ollama: t('kindOllama'), strata: t('kindStrata'), hosted: t('kindHosted') }[kind]);

    async function reloadProviders() {
      await loadProviders();
      for (const entry of entries) if (entry.view && entry.conversation) { updateHeader(entry); updateStrip(entry); }
      const open = entryOf(selectedKey);
      if (open && open.conversation) ensureModels(providerFor(open.conversation.settings));
      if (!open) renderRoom();
      renderServers();
    }

    function renderServers() {
      const rows = providers.map(p => {
        const row = h('button', { type: 'button', class: 'server-row' + (editing && editing.draft.id === p.id ? ' selected' : '') },
          h('span', { class: 'server-name', text: p.name }),
          h('span', { class: 'server-sub', text: p.baseURL }),
          p.id === (providerFor(null) && providerFor(null).id) ? h('span', { class: 'server-default', text: t('defaultServer') }) : null);
        on(row, 'click', () => { editing = { draft: { ...p }, isNew: false }; renderServers(); });
        return row;
      });
      const add = h('button', { type: 'button', class: 'sheet-btn soft', text: t('addServer') });
      on(add, 'click', () => {
        editing = { draft: { id: Ctx.newID(), name: '', baseURL: '', kind: 'auto', defaultModel: '', apiKey: '', rememberKey: false }, isNew: true };
        renderServers();
      });
      serversBox.replaceChildren(
        providers.length ? h('div', { class: 'server-list' }, ...rows) : h('p', { class: 'ctx-help', text: t('noServerYet') }),
        h('div', { class: 'sheet-buttons start' }, add),
        editing ? serverForm(editing) : null);
    }

    function serverForm({ draft, isNew }) {
      const name = h('input', { type: 'text', class: 'field-input', autocomplete: 'off', 'aria-label': t('serverName') });
      name.value = draft.name;
      const url = h('input', { type: 'text', class: 'field-input', placeholder: 'http://192.168.1.20:1234/v1', autocomplete: 'off', spellcheck: 'false', autocapitalize: 'off', dir: 'ltr', 'aria-label': t('baseURL') });
      url.value = draft.baseURL;
      const kind = h('select', { class: 'field-input', 'aria-label': t('serverKind') }, ...SERVER_KINDS.map(k => h('option', { value: k, text: kindLabel(k) })));
      kind.value = SERVER_KINDS.includes(draft.kind) ? draft.kind : 'auto';
      const key = h('input', { type: 'password', class: 'field-input', autocomplete: 'off', spellcheck: 'false', placeholder: t('apiKeyPlaceholder'), 'aria-label': t('apiKey') });
      key.value = str(draft.apiKey);
      const remember = h('input', { type: 'checkbox', id: 'server-remember' });
      remember.checked = draft.rememberKey === true;
      const rememberWarn = h('div', { class: 'ctx-help warn-text', text: t('rememberWarning'), hidden: !remember.checked });
      on(remember, 'change', () => { rememberWarn.hidden = !remember.checked; });
      const model = h('input', { type: 'text', class: 'field-input', list: 'server-models', placeholder: t('optional'), spellcheck: 'false', autocomplete: 'off', autocapitalize: 'off', 'aria-label': t('defaultModel') });
      model.value = str(draft.defaultModel);
      const modelList = h('datalist', { id: 'server-models' });
      const makeDefault = h('input', { type: 'checkbox', id: 'server-default' });
      makeDefault.checked = isNew ? !providers.length : (providerFor(null) && providerFor(null).id === draft.id);
      const status = h('div', { class: 'ctx-help', role: 'status' });
      const showStatus = (text, bad) => { status.textContent = text; status.className = 'ctx-help' + (bad ? ' danger-text' : ''); };

      const collect = () => ({
        ...draft, name: name.value.trim(), baseURL: url.value.trim(), kind: kind.value, defaultModel: model.value.trim(),
        apiKey: key.value.trim(), rememberKey: remember.checked,
      });
      const test = h('button', { type: 'button', class: 'sheet-btn soft', text: t('test') });
      on(test, 'click', async () => {
        const p = collect();
        try { Chat.chatURL(p.baseURL); } catch (e) { showStatus(t('baseURLInvalid'), true); return; }
        test.disabled = true;
        showStatus(t('testing'), false);
        try {
          const models = await Chat.listModels({ baseURL: p.baseURL, apiKey: p.apiKey });
          modelList.replaceChildren(...models.map(m => h('option', { value: m.id })));
          showStatus(models.length === 1 ? t('testOkOne') : t('testOk', { n: models.length }), false);
        } catch (e) {
          showStatus(failureText(e), true);
        }
        test.disabled = false;
      });
      const save = h('button', { type: 'button', class: 'sheet-btn primary', text: t('save') });
      on(save, 'click', async () => {
        const p = collect();
        if (!p.name) p.name = (() => { try { return new URL(p.baseURL).host; } catch (_) { return t('server'); } })();
        try { Chat.chatURL(p.baseURL); } catch (e) { showStatus(t('baseURLInvalid'), true); return; }
        try {
          await store.providers.put(p);
          if (makeDefault.checked || (!prefs.defaultProviderID && !providers.length)) { prefs.defaultProviderID = p.id; savePrefs(); }
          else if (!makeDefault.checked && prefs.defaultProviderID === p.id) { prefs.defaultProviderID = null; savePrefs(); }
        } catch (e) { showStatus(String((e && e.message) || e), true); return; }
        modelCache.delete(p.id);
        editing = null;
        await reloadProviders();
      });
      const buttons = h('div', { class: 'sheet-buttons' });
      if (!isNew) {
        const del = h('button', { type: 'button', class: 'sheet-btn danger', text: t('delete') });
        on(del, 'click', () => openAsk({
          title: t('deleteServerTitle'), message: t('deleteServerMessage', { name: draft.name }), confirmLabel: t('delete'), danger: true,
          onConfirm: async () => {
            try { await store.providers.remove(draft.id); } catch (e) { return String((e && e.message) || e); }
            if (prefs.defaultProviderID === draft.id) { prefs.defaultProviderID = null; savePrefs(); }
            modelCache.delete(draft.id);
            editing = null;
            await reloadProviders();
            return null;
          },
        }));
        buttons.append(del);
      }
      const cancel = h('button', { type: 'button', class: 'sheet-btn soft', text: t('cancel') });
      on(cancel, 'click', () => { editing = null; renderServers(); });
      buttons.append(cancel, save);
      return h('div', { class: 'server-form' },
        field(t('serverName'), name), field(t('baseURL'), url, t('baseURLHelp')), field(t('serverKind'), kind, t('serverKindHelp')),
        field(t('apiKey'), key),
        h('label', { class: 'check-row', for: 'server-remember' }, remember, h('span', { text: t('rememberKey') })), rememberWarn,
        field(t('defaultModel'), h('span', { class: 'field-stack' }, model, modelList)),
        h('label', { class: 'check-row', for: 'server-default' }, makeDefault, h('span', { text: t('useAsDefault') })),
        h('div', { class: 'ctx-row' }, test, status), buttons);
    }

    // General: skin, appearance, automatic compaction
    const skinSelect = h('select', { class: 'field-input narrow', 'aria-label': t('skin') });
    const appearanceSelect = h('select', { class: 'field-input narrow', 'aria-label': t('appearance') });
    bindLookSelects(skinSelect, appearanceSelect);
    const autoBox = h('input', { type: 'checkbox', id: 'set-auto' });
    autoBox.checked = prefs.autoCompact;
    const threshold = h('input', { type: 'text', inputmode: 'numeric', class: 'field-input narrow', autocomplete: 'off', 'aria-label': t('thresholdLabel'), placeholder: String(Ctx.DEFAULT_THRESHOLD_PERCENT) });
    threshold.value = String(prefs.threshold);
    const thresholdWarn = h('span', { class: 'warn-text', text: t('thresholdRange'), title: t('thresholdRangeTip'), hidden: true });
    const syncCompaction = () => { threshold.disabled = !autoBox.checked; thresholdWarn.hidden = parseThreshold(threshold.value) !== null; };
    on(autoBox, 'change', () => { prefs.autoCompact = autoBox.checked; savePrefs(); syncCompaction(); ctxDialogUpdate(); });
    on(threshold, 'input', () => { const n = parseThreshold(threshold.value); if (n !== null) { prefs.threshold = n; savePrefs(); } syncCompaction(); ctxDialogUpdate(); });
    on(threshold, 'blur', () => { threshold.value = String(prefs.threshold); syncCompaction(); });
    syncCompaction();

    const storageText = storage.kind === 'memory' ? t('storageMemory') : storage.persisted === true ? t('storagePersistent') : t('storageBestEffort');
    settingsDialog.replaceChildren(h('div', { class: 'sheet settings-sheet' },
      h('h2', { class: 'lettered', text: t('settings') }),
      h('h3', { class: 'lettered', text: t('servers') }),
      serversBox,
      h('h3', { class: 'lettered', text: t('general') }),
      h('div', { class: 'field-grid' }, field(t('skin'), skinSelect), field(t('appearance'), appearanceSelect)),
      h('label', { class: 'check-row', for: 'set-auto' }, autoBox, h('span', { text: t('compactAutomatically') })),
      h('div', { class: 'ctx-row threshold-row' }, h('span', { text: t('whenContextIs') }), threshold, h('span', { text: '% ' + t('full') }), thresholdWarn),
      h('h3', { class: 'lettered', text: t('privacy') }),
      h('ul', { class: 'privacy-list' },
        h('li', { text: t('privacyServers') }), h('li', { text: t('privacyBrowser') }), h('li', { text: t('privacyEncrypt') }), h('li', { text: t('privacyOrigin') }),
        h('li', { text: storageText })),
      closeButton(settingsDialog)));
    // The selects made for this dialog leave the list when it closes.
    on(settingsDialog, 'close', () => { lookSelects.skin = lookSelects.skin.filter(sel => sel.isConnected); lookSelects.appearance = lookSelects.appearance.filter(sel => sel.isConnected); }, { once: true });
    renderServers();
    showModal(settingsDialog);
  }

  // ===========================================================================================
  // Files in: the import button and the drop target. Pictures and text files dropped on a chat attach to it.
  on(importInput, 'change', () => { const files = importInput.files; importFiles(files).finally(() => { importInput.value = ''; }); });
  on(attachInput, 'change', () => {
    const entry = entryOf(selectedKey);
    const files = attachInput.files;
    (entry ? addDraftFiles(entry, files) : Promise.resolve()).finally(() => { attachInput.value = ''; });
  });
  const drop = document.getElementById('drop');
  addShape(document.getElementById('drop-card'), [{ seed: 9, radius: 18, amplitude: 1.4, cls: 'fill' }, { seed: 9, radius: 13, amplitude: 0.8, inset: 5, cls: 'stitch' }], 'shadow-paper');
  let dragDepth = 0;
  const hasFiles = ev => !!(ev.dataTransfer && Array.from(ev.dataTransfer.types || []).includes('Files'));
  // Always prevent the default, so a drop that misses never navigates the tab to the file.
  on(window, 'dragenter', ev => { ev.preventDefault(); if (hasFiles(ev)) { dragDepth++; drop.hidden = false; } });
  on(window, 'dragover', ev => { ev.preventDefault(); if (ev.dataTransfer) ev.dataTransfer.dropEffect = hasFiles(ev) ? 'copy' : 'none'; });
  on(window, 'dragleave', ev => { ev.preventDefault(); dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) drop.hidden = true; });
  on(window, 'drop', ev => {
    ev.preventDefault();
    dragDepth = 0; drop.hidden = true;
    const files = ev.dataTransfer && ev.dataTransfer.files;
    if (!files || !files.length) return;
    const entry = entryOf(selectedKey);
    const overWall = ev.target instanceof Element && ev.target.closest('#wall');
    if (entry && entry.conversation && entry.view && !overWall) addDraftFiles(entry, files); else importFiles(files);
  });

  // Wall buttons and look controls.
  const wallNew = document.getElementById('wall-new');
  wallNew.append(icon('plus'));
  on(wallNew, 'click', newChat);
  const wallOpen = document.getElementById('wall-open');
  wallOpen.append(icon('folder'));
  on(wallOpen, 'click', () => importInput.click());
  const wallSettings = document.getElementById('wall-settings');
  wallSettings.append(icon('gear'));
  on(wallSettings, 'click', () => openSettings());
  const wallHide = document.getElementById('wall-hide');
  wallHide.append(icon('sidebar'));
  on(wallHide, 'click', hideWall);
  document.getElementById('search-icon').append(icon('search'));
  searchClear.append(icon('xcircle'));
  const searchBox = document.getElementById('search');
  addShape(searchBox, [{ seed: 3, radius: 9, amplitude: 1.4 }], 'shadow-paper');
  searchBox.__shape.svg.firstChild.style.fill = 'var(--tag)';
  bindLookSelects(document.getElementById('skin-select'), document.getElementById('appearance-select'));

  on(document, 'keydown', ev => {
    if (ev.defaultPrevented) return;
    if (ev.key === 'Escape' && !ev.isComposing) {
      if (document.querySelector('dialog[open]') || menuEl) return;
      if (narrow.matches && app.classList.contains('wall-open')) { closeOverlayWall(); return; }
      const entry = entryOf(selectedKey);
      if (entry && entry.run) { ev.preventDefault(); stopEntry(entry); } else if (entry && entry.draft.editID) { ev.preventDefault(); cancelEdit(entry); }
    }
    if ((ev.metaKey || ev.ctrlKey) && !ev.shiftKey && !ev.altKey && ev.key.toLowerCase() === 'o') { ev.preventDefault(); importInput.click(); }
  });
  // Pending saves go out when the page is hidden or closed.
  on(document, 'visibilitychange', () => { if (document.visibilityState === 'hidden') flushSaves(); });
  on(window, 'pagehide', flushSaves);
  on(document, 'freeze', flushSaves);
  // A reply that is still streaming is only saved up to the last couple of seconds: ask before leaving.
  on(window, 'beforeunload', ev => { if (entries.some(e => e.run)) { ev.preventDefault(); ev.returnValue = ''; } });

  // Another tab saved or removed a conversation: refresh the list, and reload an open one that is not streaming.
  function onStoreChange(change) {
    refreshList().then(() => {
      const entry = entryOf(change.id);
      if (entry && change.type === 'saved' && entry.loaded && !entry.run) reloadEntry(entry);
    });
  }

  // ===========================================================================================
  // Start: look, storage (IndexedDB, or memory with a banner when the browser refuses), settings, list.
  async function boot() {
    applyLook();
    renderList();
    renderRoom();
    let factory = null;
    try { factory = window.indexedDB; } catch (_) { factory = null; } // some browsers refuse even to look (private windows, file pages)
    const probe = await Store.probe(factory);
    if (probe.ok) {
      store = probe.store;
      storage = { kind: 'browser', persisted: null };
      store.requestPersistence().then(result => { storage.persisted = result.granted; });
    } else {
      store = Store.memory();
      storage = { kind: 'memory', persisted: false };
      showBanner();
    }
    await Promise.all([loadPrefs(), loadProviders()]);
    store.onChange(onStoreChange);
    await refreshList();
    renderRoom();
  }
  boot().catch(e => { toast(t('storageError'), String((e && e.message) || e)); });
})();
</script>
</body>
</html>
