<!doctype html>
<!--
  Parley Web page template (Web/SPEC.md). tools/build_web.sh turns it into Web/ParleyWeb.html by
  filling the script placeholders below (art, core.js, markdown.js, chat.js, context.js, store.js).
  It is a fork of the Reader page: the same look and the same rendering code, with stored
  conversations and a chat client instead of "open files to view". Everything the page shows from
  a conversation is built with createElement and textContent. The only code that touches the
  network is ParleyChat (chat.js), which talks to the servers the user adds and to nothing else;
  this page's own script never calls fetch or any other network API.
-->
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src http: https:; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="google" content="notranslate">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Parley Web</title>
<style>
:root {
  --rounded: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
  --system: system-ui, -apple-system, "Helvetica Neue", "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --lettered: "Noteworthy", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --wall-w: 268px;
  /* Fallback colours until the script applies the chosen skin (cardboard, light). */
  --paper: #FBF1DF; --paperDeep: #F4E3C6; --card: #FFF8EA; --ink: #3A2416; --inkSoft: #6E4F39;
  --wall: #D8B07A; --wallDeep: #C4955C; --wallInk: #2E1B0F; --stitch: #C4955C; --ember: #C24A20;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  font: 13px/1.25 var(--rounded);
  overflow: hidden; -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.lettered { font-family: var(--lettered); font-weight: 700; }
/* Noteworthy has no Chinese: in Chinese the hand lettering is the rounded bold system font, as in the app. */
:root:lang(zh) { --lettered: var(--rounded); }

/* ---- shapes: an SVG behind the content, redrawn on resize */
.has-shape { position: relative; isolation: isolate; }
.shape { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; z-index: -1; pointer-events: none; }
.shadow-paper { filter: drop-shadow(0 1.5px 3px rgba(0,0,0,.10)); }
.shadow-code { filter: drop-shadow(0 1.5px 3px rgba(0,0,0,.14)); }
.shadow-pic { filter: drop-shadow(0 4px 8px rgba(0,0,0,.22)); }
.shadow-row { filter: drop-shadow(0 1.5px 2.5px rgba(0,0,0,.18)); }
.shadow-btn { filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.12)); }
.washi { position: absolute; pointer-events: none; overflow: visible; }
.icon { width: 1em; height: 1em; flex: none; overflow: visible; vertical-align: -0.125em; }

/* ---- layout */
.app { display: grid; grid-template-columns: var(--wall-w) minmax(0, 1fr); flex: 1 1 auto; min-height: 0; }
.app.wall-hidden { grid-template-columns: 0 minmax(0, 1fr); }
.app.wall-hidden .wall { display: none; }
.scrim { display: none; }

/* ---- the wall (sidebar) */
.wall {
  position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0;
  color: var(--wallInk); isolation: isolate;
  background: linear-gradient(to bottom, var(--wall), var(--wall-bottom)), var(--paper); /* over the window's paper, like the app */
  border-right: 1px solid var(--wallDeep);
}
.wall::before, .wall::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: -1; }
.wall::before { background: repeating-linear-gradient(90deg, transparent 0 2.5px, var(--corrugation) 2.5px 3.5px, transparent 3.5px 7px); }
.wall::after { background-image: var(--grain-wall); background-size: 96px 96px; opacity: var(--grain-wall-opacity); }
.seam { position: absolute; top: 0; bottom: 0; right: -5px; width: 9px; cursor: col-resize; z-index: 3; touch-action: none; }
.wall-top { position: relative; height: 76px; flex: none; }
.bunting { position: absolute; left: 0; right: 0; top: 34px; height: 40px; width: 100%; pointer-events: none; }
.wall-buttons { position: absolute; top: 5px; right: 10px; display: flex; gap: 6px; }
.round-btn {
  width: 30px; height: 30px; border-radius: 50%; border: 0; padding: 0; flex: none;
  display: inline-grid; place-items: center; font-size: 14px;
  background: var(--paperDeep); color: var(--inkSoft); transition: background .12s;
}
.round-btn:hover { background: var(--emberWash); }
.round-btn:active { opacity: .7; }
.wall .round-btn { width: 28px; height: 28px; color: var(--wallInk); background: rgb(var(--tag-rgb) / .45); }
.wall .round-btn:hover { background: rgb(var(--tag-rgb) / .75); }
.wordmark { padding: 0 16px; margin: 8px 0 0; font-size: 30px; line-height: normal; color: var(--wallInk); }
.search { margin: 8px 12px 8px; padding: 7px 10px; display: flex; align-items: center; gap: 6px; color: var(--inkSoft); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; color: var(--ink); font-size: 13px; padding: 0; }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
.search input { -webkit-appearance: none; appearance: none; }
.search input::placeholder { color: var(--inkSoft); opacity: 1; }
.search:focus-within .shape path { stroke: var(--ember); stroke-width: 1.5px; }
.clear-btn { border: 0; background: none; padding: 0; color: var(--inkSoft); display: inline-grid; place-items: center; font-size: 13px; }
.list { flex: 1; min-height: 0; overflow-y: auto; padding: 0 0 12px; scrollbar-width: thin; }
.group-title { font-family: var(--lettered); font-weight: 700; font-size: 15px; color: var(--wallInkSoft); padding: 10px 14px 2px; margin: 0; }
.rows { list-style: none; margin: 0; padding: 0; }
/* The list insets (2px, 8px) plus the inset of the app's sidebar List style: row text lands at x = 34. */
.row { position: relative; margin: 2px 23px 2px 24px; display: flex; align-items: center; }
.row-main {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; text-align: left;
  padding: 7px 10px; border: 0; background: none; color: var(--wallInk); border-radius: 8px;
}
.row-main:focus-visible { outline: none; }
.row-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row-title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-sub { font-size: 11px; color: var(--wallInkSoft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.locked .row-title { color: var(--wallInkSoft); }
.row-lock { font-size: 11px; color: var(--wallInkSoft); flex: none; display: inline-grid; }
.row .shape path { fill: var(--tag); fill-opacity: 0; stroke: var(--ember); stroke-opacity: 0; stroke-width: 1.5px; }
.row:hover .shape path { fill-opacity: .35; }
.row.selected .shape path { fill-opacity: 1; }
.row:has(.row-main:focus-visible) .shape path { stroke-opacity: 1; }
.row.selected .row-main { color: var(--ink); }
.row.selected .row-title { font-weight: 600; color: var(--ink); }
.row.selected .row-sub { color: var(--inkSoft); }
.row.selected .row-lock { color: var(--brass); }
.row.selected.locked .row-title { font-weight: 500; color: var(--inkSoft); }
.row .washi { display: none; right: -6px; top: -3px; }
.row.selected .washi { display: block; }
.row .shape { filter: none; }
.row.selected .shape { filter: drop-shadow(0 1.5px 2.5px rgba(0,0,0,.18)); }
.row-remove {
  position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
  width: 20px; height: 20px; border-radius: 50%; border: 0; padding: 0; display: grid; place-items: center;
  background: var(--paperDeep); color: var(--inkSoft); font-size: 10px; opacity: 0; transition: opacity .12s;
}
.row:hover .row-remove, .row:focus-within .row-remove { opacity: 1; }
/* The viewer-only remove button gets its own room, so the padlock always stays visible. */
.row:hover .row-main, .row:focus-within .row-main { padding-right: 30px; }
@media (hover: none) { .row-remove { opacity: .8; } .row-main { padding-right: 30px; } }
.search input:focus-visible, .pw-field input:focus-visible { outline: none; } /* the shape's ember edge shows focus */
.wall-empty { padding: 30px 16px; text-align: center; color: var(--wallInk); }
.wall-empty .lettered { font-size: 20px; margin-bottom: 6px; }
.wall-empty p { margin: 0; font-size: 12px; color: var(--wallInkSoft); }
.wall-foot { flex: none; display: flex; gap: 8px; align-items: center; padding: 8px 12px 10px; border-top: 1px solid rgb(var(--wallInk-rgb) / .12); font-size: 11px; color: var(--wallInkSoft); flex-wrap: wrap; }
.wall-foot label { display: flex; align-items: center; gap: 4px; }
.wall-foot select { font-size: 11px; color: var(--ink); background: rgb(var(--tag-rgb) / .7); border: 1px solid rgb(var(--wallInk-rgb) / .25); border-radius: 6px; padding: 2px 4px; }
.menu {
  position: fixed; z-index: 60; min-width: 160px; padding: 4px; background: var(--card); color: var(--ink);
  border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.18);
}
.menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 6px 10px; border-radius: 5px; font-size: 13px; }
.menu button:hover, .menu button:focus-visible { background: var(--emberWash); outline: none; }

/* ---- the room (detail) */
.room { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; isolation: isolate; }
.room::before, .room::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: -1; }
.room::before { background: var(--room-glow); }
.room::after { background-image: var(--grain-room); background-size: 96px 96px; opacity: var(--grain-room-opacity); }
.room-header { position: relative; height: 54px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 18px; }
.room-header::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 1.25px;
  background: repeating-linear-gradient(90deg, var(--stitch) 0 6px, transparent 6px 11px);
}
.header-titles { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.header-title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.header-sub { font-size: 11px; color: var(--inkSoft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.room-body { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
.scroller { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; }
.parcel { position: relative; display: inline-flex; align-items: center; gap: 5px; padding: 5px 8px 5px 22px; font-size: 13px; color: var(--ink); max-width: 260px; flex: none; }
.parcel .icon { color: var(--inkSoft); }
.parcel-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
.parcel .shape path.tag { fill: var(--tag); stroke: var(--line); stroke-width: 1px; }
.parcel .shape circle { fill: var(--paper); stroke: var(--line); stroke-width: 1px; }
.parcel .shape path.string { fill: none; stroke: var(--stitch); stroke-width: 1.25px; stroke-linecap: round; }
.parcel .shape { filter: drop-shadow(0 1px 2px rgba(0,0,0,.12)); }

/* centred screens: empty state, unlock */
.centred { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; padding: 40px; }
.centred .lettered.big { font-size: 30px; line-height: 1.15; margin: 0; }
.centred p { margin: 0; color: var(--inkSoft); max-width: 460px; }
/* the empty detail: top-aligned scroll content, like the app's EmptyDetailView */
.empty-detail { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding: 40px; }
.empty-detail .lettered.big { font-size: 30px; line-height: 1.15; margin: 0; }
.empty-detail p { margin: 0; color: var(--inkSoft); max-width: 460px; }
.empty-detail .taped { margin-bottom: 12px; }
.taped { position: relative; padding: 9px; max-width: 100%; }
.taped img, .taped .art-missing { display: block; width: 100%; height: auto; border-radius: 6px; object-fit: cover; background: var(--paperDeep); }
.taped .washi { left: 50%; top: -10px; }
.privacy { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--inkSoft); margin-top: 18px; max-width: 460px; text-align: left; }
.privacy .icon { color: var(--brass); font-size: 11px; }
.tag-btn {
  position: relative; isolation: isolate; border: 0; background: none; padding: 6px 14px;
  font: 600 13px/1.25 var(--rounded); color: var(--onEmber); transition: transform .08s;
}
.tag-btn .shape path { fill: var(--ember); }
.tag-btn:active { transform: scale(.98); }
.tag-btn:active .shape { filter: brightness(.95); }
.tag-btn.soft { color: var(--ink); }
.tag-btn.soft .shape path { fill: var(--paperDeep); stroke: rgb(var(--inkFaint-rgb) / .55); stroke-width: 1px; }
.tag-btn:disabled { color: var(--inkSoft); cursor: default; transform: none; }
.tag-btn:disabled .shape { filter: none; }
.tag-btn:disabled .shape path { fill: var(--paperDeep); stroke: rgb(var(--inkFaint-rgb) / .55); stroke-width: 1px; stroke-dasharray: 3 3; }
.pw-row { display: flex; gap: 10px; align-items: center; margin-top: 4px; flex-wrap: wrap; justify-content: center; }
.pw-field { width: 260px; max-width: 100%; padding: 7px 10px; display: flex; }
.pw-field input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 13px; color: var(--ink); padding: 0; }
.pw-field input::placeholder { color: var(--inkSoft); opacity: 1; }
.pw-field .shape path { fill: var(--tag); stroke: var(--line); stroke-width: 1px; }
.pw-field:focus-within .shape path { stroke: var(--ember); stroke-width: 1.5px; }
.pw-field.shake { animation: shake .4s linear; }
@keyframes shake { 0%,100% { transform: translateX(0); } 12.5% { transform: translateX(8px); } 37.5% { transform: translateX(-8px); } 62.5% { transform: translateX(8px); } 87.5% { transform: translateX(-8px); } }
.status-slot { min-height: 20px; max-width: 420px; display: flex; align-items: center; justify-content: center; }
.spinner-line { display: inline-flex; align-items: center; gap: 8px; color: var(--inkSoft); font-size: 12px; }
.spinner { width: 14px; height: 14px; animation: spin 1.2s linear infinite; color: var(--emberText); }
@keyframes spin { to { transform: rotate(360deg); } }
.notice { display: inline-flex; align-items: flex-start; gap: 6px; padding: 7px 10px; border-radius: 8px; border: 1.5px solid; font-size: 12px; font-weight: 500; text-align: left; }
.notice.danger { color: var(--danger); background: var(--dangerWash); border-color: var(--danger); }
.notice .icon { margin-top: 1px; }
.unlock-meta { display: flex; flex-direction: column; gap: 5px; align-items: center; }
.unlock-meta .where { font-size: 10px; color: var(--inkSoft); max-width: 420px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.unlock-meta .warn { font-size: 12px; font-weight: 500; color: var(--ink); }

/* ---- conversation */
.column { max-width: 740px; margin: 0 auto; padding: 16px 0 8px; }
.msg { padding: 9px 20px; content-visibility: auto; contain-intrinsic-size: auto 90px; }
.msg-user { display: flex; justify-content: flex-end; align-items: flex-start; gap: 8px; padding-left: 80px; }
.msg-user .stack { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; min-width: 0; max-width: 100%; }
.note { padding: 9px 14px; font: 13px/18px var(--system); color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
.note .shape path { fill: var(--peach); }
.msg-assistant { display: flex; flex-direction: column; align-items: stretch; gap: 6px; }
.msg-assistant > * { max-width: 100%; }
.a-head { position: relative; display: flex; align-items: center; gap: 5px; min-height: 24px; }
.a-model { font-size: 10px; font-weight: 500; color: var(--inkSoft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.a-time { font-size: 10px; color: var(--inkFaint); white-space: nowrap; }
.actions { display: flex; gap: 4px; opacity: 0; transition: opacity .12s; }
.msg:hover .actions, .actions:focus-within { opacity: 1; }
@media (hover: none) { .actions { opacity: .85; } }
.a-head .actions { position: absolute; right: 0; top: 0; }
.msg-user .actions { padding-top: 2px; flex: none; }
.paper-btn {
  width: 24px; height: 24px; border-radius: 50%; padding: 0; display: grid; place-items: center;
  background: var(--card); color: var(--inkSoft); border: 1px solid var(--line); font-size: 11px;
  box-shadow: 0 1px 1.5px rgba(0,0,0,.10);
}
.paper-btn:hover { background: var(--paperDeep); color: var(--ink); }
.forked { font-size: 10px; color: var(--inkFaint); padding: 0 20px 4px; }
.compacted { padding: 6px 20px 10px; border-top: 1px dashed var(--inkFaint); margin: 4px 20px 8px; }
.small-note { display: flex; gap: 5px; align-items: flex-start; font-size: 10px; line-height: 13px; color: var(--inkSoft); }
.small-note .icon { margin-top: 1px; }
.footer-stats { font-size: 10px; color: var(--inkFaint); font-variant-numeric: tabular-nums; }
.stopped { display: flex; gap: 8px; align-items: center; font-size: 10px; color: var(--inkSoft); }
.row-failed { font-size: 11px; color: var(--inkSoft); font-style: italic; }

/* thinking disclosure */
.disclosure-btn { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 1px 0; font-size: 12px; color: var(--inkSoft); text-align: left; align-self: flex-start; }
.chev { font-size: 10px; transition: transform .15s ease-in-out; }
[aria-expanded="true"] > .chev { transform: rotate(90deg); }
.thinking-body {
  margin: 6px 0 0 5px; padding-left: 14px; font: 12px/17px var(--mono); color: var(--inkSoft); white-space: pre-wrap; overflow-wrap: anywhere;
  background: radial-gradient(circle, var(--stitch) 1px, transparent 1.2px) left 0 top 2px / 2px 5.6px repeat-y;
}

/* tool calls */
.tool { display: flex; flex-direction: column; align-items: flex-start; }
.slip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; border: 0; background: none; padding: 6px 11px 6px 15px; font-size: 12px; color: var(--ink); text-align: left; }
.slip .shape path { fill: var(--card); }
.slip::before { content: ""; position: absolute; left: 7.4px; top: 6px; bottom: 6px; width: 1.25px; background: repeating-linear-gradient(to bottom, var(--stitch) 0 3px, transparent 3px 7px); }
.slip .chev, .slip .wrench { color: var(--inkSoft); }
.slip-title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.slip-dot { color: var(--inkFaint); }
.slip-status { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.slip-time { color: var(--inkFaint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tool-body { position: relative; margin: 6px 0 0 7px; padding-left: 13px; display: flex; flex-direction: column; gap: 8px; width: calc(100% - 7px); }
.tool-body::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 1.25px; background: repeating-linear-gradient(to bottom, var(--stitch) 0 3px, transparent 3px 7px); }
.board-block { background: var(--board); color: var(--boardInk); border-radius: 9px; padding: 7px 12px 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.board-head { display: flex; align-items: center; gap: 6px; }
.board-title { font-size: 10px; font-weight: 500; color: var(--boardInkSoft); flex: 1; }
.board-copy { width: 18px; height: 18px; border: 0; background: none; padding: 0; color: var(--boardInkSoft); font-size: 10px; display: grid; place-items: center; }
.board-text { margin: 0; font: 12px/17px var(--mono); color: var(--boardInk); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 240px; overflow-y: auto; color-scheme: dark; user-select: text; }
.board-more { font-size: 10px; color: var(--boardInkSoft); }
.tool-lines { display: flex; flex-direction: column; gap: 2px; font-size: 10px; color: var(--inkSoft); }

/* attachments */
.strip { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
.msg-user .strip { justify-content: flex-end; }
.thumb { width: 120px; height: 120px; padding: 7px; border: 0; background: none; flex: none; }
.thumb .shape path { fill: var(--card); }
.thumb img, .thumb .no-image { width: 106px; height: 106px; display: grid; place-items: center; object-fit: cover; border-radius: 4px; background: var(--paperDeep); color: var(--inkSoft); font-size: 22px; }
.thumb .washi { left: 50%; top: -6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 0; background: none; font-size: 12px; color: var(--ink); }
.chip .shape path { fill: var(--card); }
.chip .icon { color: var(--emberText); }
.chip span { white-space: nowrap; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }

/* markdown */
.md { display: flex; flex-direction: column; gap: 8px; font: 13px/19px var(--system); color: var(--ink); width: 100%; min-width: 0; user-select: text; }
.md-p, .md-li-text, .md-quote { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
.md-h { font-family: var(--rounded); font-weight: 600; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.md-h1 { font-size: 17px; line-height: 22px; padding-top: 6px; }
.md-h2 { font-size: 15px; line-height: 20px; padding-top: 6px; }
.md-h3 { font-size: 13px; line-height: 16px; padding-top: 3px; }
.md-list { display: flex; flex-direction: column; gap: 4px; }
.md-li { display: flex; align-items: baseline; gap: 6px; }
.md-marker { color: var(--emberText); min-width: 14px; text-align: right; flex: none; font-variant-numeric: tabular-nums; }
.md-li-text { min-width: 0; flex: 1; }
.md-quote { position: relative; color: var(--inkSoft); padding-left: 12px; }
.md-quote::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; border-radius: 1.5px; background: var(--stitch); }
.md-rule { height: 1.25px; margin: 6px 0; background: repeating-linear-gradient(90deg, var(--stitch) 0 6px, transparent 6px 11px); }
.i-em { font-style: italic; }
.i-strong { font-weight: 700; }
.i-strike { text-decoration: line-through; }
.i-code { font-family: var(--mono); font-size: 12px; background: var(--paperDeep); padding: 0 1px; }
.md-link { color: var(--emberText); cursor: pointer; border-radius: 2px; }
.md-link:hover { text-decoration: underline; text-decoration-thickness: 1px; }
.code-card { color: var(--boardInk); min-width: 0; }
.code-card .shape path { fill: var(--board); }
.code-head { display: flex; align-items: center; padding: 6px 6px 0 12px; }
.code-lang { flex: 1; font: 500 10px/1.3 var(--mono); color: var(--boardInkSoft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.code-copy { width: 20px; height: 18px; border: 0; background: none; padding: 0; color: var(--boardInkSoft); font-size: 10px; display: grid; place-items: center; }
.code-body { margin: 0; padding: 2px 12px 12px; font: 12px/17px var(--mono); color: var(--boardInk); white-space: pre; overflow-x: auto; scrollbar-width: none; tab-size: 4; user-select: text; }
.code-body::-webkit-scrollbar { display: none; }

/* error callout */
.callout { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 12px; border: 1.5px solid var(--danger); background: var(--dangerWash); width: 100%; text-align: left; }
.callout > .icon { color: var(--danger); font-size: 14px; margin-top: 1px; }
.callout-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
.callout-title { font-size: 12px; font-weight: 500; color: var(--ink); overflow-wrap: anywhere; }
.callout-detail { font-size: 12px; color: var(--inkSoft); overflow-wrap: anywhere; }
.callout-row { display: flex; gap: 10px; align-items: center; font-size: 10px; color: var(--inkSoft); }
.callout-toggle { border: 0; background: none; padding: 0; font-size: 10px; color: var(--danger); text-decoration: underline; }
.callout-raw { font: 11px/15px var(--mono); color: var(--inkSoft); white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
.msg-user .callout { max-width: 520px; }

/* empty chat invitation */
/* a chat with no messages: the card centred both ways (the app's EmptyChatHint fills the room) */
.scroller.no-messages { display: flex; flex-direction: column; }
.scroller.no-messages > .column { flex: 1 0 auto; width: 100%; display: flex; flex-direction: column; justify-content: center; }
.invite { margin: 24px auto; max-width: 430px; padding: 26px 30px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.invite .shape path.fill { fill: var(--card); }
.invite .shape path.stitch { fill: none; stroke: var(--stitch); stroke-width: 1.25px; stroke-dasharray: 6 5; stroke-linecap: round; }
.invite .washi { left: 50%; top: -9px; }

.to-bottom {
  position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); width: 30px; height: 30px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 13px; display: grid; place-items: center;
  box-shadow: 0 1px 3px rgba(0,0,0,.12); opacity: 0; pointer-events: none; transition: opacity .15s;
}
.to-bottom.shown { opacity: 1; pointer-events: auto; }

/* toasts (file errors) */
.toasts { position: fixed; right: 16px; bottom: 16px; z-index: 40; display: flex; flex-direction: column; gap: 8px; max-width: min(380px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow-y: auto; }
.toast { flex: none; }
.toast { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--danger); background: var(--dangerWash); color: var(--ink); font-size: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.12); }
.toast > .icon { color: var(--danger); margin-top: 1px; }
.toast-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.toast-text strong { display: block; font-weight: 600; }
.toast button { border: 0; background: none; padding: 2px; color: var(--inkSoft); display: grid; place-items: center; }

/* drop overlay */
.drop { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgb(var(--paper-rgb) / .7); pointer-events: none; }
.drop-card { padding: 30px 40px; font-size: 20px; color: var(--ink); }
.drop-card .shape path.fill { fill: var(--card); }
.drop-card .shape path.stitch { fill: none; stroke: var(--ember); stroke-width: 1.5px; stroke-dasharray: 6 5; stroke-linecap: round; }

/* dialogs */
dialog { border: 0; padding: 0; background: transparent; color: var(--ink); max-width: calc(100vw - 32px); max-height: calc(100vh - 32px); overflow: visible; }
dialog::backdrop { background: rgba(0,0,0,.35); }
.sheet { background: var(--paper); border-radius: 12px; padding: 20px; box-shadow: 0 12px 40px rgba(0,0,0,.3); display: flex; flex-direction: column; gap: 14px; max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow: auto; }
.link-sheet { width: 480px; max-width: 100%; }
.notice-card { padding: 14px; border-radius: 12px; border: 1.5px solid var(--attention); background: var(--attentionWash); display: flex; flex-direction: column; gap: 12px; }
.notice-head { display: flex; align-items: center; gap: 9px; }
.hand { width: 26px; height: 26px; border-radius: 50%; background: var(--attention); color: var(--paper); display: grid; place-items: center; font-size: 13px; flex: none; }
.notice-head h2 { margin: 0; font: 600 16px/1.25 var(--rounded); }
.notice-card p { margin: 0; font-size: 12px; }
.site { display: flex; flex-direction: column; gap: 3px; }
.site-label { font-size: 12px; font-weight: 500; color: var(--inkSoft); }
.site-host { font: 600 14px/1.3 var(--mono); word-break: break-all; user-select: text; }
.board-text.address { word-break: break-all; max-height: 200px; }
.hidden-warn { display: flex; gap: 6px; align-items: flex-start; font-size: 12px; font-weight: 500; color: var(--caution); padding: 7px 10px; background: var(--cautionWash); border: 1.5px solid var(--caution); border-radius: 8px; }
.sheet-buttons { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.sheet-btn { border-radius: 10px; padding: 6px 14px; font: 600 13px/1.25 var(--rounded); border: 1px solid transparent; box-shadow: 0 1px 1.5px rgba(0,0,0,.12); transition: transform .08s; }
.sheet-btn:active { transform: scale(.98); filter: brightness(.95); }
.sheet-btn.soft { background: var(--paperDeep); color: var(--ink); border-color: rgb(var(--inkFaint-rgb) / .55); }
.sheet-btn.primary { background: var(--ember); color: var(--onEmber); }
.sheet-btn.primary:disabled { background: var(--paperDeep); color: var(--inkSoft); border: 1px dashed rgb(var(--inkFaint-rgb) / .55); box-shadow: none; cursor: default; transform: none; filter: none; }
.preview-sheet { padding: 8px; }
.preview-sheet img { display: block; max-width: min(700px, calc(100vw - 48px)); max-height: min(700px, calc(100vh - 80px)); object-fit: contain; border-radius: 6px; }
.text-sheet { width: 560px; height: 420px; max-width: 100%; padding: 12px; gap: 6px; }
.text-sheet h2, .info-sheet h2 { margin: 0; font: 600 13px/1.3 var(--rounded); overflow-wrap: anywhere; }
.text-sheet pre { flex: 1; min-height: 0; margin: 0; overflow: auto; font: 12px/16px var(--mono); white-space: pre; user-select: text; background: var(--card); border-radius: 8px; padding: 8px; }
.sheet-close { align-self: flex-end; }
.info-sheet { width: 520px; max-width: 100%; }
.info-sheet .viewer-note { font-size: 11px; color: var(--inkSoft); margin: -8px 0 0; }
.info-grid { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: 12px; margin: 0; }
.info-grid dt { color: var(--inkSoft); }
.info-grid dd { margin: 0; overflow-wrap: anywhere; }
.info-prompt { margin: 0; font: 12px/17px var(--system); white-space: pre-wrap; overflow-wrap: anywhere; background: var(--card); border-radius: 8px; padding: 8px 10px; max-height: 260px; overflow: auto; user-select: text; }
.info-prompt.none { color: var(--inkSoft); font-style: italic; }

/* ---- Parley Web: banner, row menu, header model picker, composer, context strip, forms */
.banner { flex: none; display: flex; gap: 8px; align-items: flex-start; padding: 8px 14px; font-size: 12px; font-weight: 500; color: var(--caution); background: var(--cautionWash); border-bottom: 1.5px solid var(--caution); }
.banner .icon { margin-top: 1px; }
.room-header .model-field { position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 10px; flex: 0 1 260px; min-width: 0; color: var(--inkSoft); }
.room-header .model-field .shape path { fill: var(--tag); stroke: var(--line); stroke-width: 1px; }
.room-header .model-field:focus-within .shape path { stroke: var(--ember); stroke-width: 1.5px; }
.model-input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 12px; color: var(--ink); padding: 2px 0; }
.model-input::placeholder { color: var(--inkSoft); opacity: .8; }
.model-refresh { border: 0; background: none; padding: 2px; color: var(--inkSoft); display: grid; place-items: center; border-radius: 50%; }
.model-refresh:disabled { opacity: .5; cursor: default; }
.model-refresh.spinning .icon { animation: spin 1.2s linear infinite; }
.title-input { flex: 1; min-width: 0; font: 600 15px/1.25 var(--rounded); color: var(--ink); background: var(--card); border: 1.5px solid var(--ember); border-radius: 8px; padding: 2px 8px; outline: none; }
.header-title { cursor: text; }
.row-main { padding-right: 30px; }
.row-remove { font-size: 12px; }
.paper-btn:disabled { opacity: .4; cursor: default; }
.paper-btn:disabled:hover { background: var(--card); color: var(--inkSoft); }
.msg-user .actions { gap: 4px; flex-wrap: wrap; justify-content: flex-end; max-width: 120px; }
.callout-hint { font-size: 11px; color: var(--inkSoft); overflow-wrap: anywhere; }
.reply-wait { display: flex; align-items: center; gap: 8px; color: var(--inkSoft); font-size: 12px; }

/* the composer and the strip under it */
.composer-wrap { flex: none; max-width: 780px; width: 100%; margin: 0 auto; padding: 4px 16px 0; display: flex; flex-direction: column; gap: 6px; }
.composer { position: relative; display: flex; align-items: flex-end; gap: 6px; padding: 6px 8px; }
.composer .shape path { fill: var(--card); stroke: var(--line); stroke-width: 1px; }
.composer:focus-within .shape path { stroke: var(--ember); stroke-width: 1.5px; }
.composer-input { flex: 1; min-width: 0; resize: none; border: 0; outline: none; background: transparent; font: 14px/20px var(--system); color: var(--ink); padding: 5px 4px; max-height: 180px; }
.composer-input::placeholder { color: var(--inkSoft); opacity: .8; }
.composer .round-btn { flex: none; background: transparent; }
.composer .round-btn:hover:not(:disabled) { background: var(--paperDeep); }
.composer .round-btn:disabled { opacity: .4; cursor: default; }
.send-btn { flex: none; width: 32px; height: 32px; border-radius: 50%; border: 0; padding: 0; display: grid; place-items: center; font-size: 15px; background: var(--ember); color: var(--onEmber); }
.send-btn:disabled { background: var(--paperDeep); color: var(--inkSoft); cursor: default; }
.send-btn:active:not(:disabled) { opacity: .8; }
.edit-bar { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink); padding: 6px 10px; border-radius: 8px; background: var(--emberWash); }
.edit-bar .edit-text { flex: 1; min-width: 0; }
.draft-strip { display: flex; flex-wrap: wrap; gap: 8px; }
.draft-chip { padding-right: 6px; }
.draft-chip span { max-width: 160px; }
.draft-thumb { width: 28px; height: 28px; object-fit: cover; border-radius: 4px; }
.chip-remove { border: 0; background: none; padding: 2px; color: var(--inkSoft); display: grid; place-items: center; font-size: 10px; border-radius: 50%; }
.chip-remove:hover { color: var(--ink); }
.status-row { flex: none; max-width: 780px; width: 100%; margin: 0 auto; padding: 4px 16px 8px; display: flex; justify-content: flex-end; }
.status-btn { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 3px 10px; border-radius: 99px; font-size: 11px; color: var(--inkSoft); font-variant-numeric: tabular-nums; white-space: nowrap; max-width: 100%; overflow: hidden; }
.status-btn:hover { background: var(--paperDeep); }
.strip-item { display: inline-flex; align-items: center; gap: 3px; }
.strip-item.strong { color: var(--ink); }
.strip-dot { color: var(--inkFaint); }
.ring { flex: none; }

/* sheets and forms */
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field-label { font-size: 12px; font-weight: 500; color: var(--inkSoft); }
.field-input { font: 13px/1.3 var(--system); color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; min-width: 0; width: 100%; outline: none; }
.field-input:focus-visible, .field-input:focus { border-color: var(--ember); box-shadow: 0 0 0 1px var(--ember); }
.field-input[aria-invalid="true"] { border-color: var(--danger); }
.field-input.narrow { max-width: 150px; }
.field-input:disabled { opacity: .55; }
.prompt-input { resize: vertical; font-family: var(--system); }
.field-stack { display: block; }
.field-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.check-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.sheet h2.lettered { margin: 0; font-size: 22px; }
.sheet h3.lettered { margin: 8px 0 0; font-size: 15px; }
.sheet-btn.danger { background: var(--danger); color: #fff; }
.sheet-buttons.start { justify-content: flex-start; }
.ask-sheet { width: 400px; max-width: 100%; }
.ask-message { margin: 0; font-size: 13px; }
.conv-sheet, .settings-sheet { width: 540px; max-width: 100%; }
.ctx-sheet { width: 380px; max-width: 100%; gap: 10px; }
.ctx-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.ctx-model { font-size: 11px; color: var(--inkSoft); overflow-wrap: anywhere; }
.ctx-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.ctx-card h3 { margin: 0; font-size: 15px; }
.ctx-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; }
/* "When the context is [80] % full" reads as one line. */
.ctx-row.threshold-row { flex-wrap: nowrap; white-space: nowrap; }
.ctx-help { font-size: 11px; color: var(--inkSoft); overflow-wrap: anywhere; }
.ctx-grid { font-size: 13px; font-variant-numeric: tabular-nums; }
.gauge { height: 9px; border-radius: 99px; background: var(--paperDeep); border: 1px solid var(--line); overflow: hidden; }
.gauge-fill { height: 100%; min-width: 9px; border-radius: 99px; }
.warn-text { color: var(--caution); font-size: 12px; }
.danger-text { color: var(--danger); }
.server-list { display: flex; flex-direction: column; gap: 6px; }
.server-row { display: flex; align-items: baseline; gap: 8px; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 7px 10px; min-width: 0; }
.server-row.selected { border-color: var(--ember); }
.server-name { font-weight: 600; flex: none; }
.server-sub { flex: 1; min-width: 0; font-size: 11px; color: var(--inkSoft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.server-default { font-size: 10px; color: var(--emberText); flex: none; }
.server-form { display: flex; flex-direction: column; gap: 10px; border-top: 1px dashed var(--inkFaint); padding-top: 10px; }
.privacy-list { margin: 0; padding-left: 18px; font-size: 12px; color: var(--inkSoft); display: flex; flex-direction: column; gap: 4px; }

/* narrow windows: the wall becomes an overlay */
@media (max-width: 640px) {
  .app, .app.wall-hidden { grid-template-columns: minmax(0, 1fr); }
  .app .wall, .app.wall-hidden .wall {
    display: flex; position: fixed; z-index: 30; left: 0; top: 0; bottom: 0; width: min(300px, 86vw);
    transform: translateX(-104%); transition: transform .2s ease; box-shadow: 0 0 24px rgba(0,0,0,.25); visibility: hidden;
  }
  .app.wall-open .wall { transform: none; visibility: visible; }
  .app.wall-open .scrim { display: block; position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,.3); }
  .seam { display: none; }
  .msg { padding-left: 14px; padding-right: 14px; }
  .msg-user { padding-left: 40px; }
  .centred { padding: 28px 16px; }
  .room-header { padding: 0 12px; gap: 8px; }
  .room-header .model-field { flex-basis: 150px; }
  .composer-wrap, .status-row { padding-left: 10px; padding-right: 10px; }
  .parcel { max-width: 40vw; }
  .parcel-text { max-width: 30vw; }
  /* iOS Safari zooms the page when a field under 16px gets focus. */
  .composer-input, .field-input, #search-input, .model-field input, select { font-size: 16px; }
  .a-head { flex-wrap: wrap; }
  .a-head .actions { position: static; margin-left: auto; }
}
/* printing (or saving as PDF): the whole conversation, without the wall and the controls */
@media print {
  html, body { height: auto; overflow: visible; display: block; }
  .app, .app.wall-hidden { display: block; height: auto; }
  .wall, .scrim, .to-bottom, .toasts, .actions, .drop, .menu, .banner, .composer-wrap, .status-row, .model-field, .room-header .round-btn { display: none !important; }
  .room, .room-body, .scroller { display: block; overflow: visible; height: auto; min-height: 0; flex: none; }
  .msg { content-visibility: visible; contain-intrinsic-size: none; }
  .board-text, .info-prompt { max-height: none; overflow: visible; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation-duration: .01ms !important; }
}

<script>
(() => {
  'use strict';
  const Core = window.ParleyCore;
  const MD = window.ParleyMarkdown;
  const ART = window.PARLEY_ART || {};
  const SVGNS = 'http://www.w3.org/2000/svg';
  // Not the Reader's key: both pages may live on one origin, and each keeps its own look.
  const LOOK_KEY = 'parley-web.look';

  // ===========================================================================================
  // Language: English or Simplified Chinese, picked once at load from the browser's languages.
  // Every text the page writes itself goes through t(); text from a file never does. Placeholders
  // are {name}; both tables must have the same keys and the same placeholders (test_reader_page).
  // Codes the page matches (stored errors, tool results, damage details) stay in English.
  const STRINGS = {

  const obj = v => (v && typeof v === 'object' && !Array.isArray(v) ? v : null);
  const num = v => (typeof v === 'number' && Number.isFinite(v) ? v : null);
  const dateOf = v => { if (typeof v !== 'string') return null; const d = new Date(v); return isNaN(d.getTime()) ? null : d; };
  const fmt = (opts, d) => { try { return new Intl.DateTimeFormat(LOCALE, opts).format(d); } catch (_) { return ''; } };
  const fmtTime = d => fmt({ hour: 'numeric', minute: '2-digit' }, d);
  const fmtWeekday = d => fmt({ weekday: 'long' }, d);
  const fmtDate = d => fmt({ day: 'numeric', month: 'short', year: 'numeric' }, d);
  const fmtNoteTip = d => fmt({ weekday: 'short', hour: 'numeric', minute: '2-digit' }, d);
  const grouped = n => { try { return Number(n).toLocaleString(LOCALE); } catch (_) { return String(n); } };
  const rate = r => (r >= 100 ? String(Math.round(r)) : r.toFixed(1));
  const seconds = v => t('secondsShort', { n: v < 10 ? v.toFixed(2) : v.toFixed(1) });
  function thoughtFor(sec) {
    if (sec < 1) return t('lessThanSecond');
    if (sec < 60) return t('secondsShort', { n: Math.round(sec) });
    return t('minutesSeconds', { m: Math.floor(sec / 60), s: Math.floor(sec) % 60 });
  }
  function middle(text, max) {
    const chars = Array.from(text);
    if (chars.length <= max) return text;
    const head = Math.ceil((max - 1) / 2), tail = Math.floor((max - 1) / 2);
    return chars.slice(0, head).join('') + '…' + chars.slice(chars.length - tail).join('');
  }
  function relative(ms) {
    const diff = (ms - Date.now()) / 1000;
    const units = [['year', 31536000], ['month', 2592000], ['week', 604800], ['day', 86400], ['hour', 3600], ['minute', 60], ['second', 1]];
    try {
      const rtf = new Intl.RelativeTimeFormat(LOCALE, { numeric: 'auto' });
      for (const [unit, size] of units) if (Math.abs(diff) >= size || unit === 'second') return rtf.format(Math.round(diff / size), unit);
    } catch (_) { /* fall through */ }
    return fmtDate(new Date(ms));
  }
  function uuidSeed(id) {
    const t = str(id);
    if (/^[0-9a-fA-F]{4}/.test(t)) return parseInt(t.slice(0, 2), 16) * 251 + parseInt(t.slice(2, 4), 16);
    let a = 7;
    for (const b of new TextEncoder().encode(t)) a = (a * 31 + b) % 997;
    return a + 1;
  }
  function slipSeed(id) {
    let a = 7;
    for (const b of new TextEncoder().encode(str(id))) a = (a * 31 + b) % 997;
    return a;
  }

  // ===========================================================================================
  // Clipboard, announcements, copy buttons.
  const announcer = document.getElementById('announcer');
  function announce(text) { announcer.textContent = ''; setTimeout(() => { announcer.textContent = text; }, 30); }
  async function copyText(text) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); return true; }
    } catch (_) { /* fall back */ }
    const area = h('textarea', { 'aria-hidden': 'true', readonly: true });
    area.value = text;
    area.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
    document.body.append(area);
    area.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
    area.remove();
    return ok;
  }
  /** A copy button whose icon turns into a checkmark for 1.2 s. getText runs on click. */
  function copyButton(cls, label, tip, getText, copiedTip) {
    const btn = h('button', { type: 'button', class: cls, 'aria-label': label, title: tip });
    btn.append(icon('copy'));
    let timer = 0;
    on(btn, 'click', async ev => {
      ev.stopPropagation();
      const ok = await copyText(getText());
      if (!ok) { announce(t('copyFailed')); return; }
      announce(t('copied'));
      btn.replaceChildren(icon('check'));
      if (copiedTip) btn.title = copiedTip;
      clearTimeout(timer);
      timer = setTimeout(() => { btn.replaceChildren(icon('copy')); btn.title = tip; }, 1200);
    });
    return btn;
  }

  // ===========================================================================================
  // Conversations and their state. They live in ParleyStore (IndexedDB, or memory when the browser
  // refuses to store anything). Nothing else is kept in this browser except the look (localStorage)
  // and, only when the user ticks "Remember in this browser", a server's API key.
  // chat.js and context.js declare top-level constants (not window properties); store.js also sets a global.
  const Chat = ParleyChat;
  const Ctx = ParleyContext;
  const Store = ParleyStore;
  const DEFAULT_TITLE = 'New Chat'; // the app's default title: stored as is, shown translated
  const app = document.getElementById('app');
  const room = document.getElementById('room');
  const importInput = document.getElementById('import-input');
  const attachInput = document.getElementById('attach-input');
  const banner = document.getElementById('banner');

  // The app's ParleyError texts where they exist; the last two are the page's own.
  const ERROR_TEXT = {
    notParley: t('errNotParley'),
    corrupt: t('errCorrupt'),
    noWebCrypto: t('errNoWebCrypto'),
    unreadable: t('errUnreadable'),
  };
  const DAMAGE_DETAILS = new Set(['invalid JSON', 'missing version', 'missing encryption flag', 'invalid conversation data',
    'invalid encrypted header', 'invalid conversation id', 'unsupported key derivation function', 'unsupported cipher',
    'invalid iteration count', 'invalid salt', 'invalid payload encoding', 'encrypted payload is malformed',
    'invalid decrypted payload', 'conversation id does not match header']);

  function readText(file) {
    if (typeof file.text === 'function') return file.text();
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result));
      reader.onerror = () => reject(reader.error);
      reader.readAsText(file);
    });
  }

  /** ParleyError.errorDescription for a ReaderError (codes and fixed details only, never file text). */
  function errorText(e) {
    if (!e || e.name !== 'ReaderError') return ERROR_TEXT.unreadable;
    if (e.code === 'unsupportedVersion') {
      return /^-?\d{1,20}$/.test(e.detail) ? t('errVersion', { version: e.detail }) : t('errVersionUnknown');
    }
    // The damage details stay in English: they are fixed codes, as in the app.
    if (e.code === 'corrupt') return DAMAGE_DETAILS.has(e.detail) ? t('errCorruptDetail', { detail: e.detail }) : ERROR_TEXT.corrupt;
    return Object.prototype.hasOwnProperty.call(ERROR_TEXT, e.code) ? ERROR_TEXT[e.code] : ERROR_TEXT.unreadable;
  }

  // ---- state
  /** One entry per stored conversation. `row` is the store's index row; the conversation is loaded
   *  when the entry is first shown. An encrypted one stays `conversation: null` until unlocked. */
  const entries = [];
  let selectedKey = null;
  let store = null;
  let storage = { kind: 'browser', persisted: null };
  let providers = [];
  const prefs = { defaultProviderID: null, autoCompact: true, threshold: Ctx.DEFAULT_THRESHOLD_PERCENT, manualContext: {}, learnedContext: {} };
  /** What this page has seen refused this session: "None" fields and stream_options, per server and model. */
  const refusedThinkingOff = new Set();
  const refusedStreamOptions = new Set();
  const modelCache = new Map(); // provider id -> {models, error, loading}

  function makeEntry(row) {
    return {
      key: row.id, id: row.id, row, encrypted: row.encrypted === true, header: null, keyInfo: null, conversation: null,
      loaded: false, loading: false, loadFailed: false, blobs: [], view: null,
      decrypting: null, unlockError: null, unlockShake: false,
      run: null, runDone: null, saveTimer: 0, saving: Promise.resolve(), discarded: false,
      draft: { text: '', attachments: [], editID: null, before: null },
      compactionError: null, compactionNotice: null,
    };
  }
  const entryOf = key => entries.find(e => e.key === key) || null;
  const isBusy = entry => entry.run !== null;
  const nameOf = c => {
    const title = str(c && c.title).trim();
    return !title ? t('untitled') : title === DEFAULT_TITLE ? t('newChat') : title;
  };
  function rowTitle(entry) {
    if (entry.encrypted && !entry.conversation) return t('encryptedRow');
    return entry.conversation ? nameOf(entry.conversation) : nameOf(entry.row);
  }
  function sortDate(entry) {
    const c = entry.conversation && !entry.encrypted ? dateOf(entry.conversation.updatedAt) : null;
    return c || dateOf(entry.row && entry.row.updatedAt) || new Date(0);
  }

  // ---- storage and settings
  function showStorageError(e) {
    toast(t('storageError'), String((e && e.message) || e));
  }
  function showBanner() {
    banner.replaceChildren(icon('triangleFill'), h('span', { text: t('bannerNoStorage') }));
    banner.hidden = false;
  }
  const posInt = v => (Number.isInteger(v) && v > 0 ? v : null);
  async function loadPrefs() {
    try {
      const saved = await store.settings.get('prefs', null);
      if (!obj(saved)) return;
      if (typeof saved.defaultProviderID === 'string') prefs.defaultProviderID = saved.defaultProviderID;
      if (typeof saved.autoCompact === 'boolean') prefs.autoCompact = saved.autoCompact;
      if (Number.isInteger(saved.threshold) && saved.threshold >= Ctx.THRESHOLD_MIN && saved.threshold <= Ctx.THRESHOLD_MAX) prefs.threshold = saved.threshold;
      for (const name of ['manualContext', 'learnedContext']) {
        const source = obj(saved[name]);
        if (!source) continue;
        for (const key of Object.keys(source)) if (posInt(source[key])) prefs[name][key] = source[key];
      }
    } catch (e) { showStorageError(e); }
  }
  function savePrefs() {
    store.settings.set('prefs', JSON.parse(JSON.stringify(prefs))).catch(showStorageError);
  }
  async function loadProviders() {
    try { providers = (await store.providers.list()).filter(p => obj(p) && typeof p.id === 'string'); } catch (e) { providers = []; showStorageError(e); }
  }
  /** Context values are kept per server and model; the key never contains text that could be a property name. */
  const ctxKey = (provider, model) => 'k|' + provider.id + '|' + model;

  // ---- servers
  const SERVER_KINDS = ['auto', 'lmStudio', 'llamaCpp', 'vLLM', 'ollama', 'strata', 'hosted'];
  /** The kind chat.js shapes "None (no thinking)" for; Automatic is unknown, as in the app before its probe answers. */
  const kindOf = provider => (provider && SERVER_KINDS.includes(provider.kind) && provider.kind !== 'auto' ? provider.kind : undefined);
  function providerFor(settings) {
    const id = str(settings && settings.providerID);
    return providers.find(p => p.id === id) || providers.find(p => p.id === prefs.defaultProviderID) || providers[0] || null;
  }
  const modelFor = (settings, provider) => str(settings && settings.model).trim() || (provider ? str(provider.defaultModel).trim() : '');
  /** The models of a server, cached for the session. Never throws. */
  async function ensureModels(provider, force) {
    if (!provider) return null;
    let cached = modelCache.get(provider.id);
    if (cached && cached.loading) return cached;
    if (cached && !force && !cached.error) return cached;
    cached = { models: cached ? cached.models : [], error: null, loading: true };
    modelCache.set(provider.id, cached);
    refreshModelUI(provider);
    try {
      cached.models = await Chat.listModels({ baseURL: provider.baseURL, apiKey: provider.apiKey });
    } catch (e) {
      cached.error = e;
    }
    cached.loading = false;
    refreshModelUI(provider);
    return cached;
  }
  function modelInfo(provider, model) {
    const cached = provider && modelCache.get(provider.id);
    return cached && model ? cached.models.find(m => m.id === model) || null : null;
  }
  /** A ChatError or other failure as one sentence in the interface language (title, detail, hint). */
  /** Server errors are stored and exported: no echoed API key, and no huge body. */
  const scrubError = (text, provider) => {
    let out = String(text);
    const k = provider && typeof provider.apiKey === 'string' ? provider.apiKey : '';
    if (k.length >= 4) out = out.split(k).join('…');
    return out.length > 4000 ? out.slice(0, 4000) + '…' : out;
  };
  function failureText(e) {
    const raw = e && e.message ? String(e.message) : String(e);
    const p = presentError(raw, {});
    let text = p.title;
    if (p.detail) text += ' ' + p.detail;
    if (isNetworkText(raw)) text += ' ' + t('netHint');
    return text;
  }
  const isNetworkText = raw => /^could not connect to the server\./i.test(raw.trim());

  // ---- list and loading
  async function refreshList() {
    let rows;
    try { rows = await store.list(); } catch (e) { showStorageError(e); return; }
    const byId = new Map(entries.map(e => [e.id, e]));
    const next = [];
    for (const row of rows) {
      const old = byId.get(row.id);
      if (old) {
        old.row = row;
        if (old.encrypted !== (row.encrypted === true) && !old.run) { old.encrypted = row.encrypted === true; reloadEntry(old); }
        next.push(old);
        byId.delete(row.id);
      } else {
        next.push(makeEntry(row));
      }
    }
    for (const gone of byId.values()) discardEntry(gone);
    entries.splice(0, entries.length, ...next);
    if (selectedKey && !entryOf(selectedKey)) { selectedKey = null; renderRoom(); }
    renderList();
  }
  let listTimer = 0;
  function renderListSoon() {
    if (listTimer) return;
    listTimer = setTimeout(() => { listTimer = 0; renderList(); }, 250);
  }
  /** Drops what is shown of an entry that no longer exists, and stops its reply. */
  function discardEntry(entry) {
    entry.discarded = true;
    clearTimeout(entry.saveTimer);
    if (entry.run) { entry.run.stopped = true; entry.run.controller.abort(); }
    entry.keyInfo = null; entry.header = null; entry.conversation = null;
    dropView(entry);
    const i = entries.indexOf(entry);
    if (i >= 0) entries.splice(i, 1);
  }
  async function loadEntry(entry) {
    if (entry.loaded || entry.loading || entry.discarded) return;
    entry.loading = true;
    entry.loadFailed = false;
    try {
      const got = await store.get(entry.id);
      if (!got) { await refreshList(); return; }
      if (got.kind === 'plain') { entry.encrypted = false; entry.conversation = got.conversation; entry.header = null; }
      else {
        entry.encrypted = true; entry.header = got.header; entry.conversation = null;
        if (entry.keyInfo) {
          // Unlocked here and saved from another tab: open it again with the key already in memory.
          try { entry.conversation = await Core.decryptWithKey(got.header, entry.keyInfo); } catch (_) { entry.keyInfo = null; entry.decrypting = null; }
        }
      }
      entry.loaded = true;
    } catch (_) {
      entry.loadFailed = true;
    } finally {
      entry.loading = false;
    }
    if (selectedKey === entry.key) renderRoom();
  }
  /** Forgets what is loaded (after a change made in another tab) and loads it again if it is shown. */
  function reloadEntry(entry) {
    entry.loaded = false;
    entry.conversation = null;
    entry.header = null;
    if (!entry.keyInfo) { entry.decrypting = null; }
    dropView(entry, true); // a save in another tab must not close this tab's open dialogs
    if (selectedKey === entry.key) renderRoom();
  }
  /** Brings the index row of an entry in line with its conversation after a save. */
  function syncRow(entry) {
    const c = entry.conversation;
    if (!c) return;
    entry.row = entry.encrypted ? { id: entry.id, title: Store.ENCRYPTED_TITLE, updatedAt: c.updatedAt, encrypted: true, messageCount: null } : { id: entry.id, title: c.title, updatedAt: c.updatedAt, encrypted: false, messageCount: c.messages.length };
    renderListSoon();
  }

  // ---- saving: after each change, and every couple of seconds while a reply streams
  function scheduleSave(entry, delay) {
    if (entry.discarded || entry.saveTimer) return;
    entry.saveTimer = setTimeout(() => { entry.saveTimer = 0; saveNow(entry); }, delay);
  }
  function saveNow(entry) {
    clearTimeout(entry.saveTimer);
    entry.saveTimer = 0;
    entry.saving = entry.saving.then(() => writeEntry(entry)).catch(() => {});
    return entry.saving;
  }
  async function writeEntry(entry) {
    const c = entry.conversation;
    if (!c || entry.discarded) return;
    if (entry.encrypted && !entry.keyInfo) return; // locked meanwhile: nothing to write with
    try {
      await store.put(c, entry.encrypted ? { key: entry.keyInfo } : undefined);
      syncRow(entry);
    } catch (e) {
      showStorageError(e);
    }
  }
  function touch(entry) {
    entry.conversation.updatedAt = Ctx.isoNow();
  }
  function flushSaves() {
    for (const entry of entries) if (entry.saveTimer) saveNow(entry);
  }

  // ---- files that leave the page: the one place a link element is made (see the page audit)
  /**
   * Gives the user a file. A browser with the File System Access API shows a save dialog (no
   * element, no URL); every other browser gets a download through a temporary link element made
   * here and nowhere else. The link points at a blob: URL of text the page just made.
   */
  async function saveTextFile(filename, text) {
    if (typeof window.showSaveFilePicker === 'function') {
      try {
        const handle = await window.showSaveFilePicker({ suggestedName: filename, types: [{ description: t('exportTypeName'), accept: { 'application/json': ['.json'] } }] });
        const writable = await handle.createWritable();
        await writable.write(text);
        await writable.close();
        return true;
      } catch (e) {
        if (e && e.name === 'AbortError') return false; // the user closed the dialog
        // Any other failure: use the download below.
      }
    }
    const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    link.rel = 'noopener';
    link.style.display = 'none';
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 15000);
    return true;
  }
  const fileNameFor = title => (Array.from(title.replace(/[\\/:*?"<>|\u0000-\u001f]+/g, ' ').trim()).slice(0, 60).join('').trim() || 'conversation') + '.json';

  async function exportEntry(entry) {
    try {
      let text;
      if (entry.encrypted && !entry.conversation) {
        const got = await store.get(entry.id);
        if (!got || got.kind !== 'encrypted') return;
        text = got.text;
      } else {
        text = await store.exportFile(entry.conversation, entry.encrypted ? entry.keyInfo : undefined);
      }
      const base = entry.encrypted ? t('encryptedRow') : nameOf(entry.conversation);
      await saveTextFile(fileNameFor(base), text);
    } catch (e) {
      toast(t('exportFailed'), String((e && e.message) || e));
    }
  }

  // ---- import: Parley files, plain or encrypted (encrypted ones are stored as they are and unlocked here)
  async function importFiles(fileList) {
    const files = Array.from(fileList || []);
    let first = null;
    const failed = [];
    for (const file of files) {
      const name = str(file.name) || t('untitledFile');
      try {
        const text = await readText(file);
        const parsed = store.importFile(text);
        if (parsed.kind === 'encrypted') {
          if (!(globalThis.crypto && globalThis.crypto.subtle)) { failed.push([name, ERROR_TEXT.noWebCrypto]); continue; }
          const known = entries.find(e => e.id === parsed.header.id);
          if (known) { first = first || known; toast(t('alreadyHere', { name: middle(name, 40) }), ''); continue; }
          first = first || { id: await store.putFile(text) };
        } else {
          // A plain file whose id is taken becomes a copy: nothing already stored is overwritten.
          const taken = entries.some(e => e.id === parsed.conversation.id.toUpperCase());
          const conversation = taken ? { ...parsed.conversation, id: Ctx.newID() } : parsed.conversation;
          first = first || { id: await store.put(conversation) };
        }
      } catch (e) {
        failed.push([name, e && e.name === 'ReaderError' ? errorText(e) : String((e && e.message) || e)]);
      }
    }
    if (failed.length > 3) {
      const names = failed.slice(0, 3).map(([name]) => t('quoted', { text: middle(name, 40) })).join(t('listSeparator'));
      toast(t('cantOpenMany', { count: failed.length }), t('cantOpenManyList', { names, more: failed.length - 3 }));
    } else {
      for (const [name, message] of failed) toast(t('cantOpenOne', { name: middle(name, 60) }), message);
    }
    await refreshList();
    if (first) { const entry = entryOf(first.id ? String(first.id).toUpperCase() : first.key); if (entry) select(entry.key); }
  }

  // ---- new, rename, delete, encrypt, lock
  async function newChat() {
    const fresh = entries.find(e => e.loaded && !e.encrypted && e.conversation && !e.conversation.messages.length
      && str(e.conversation.title) === DEFAULT_TITLE && !e.run);
    if (fresh) { select(fresh.key); return; }
    const provider = providerFor(null);
    const now = Ctx.isoNow();
    const settings = { model: provider ? str(provider.defaultModel).trim() : '', systemPrompt: '' };
    if (provider) settings.providerID = provider.id;
    const conversation = { id: Ctx.newID(), title: DEFAULT_TITLE, createdAt: now, updatedAt: now, settings, messages: [] };
    try { await store.put(conversation); } catch (e) { showStorageError(e); return; }
    await refreshList();
    const entry = entryOf(conversation.id);
    if (!entry) return;
    entry.conversation = conversation;
    entry.loaded = true;
    select(entry.key);
    if (entry.view) entry.view.composer.input.focus();
  }

  function renameEntry(entry) {
    if (!entry.conversation) return;
    openAsk({
      title: t('renameTitle'), confirmLabel: t('rename'),
      fields: [{ label: t('title'), value: str(entry.conversation.title), dir: 'auto' }],
      onConfirm: ([value]) => {
        const title = value.trim();
        if (!title) return t('titleEmpty');
        setTitle(entry, title);
        return null;
      },
    });
  }
  function setTitle(entry, title) {
    entry.conversation.title = title;
    touch(entry);
    saveNow(entry);
    if (entry.view) updateHeader(entry);
    renderList();
  }

  function askDelete(entry) {
    openAsk({
      title: t('deleteTitle'), message: t('deleteMessage', { title: rowTitle(entry) }), confirmLabel: t('delete'), danger: true,
      onConfirm: async () => {
        // Stop everything that could write the row back first, then remove it.
        entry.discarded = true;
        clearTimeout(entry.saveTimer); entry.saveTimer = 0;
        if (entry.run) { entry.run.stopped = true; entry.run.controller.abort(); }
        try { await entry.saving; await store.remove(entry.id); } catch (e) { entry.discarded = false; return String((e && e.message) || e); }
        await removeEntryLocally(entry);
        return null;
      },
    });
  }
  async function removeEntryLocally(entry) {
    const wasSelected = selectedKey === entry.key;
    discardEntry(entry);
    if (wasSelected) { selectedKey = null; renderRoom(); }
    renderList();
    announce(t('deleted'));
  }

  function askEncrypt(entry) {
    if (isBusy(entry)) { toast(t('busyNow'), ''); return; }
    if (!entry.conversation || entry.encrypted) return;
    if (!(globalThis.crypto && globalThis.crypto.subtle)) { toast(t('encryptTitle'), ERROR_TEXT.noWebCrypto); return; }
    openAsk({
      title: t('encryptTitle'), message: t('encryptMessage'), confirmLabel: t('encrypt'),
      fields: [{ label: t('password'), type: 'password' }, { label: t('confirmPassword'), type: 'password' }],
      onConfirm: async ([a, b]) => {
        if (a === '') return t('passwordEmpty');
        if (a !== b) return t('passwordsDiffer');
        try {
          const keyInfo = await Core.newKey(a);
          if (isBusy(entry) || entry.discarded) return t('busyNow');
          // From here every save (queued behind this one) writes encrypted; undone if the write fails.
          clearTimeout(entry.saveTimer); entry.saveTimer = 0;
          entry.keyInfo = keyInfo;
          entry.encrypted = true;
          const conversation = entry.conversation;
          entry.saving = entry.saving.then(() => store.put(conversation, { key: keyInfo }));
          try { await entry.saving; } catch (e) {
            entry.keyInfo = null; entry.encrypted = false;
            entry.saving = Promise.resolve();
            throw e;
          }
          syncRow(entry);
          if (entry.view) updateHeader(entry);
          renderList();
          announce(t('encrypted'));
        } catch (e) {
          return String((e && e.message) || e);
        }
        return null;
      },
    });
  }

  /** Stops what is running, writes the conversation one last time, then drops it and its key from memory. */
  async function lockEntry(entry) {
    if (!entry.encrypted || !entry.conversation) return;
    if (entry.run) { entry.run.stopped = true; entry.run.controller.abort(); try { await entry.runDone; } catch (_) { /* finished */ } }
    await saveNow(entry);
    entry.decrypting = null;
    entry.unlockError = null;
    entry.unlockShake = false;
    entry.keyInfo = null;
    entry.header = null;
    entry.conversation = null;
    entry.loaded = false;
    entry.draft = { text: '', attachments: [], editID: null, before: null };
    entry.compactionError = null;
    entry.compactionNotice = null;
    dropView(entry);
    renderList();
    if (selectedKey === entry.key) renderRoom();
    announce(t('locked'));
  }

  /** Drops everything decrypted or derived from a conversation: DOM, blob URLs, dialogs. */
  function dropView(entry, keepDialogs) {
    if (entry.view) { entry.view.io.disconnect(); dropShapes(entry.view.root); entry.view.root.remove(); revokeDraftBlobs(entry.view); entry.view = null; }
    for (const url of entry.blobs) URL.revokeObjectURL(url);
    entry.blobs = [];
    if (!keepDialogs) closeDialogs();
  }
  function select(key) {
    selectedKey = key;
    renderList();
    renderRoom();
    closeOverlayWall();
  }

  // ===========================================================================================
  // Toasts (file names and messages from the page, never conversation text).
  const toasts = document.getElementById('toasts');
  function toast(title, message) {
    const close = h('button', { type: 'button', 'aria-label': t('dismiss'), title: t('dismiss') }, icon('xmark'));
    const el = h('div', { class: 'toast' }, icon('triangleFill'), h('div', { class: 'toast-text' }, h('strong', { text: title }), message || ''), close);
    on(close, 'click', () => el.remove());
    toasts.append(el);
    setTimeout(() => el.remove(), 12000);
  }

  // ===========================================================================================
  // The wall: the stored conversations, grouped like the app.
  const listEl = document.getElementById('list');
  const searchInput = document.getElementById('search-input');
  const searchClear = document.getElementById('search-clear');
  const fold = t => t.normalize('NFD').replace(/\p{M}/gu, '').toLocaleLowerCase();

  const GROUP_TITLES = { Today: 'groupToday', Yesterday: 'groupYesterday', 'Previous 7 Days': 'groupWeek', Older: 'groupOlder' };
  function groupOf(date) {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
    const week = new Date(today); week.setDate(today.getDate() - 7);
    if (date >= today) return ['Today', fmtTime(date)];
    if (date >= yesterday) return ['Yesterday', fmtTime(date)];
    if (date >= week) return ['Previous 7 Days', fmtWeekday(date)];
    return ['Older', fmtDate(date)];
  }

  function renderList() {
    const hadFocus = listEl.contains(document.activeElement) ? document.activeElement.getAttribute('data-key') : null;
    dropShapes(listEl);
    listEl.replaceChildren();
    const query = fold(searchInput.value.trim());
    searchClear.hidden = searchInput.value === '';
    if (!entries.length) {
      listEl.append(h('div', { class: 'wall-empty' }, h('div', { class: 'lettered', text: t('wallBare') }), h('p', { text: t('wallBareHint') })));
      return;
    }
    const shown = entries.filter(e => !query || (!(e.encrypted && !e.conversation) && fold(rowTitle(e)).includes(query)))
      .map(e => ({ e, date: sortDate(e) }))
      .sort((a, b) => b.date - a.date);
    if (!shown.length) {
      listEl.append(h('div', { class: 'wall-empty' }, h('div', { class: 'lettered', text: t('notOnWall') }),
        h('p', { text: t('noMatch', { query: searchInput.value.trim() }) })));
      return;
    }
    const groups = new Map();
    for (const item of shown) {
      const [group, label] = groupOf(item.date);
      if (!groups.has(group)) groups.set(group, []);
      groups.get(group).push({ ...item, label });
    }
    for (const name of ['Today', 'Yesterday', 'Previous 7 Days', 'Older']) {
      const items = groups.get(name);
      if (!items) continue;
      const headId = 'group-' + name.replace(/\W/g, '');
      listEl.append(h('h2', { class: 'group-title', id: headId, text: t(GROUP_TITLES[name]) }));
      const ul = h('ul', { class: 'rows', 'aria-labelledby': headId });
      for (const { e, label } of items) ul.append(rowFor(e, label));
      listEl.append(ul);
    }
    if (hadFocus) { const again = listEl.querySelector(`[data-key="${CSS.escape(hadFocus)}"]`); if (again) again.focus(); }
  }

  function rowMenuItems(entry) {
    const items = [];
    if (entry.conversation) items.push([t('rename'), () => renameEntry(entry)]);
    items.push([t('export'), () => exportEntry(entry)]);
    if (entry.encrypted) { if (entry.conversation) items.push([t('lock'), () => lockEntry(entry)]); }
    else items.push([t('encryptEllipsis'), () => { const go = () => askEncrypt(entry); if (entry.loaded) go(); else loadEntry(entry).then(go); }]);
    items.push([t('deleteEllipsis'), () => askDelete(entry)]);
    return items;
  }

  function rowFor(entry, dateLabel) {
    const locked = entry.encrypted && !entry.conversation;
    const selected = entry.key === selectedKey;
    const title = rowTitle(entry);
    const li = h('li', { class: 'row' + (selected ? ' selected' : '') + (locked ? ' locked' : '') });
    const main = h('button', { type: 'button', class: 'row-main', 'data-key': entry.key, 'aria-current': selected ? 'true' : null },
      h('span', { class: 'row-text' }, h('span', { class: 'row-title', dir: locked ? null : 'auto', text: title }), h('span', { class: 'row-sub', text: dateLabel })));
    if (entry.encrypted) {
      const lockIcon = h('span', { class: 'row-lock', title: locked ? t('encryptedLocked') : t('encryptedUnlocked'), 'aria-label': locked ? t('locked') : t('unlocked'), role: 'img' }, icon(locked ? 'lockFill' : 'lockOpen'));
      main.append(lockIcon);
    }
    on(main, 'click', () => select(entry.key));
    on(main, 'keydown', ev => {
      if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {

        const all = [...listEl.querySelectorAll('.row-main')];
        const i = all.indexOf(main) + (ev.key === 'ArrowDown' ? 1 : -1);
        if (all[i]) all[i].focus();
      }
    });
    on(li, 'contextmenu', ev => { ev.preventDefault(); openMenu(ev.clientX, ev.clientY, rowMenuItems(entry), main); });
    const more = h('button', { type: 'button', class: 'row-remove', 'aria-label': t('rowMenu', { title }), title: t('rowMenuTip'), 'aria-haspopup': 'menu' }, icon('more'));
    on(more, 'click', ev => {
      ev.stopPropagation();
      const box = more.getBoundingClientRect();
      openMenu(box.left, box.bottom + 2, rowMenuItems(entry), more);
    });
    li.append(main, more);
    addShape(li, [{ seed: uuidSeed(entry.id), radius: 8, amplitude: 1.4 }]);
    li.append(washi('var(--marigold)', 34, 11, 6));
    return li;
  }

  on(searchInput, 'input', renderList);
  on(searchInput, 'keydown', ev => { if (ev.key === 'Escape' && searchInput.value) { ev.preventDefault(); searchInput.value = ''; renderList(); } });
  on(searchClear, 'click', () => { searchInput.value = ''; renderList(); searchInput.focus(); });

  // A small menu (sidebar rows).
  let menuEl = null;
  function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; } }
  function openMenu(x, y, items, returnFocus) {
    closeMenu();
    menuEl = h('div', { class: 'menu', role: 'menu' });
    for (const [label, act] of items) {
      const b = h('button', { type: 'button', role: 'menuitem', text: label });
      on(b, 'click', () => { closeMenu(); act(); });
      menuEl.append(b);
    }
    on(menuEl, 'keydown', ev => {
      if (ev.key === 'Escape') { ev.preventDefault(); closeMenu(); if (returnFocus && returnFocus.isConnected) returnFocus.focus(); }
      else if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
        ev.preventDefault();
        const all = [...menuEl.querySelectorAll('button')];
        const i = all.indexOf(document.activeElement) + (ev.key === 'ArrowDown' ? 1 : -1);
        all[(i + all.length) % all.length].focus();

    });

    const w = menuEl.offsetWidth, hh = menuEl.offsetHeight;
    menuEl.style.left = Math.max(8, Math.min(x, innerWidth - w - 8)) + 'px';
    menuEl.style.top = Math.max(8, Math.min(y, innerHeight - hh - 8)) + 'px';
    menuEl.querySelector('button').focus();
  }
  on(document, 'pointerdown', ev => { if (menuEl && !menuEl.contains(ev.target)) closeMenu(); });
  on(window, 'blur', closeMenu);

  // Sidebar: hide/show, overlay on narrow windows, seam drag.
  const narrow = window.matchMedia('(max-width: 640px)');
  function wallVisible() { return narrow.matches ? app.classList.contains('wall-open') : !app.classList.contains('wall-hidden'); }
  function hideWall() {
    if (narrow.matches) app.classList.remove('wall-open'); else app.classList.add('wall-hidden');
    renderHeaderToggle();
  }
  function showWall() {
    if (narrow.matches) { app.classList.add('wall-open'); setTimeout(() => searchInput.focus(), 50); } else app.classList.remove('wall-hidden');
    renderHeaderToggle();
  }
  function closeOverlayWall() { if (narrow.matches && app.classList.contains('wall-open')) { app.classList.remove('wall-open'); renderHeaderToggle(); } }
  on(document.getElementById('scrim'), 'click', closeOverlayWall);
  const onNarrow = () => { app.classList.remove('wall-open'); renderHeaderToggle(); };
  if (narrow.addEventListener) narrow.addEventListener('change', onNarrow); else if (narrow.addListener) narrow.addListener(onNarrow);
  const seam = document.getElementById('seam');
  on(seam, 'pointerdown', ev => {

    const up = () => { seam.removeEventListener('pointermove', move); seam.removeEventListener('pointerup', up); };
    on(seam, 'pointermove', move);
    on(seam, 'pointerup', up);

  // ===========================================================================================
  // The room: header + body, for the empty state, the unlock screen or a chat.
  function roundButton(iconName, label, tip, onClick) {
    const b = h('button', { type: 'button', class: 'round-btn', 'aria-label': label, title: tip }, icon(iconName));
    on(b, 'click', onClick);
    return b;
  }
  function tagButton(label, onClick, soft) {
    const b = h('button', { type: 'button', class: 'tag-btn' + (soft ? ' soft' : ''), text: label });
    addShape(b, [{ seed: 11, radius: 10, amplitude: 0.8 }], 'shadow-btn');
    on(b, 'click', onClick);
    return b;
  }
  let headerToggleSlot = null;
  function renderHeaderToggle() {
    if (!headerToggleSlot || !headerToggleSlot.isConnected) return;
    headerToggleSlot.replaceChildren();
    if (!wallVisible()) headerToggleSlot.append(roundButton('sidebar', t('showSidebar'), t('showSidebar'), showWall));
  }
  function header(titleText, subText, trailing, titleIsFixed) {
    headerToggleSlot = h('div', { style: 'display:contents' });
    const titles = h('div', { class: 'header-titles' });
    if (titleText) titles.append(h('div', { class: 'header-title', dir: titleIsFixed ? null : 'auto', text: titleText, title: titleText }));
    if (typeof subText === 'string') titles.append(h('div', { class: 'header-sub', text: subText, hidden: subText === '' }));
    return h('header', { class: 'room-header' }, headerToggleSlot, titles, ...(trailing || []));

  function tapedPicture(artName, width, aspect) {
    const frame = h('div', { class: 'taped' });
    frame.style.width = (width + 18) + 'px';
    addShape(frame, [{ seed: 7, radius: 9, amplitude: 1.2 }], 'shadow-pic');
    frame.__shape.svg.firstChild.style.fill = 'var(--card)';
    const img = h('img', { alt: '', 'data-art': artName, decoding: 'async', draggable: 'false' });
    img.style.aspectRatio = String(aspect);
    setArt(img);
    frame.append(img, washi('var(--rose)', 84, 22, -2.5, 'translateX(-50%)'));
